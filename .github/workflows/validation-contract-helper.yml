name: Validation Contract Helper

on:
  push:
    branches:
      - ci/trim-install-health-matrix

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/trim-install-health-matrix
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply contract changes
        run: python scripts/ci/apply_validation_contract.py
      - name: Commit generated non-workflow changes
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/core/tests/reports/release_publish_regressions.py \
                  apps/core/tests/reports/test_ci_trigger_policy.py \
                  tmp/release-simulator.generated.yml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Sync validation contract regressions and release evidence'
          git push origin HEAD:ci/trim-install-health-matrix
