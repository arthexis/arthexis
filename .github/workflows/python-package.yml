name: Python Package

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff lint
        run: python -m ruff check --config pyproject.toml apps arthexis config tests manage.py

  package:
    name: python / Package
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Check distributions exist
        run: test -n "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print -quit)"
      - name: Clean wheel install
        shell: bash
        run: |
          python -m venv /tmp/arthexis-package-install
          /tmp/arthexis-package-install/bin/python -m pip install --upgrade pip
          /tmp/arthexis-package-install/bin/python -m pip install dist/*.whl
          /tmp/arthexis-package-install/bin/python -m pip check
      - name: Installed package smoke check
        shell: bash
        run: |
          source /tmp/arthexis-package-install/bin/activate
          python -c "import arthexis"
          python -c "import django; print(django.get_version())"
