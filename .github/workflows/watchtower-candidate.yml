name: Watchtower candidate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  classify:
    name: Classify Arthexis main change
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.change.outputs.deploy }}
      stage: ${{ steps.change.outputs.stage }}
      force_deploy: ${{ steps.change.outputs.force_deploy }}
      run_name: ${{ steps.change.outputs.run_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify candidate
        id: change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          deploy=true
          stage="arthexis"
          force_deploy=false

          if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             python .github/scripts/is_version_only_rollover.py "$BEFORE_SHA" "$AFTER_SHA"; then
            deploy=false
          fi

          labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${AFTER_SHA}/pulls" --jq '[.[] | select(.merge_commit_sha == "'"$AFTER_SHA"'") | .labels[].name] | unique | .[]')"
          if grep -Fxq remote-only <<<"$labels"; then
            stage="remote-only"
          fi
          if grep -Fxq deploy <<<"$labels"; then
            force_deploy=true
          fi

          run_name="$(git show -s --format=%s "$AFTER_SHA")"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "force_deploy=$force_deploy" >> "$GITHUB_OUTPUT"
          echo "run_name=$run_name" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy stage=$stage force_deploy=$force_deploy run_name=$run_name"

  notify:
    name: Request Watchtower deployment
    needs: classify
    if: needs.classify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact Arthexis candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTHEXIS_SHA: ${{ github.sha }}
          WATCHTOWER_STAGE: ${{ needs.classify.outputs.stage }}
          FORCE_DEPLOY: ${{ needs.classify.outputs.force_deploy }}
          RUN_NAME: ${{ needs.classify.outputs.run_name }}
        run: |
          set -Eeuo pipefail
          [[ "$ARTHEXIS_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api             --method POST             -H "Accept: application/vnd.github+json"             /repos/arthexis/arthexis/dispatches             -f event_type='arthexis-candidate'             -F client_payload[arthexis_sha]="$ARTHEXIS_SHA"             -F client_payload[stage]="$WATCHTOWER_STAGE"             -F client_payload[force_deploy]="$FORCE_DEPLOY"             -f client_payload[run_name]="$RUN_NAME"
