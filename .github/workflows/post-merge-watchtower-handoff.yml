name: Post-Merge Watchtower Handoff

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  pull-requests: write
  contents: read

concurrency:
  group: post-merge-watchtower-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Watchtower handoff
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch accepted merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Merged PR #$PR_NUMBER does not expose a valid merge SHA."
            exit 1
          fi

          message="✅ Watchtower deploy handoff accepted for merge `$MERGE_SHA` via `watchtower-deploy.yml`."
          existing="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --jq ".[] | select(.body == \"$message\") | .id" | head -n 1)"
          if [[ -n "$existing" ]]; then
            echo "post_merge_handoff=already_accepted sha=$MERGE_SHA comment_id=$existing"
            exit 0
          fi

          if gh workflow run watchtower-deploy.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f candidate_sha="$MERGE_SHA"; then
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$message"
            echo "post_merge_handoff=accepted sha=$MERGE_SHA workflow=watchtower-deploy.yml"
          else
            status=$?
            message="❌ Watchtower deploy handoff failed for merge `$MERGE_SHA` while dispatching `watchtower-deploy.yml` (exit $status)."
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$message" || true
            echo "post_merge_handoff=failed sha=$MERGE_SHA workflow=watchtower-deploy.yml exit=$status" >&2
            exit "$status"
          fi
