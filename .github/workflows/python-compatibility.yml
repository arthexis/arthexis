name: python / Python compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      VERSION_PR: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'version') }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ contains(github.event.pull_request.labels.*.name, 'version') && fromJSON('["3.13"]') || (contains(github.event.pull_request.labels.*.name, 'workflow') && !contains(github.event.pull_request.labels.*.name, 'integration') && fromJSON('["3.13"]') || fromJSON('["3.10", "3.11", "3.13"]')) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version-only PR
        if: env.VERSION_PR == 'true'
        run: python3 .github/scripts/validate_version_only_pr.py "$BASE_SHA" "$HEAD_SHA"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: env.VERSION_PR != 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test runtime
        if: env.VERSION_PR != 'true'
        run: python -m pip install -e '.[dev]'

      - name: Compile rebuilt source
        if: env.VERSION_PR != 'true'
        id: compile
        continue-on-error: true
        run: python -m compileall -q apps arthexis scripts tests manage.py

      - name: Django startup check
        if: env.VERSION_PR != 'true'
        id: django_check
        continue-on-error: true
        run: python manage.py check --fail-level ERROR

      - name: Run test suite
        if: env.VERSION_PR != 'true'
        id: tests
        continue-on-error: true
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          WORKFLOW_PR: ${{ contains(github.event.pull_request.labels.*.name, 'workflow') }}
          INTEGRATION_PR: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'integration') }}
        run: |
          if [[ "$INTEGRATION_PR" == "true" ]]; then
            python -m pytest -q --durations=20 -n 4 --dist loadgroup -m "not reconciliation_e2e"
            if [[ "$PYTHON_VERSION" == "3.10" ]]; then
              python -m pytest -q --durations=20 -m reconciliation_e2e
            fi
          elif [[ "$WORKFLOW_PR" == "true" ]]; then
            python -m pytest -q --durations=20 -m workflow
          elif [[ "$PYTHON_VERSION" == "3.10" ]]; then
            python -m pytest -q --durations=20 -n 4 --dist loadgroup -m "not workflow and not reconciliation_e2e"
            python -m pytest -q --durations=20 -m reconciliation_e2e
          else
            python -m pytest -q --durations=20 -n 4 --dist loadgroup -m "not workflow and not reconciliation_e2e"
          fi

      - name: Require all validation checks
        if: always() && env.VERSION_PR != 'true'
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          DJANGO_CHECK_OUTCOME: ${{ steps.django_check.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          failed=0

          if [[ "$COMPILE_OUTCOME" != "success" ]]; then
            echo "::error::Compile rebuilt source: $COMPILE_OUTCOME"
            failed=1
          fi

          if [[ "$DJANGO_CHECK_OUTCOME" != "success" ]]; then
            echo "::error::Django startup check: $DJANGO_CHECK_OUTCOME"
            failed=1
          fi

          if [[ "$TEST_OUTCOME" != "success" ]]; then
            echo "::error::Test suite: $TEST_OUTCOME"
            failed=1
          fi

          exit "$failed"

  compatibility:
    name: python / Python compatibility
    needs: tests
    if: always() && needs.tests.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python versions
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Python compatibility matrix result: $TEST_RESULT"
            exit 1
          fi
