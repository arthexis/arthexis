name: Python Compatibility

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff lint (informational)
        continue-on-error: true
        run: python -m ruff check --config pyproject.toml apps arthexis config tests manage.py

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Audit Python 3.10 source compatibility
        if: matrix.python-version == '3.10'
        run: python scripts/check_python310_compat.py
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest
      - name: Install project
        shell: bash
        run: |
          if [[ "${{ matrix.python-version }}" == "3.10" ]]; then
            # The application runtime supports 3.10; modern static-analysis
            # tooling in the `ci` extra is allowed to require newer Python.
            python -m pip install -e '.[qa]'
          else
            python -m pip install -e '.[ci,qa]'
          fi
      - name: Verify Python 3.10 compatibility bootstrap
        if: matrix.python-version == '3.10'
        run: |
          python - <<'PY'
          import utils
          import tomllib
          from datetime import UTC, timezone
          from enum import StrEnum
          from typing import NotRequired, assert_never

          assert UTC is timezone.utc
          assert issubclass(StrEnum, str)
          assert NotRequired is not None
          assert callable(assert_never)
          assert hasattr(tomllib, "loads")
          PY
      - name: Tests
        run: python -m compileall -q apps arthexis config tests manage.py

  compatibility:
    name: python / Python compatibility
    if: always() && needs.tests.result != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python versions
        shell: bash
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Python compatibility matrix result: $TEST_RESULT"
            exit 1
          fi
