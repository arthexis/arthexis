name: Python Compatibility

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff lint
        run: python -m ruff check --config pyproject.toml apps arthexis config tests manage.py
      - name: Ruff format
        run: python -m ruff format --check --config pyproject.toml apps arthexis config tests manage.py

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest
      - name: Install project
        run: python -m pip install -e '.[ci,qa]'
      - name: Tests
        run: python -m compileall -q apps arthexis config tests manage.py

  compatibility:
    name: python / Python compatibility
    if: always() && needs.tests.result != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python versions
        shell: bash
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Python compatibility matrix result: $TEST_RESULT"
            exit 1
          fi
