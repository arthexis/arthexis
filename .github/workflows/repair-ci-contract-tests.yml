name: Repair CI Contract Tests

on:
  push:
    branches:
      - ci/fix-install-health-ci-policy

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/fix-install-health-ci-policy
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Rewrite stale CI contract tests
        run: python scripts/ci/repair_ci_contract_tests.py

      - name: Commit rewrite
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/core/tests/reports/release_publish_regressions.py
          git diff --cached --quiet && exit 0
          git commit -m 'test: replace legacy Linux sanity assertions'
          git push origin HEAD:ci/fix-install-health-ci-policy
