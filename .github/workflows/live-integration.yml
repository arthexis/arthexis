name: Live Integration

on:
  workflow_dispatch:

concurrency:
  group: arthexis-live-integration
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  live:
    name: Live Integration
    runs-on: [self-hosted, Linux, X64, arthexis-ci]
    timeout-minutes: 30
    steps:
      - name: Resolve exact main revision
        id: revision
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_sha="$(git ls-remote https://github.com/arthexis/arthexis.git refs/heads/main | awk '{print $1}')"
          test -n "$expected_sha"
          echo "sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "ARTHEXIS_EXPECTED_SHA=$expected_sha" >> "$GITHUB_ENV"
          echo "Testing main revision $expected_sha"

      - name: Checkout exact main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.revision.outputs.sha }}
          clean: true
          fetch-depth: 2
          persist-credentials: false

      - name: Skip pure version-rollover revisions
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          should_deploy=true
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
            if [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "VERSION" ]]; then
              should_deploy=false
              echo "HEAD changes only VERSION; this is a candidate rollover, not a new deployment candidate."
            fi
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

      - name: Verify runner prerequisites
        if: steps.candidate.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v gway
          gway --version
          sudo -n true

      - name: Upgrade GWAY from main
        if: steps.candidate.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n gway upgrade gway
          gway --version

      - name: Exercise managed live integration
        if: steps.candidate.outputs.should_deploy == 'true'
        shell: bash
        run: bash scripts/ci/live-integration.sh

      - name: Capture live integration diagnostics
        if: always() && steps.candidate.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set +e
          diagnostics="${RUNNER_TEMP}/arthexis-live-integration-${ARTHEXIS_EXPECTED_SHA}.txt"
          {
            echo '=== expected revision ==='
            echo "${ARTHEXIS_EXPECTED_SHA}"
            echo '=== managed checkout ==='
            gway path arthexis
            checkout="$(gway path arthexis 2>/dev/null || true)"
            if [[ -n "$checkout" && -d "$checkout/.git" ]]; then
              git -C "$checkout" rev-parse HEAD
              git -C "$checkout" status --short
            fi
            echo '=== managed environment ==='
            ls -ld /opt/arthexis /opt/arthexis/app /opt/arthexis/.venv 2>&1
            if [[ -x /opt/arthexis/.venv/bin/python ]]; then
              /opt/arthexis/.venv/bin/python --version
              /opt/arthexis/.venv/bin/python -m pip show arthexis 2>&1
            fi
            echo '=== GWAY ==='
            gway --version
            gway arthexis version
            gway arthexis node-role
            gway arthexis status
            gway arthexis good
            echo '=== systemd ==='
            systemctl --no-pager --full status 'gway-arthexis-*'
            systemctl --failed --no-pager
            echo '=== recent Arthexis journal ==='
            journalctl --no-pager --since '-10 minutes' -u 'gway-arthexis-*'
          } 2>&1 | tee "$diagnostics"
          echo "LIVE_INTEGRATION_DIAGNOSTICS=$diagnostics" >> "$GITHUB_ENV"

      - name: Upload live integration diagnostics
        if: always() && steps.candidate.outputs.should_deploy == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-integration-${{ steps.revision.outputs.sha }}
          path: ${{ env.LIVE_INTEGRATION_DIAGNOSTICS }}
          if-no-files-found: warn

      - name: Attest deployed candidate and roll VERSION forward
        if: success() && steps.candidate.outputs.should_deploy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          current_main="$(git ls-remote https://github.com/arthexis/arthexis.git refs/heads/main | awk '{print $1}')"
          if [[ "$current_main" != "$ARTHEXIS_EXPECTED_SHA" ]]; then
            echo "main moved during deployment: tested=$ARTHEXIS_EXPECTED_SHA current=$current_main" >&2
            echo "Refusing to attest an untested main revision." >&2
            exit 1
          fi

          attested_version="$(tr -d '[:space:]' < VERSION)"
          test -n "$attested_version"

          existing_pr="$(gh pr list --state open --search 'in:title [version-rollover]' --json number,title --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Version-rollover PR #$existing_pr is still open." >&2
            echo "Resolve it before rolling the candidate forward so the sequence remains linear." >&2
            exit 1
          fi

          next_version="$(python - "$attested_version" <<'PY'
          import re
          import sys

          value = sys.argv[1]
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", value)
          if not match:
              raise SystemExit(f"Unsupported VERSION format: {value!r}")
          major, minor, patch = map(int, match.groups())
          print(f"{major}.{minor}.{patch + 1}")
          PY
          )"

          short_sha="${ARTHEXIS_EXPECTED_SHA:0:12}"
          branch="automation/version-rollover-${next_version}-${short_sha}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$next_version" > VERSION
          git add VERSION
          git commit -m "Roll deployment candidate to ${next_version}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"

          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "[version-rollover] ${next_version}" \
            --body "Successful Arthexis deployment attestation and candidate rollover.\n\n- Attested version: \`${attested_version}\`\n- Attested SHA: \`${ARTHEXIS_EXPECTED_SHA}\`\n- Next candidate version: \`${next_version}\`\n- Live Integration run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nThe deployed Watchtower remains on the attested SHA/version. This PR changes only \`VERSION\` so that \`main\` advertises the next version being developed. Its merge is metadata only and must not itself trigger a deployment or earn another version.")"
          echo "Created version rollover: $pr_url"

          # Pull requests created with GITHUB_TOKEN do not recursively trigger the
          # usual pull_request workflows. Explicit workflow_dispatch calls attach
          # the repository's required checks to the rollover branch instead.
          for workflow in \
            python-package.yml \
            python-compatibility.yml \
            python-quality.yml \
            clean-install.yml; do
            gh workflow run "$workflow" --ref "$branch"
          done
