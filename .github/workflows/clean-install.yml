name: Clean Install

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff lint
        run: python -m ruff check --config pyproject.toml apps arthexis config tests manage.py
      - name: Ruff format
        run: python -m ruff format --check --config pyproject.toml apps arthexis config tests manage.py

  clean-install:
    name: Clean Install
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_OPTIONS: '--no-deprecation'
      ARTHEXIS_DB_BACKEND: sqlite
      ARTHEXIS_CI_INSTALL_SMOKE_DB_MODE: apply
      OCPP_STATE_REDIS_URL: redis://localhost:6379
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git python3-venv \
            libcairo2 libgdk-pixbuf-2.0-0 libpango-1.0-0 \
            libpangocairo-1.0-0 shared-mime-info
      - name: Start native Redis
        run: ./scripts/ci/start-native-redis.sh
      - name: Clean install check
        run: ./scripts/ci/install-linux-smoke.sh --cold
      - name: Verify Django migrations
        run: |
          source .venv/bin/activate
          python scripts/check_migration_conflicts.py
          python manage.py migrations check
      - name: Verify dependency consistency
        run: |
          source .venv/bin/activate
          python -m pip check
