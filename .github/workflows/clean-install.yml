name: Clean Install

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    name: Clean Install
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Install into an empty data directory
        env:
          ARTHEXIS_DATA_DIR: ${{ runner.temp }}/arthexis-clean-install
        run: ./install.sh
      - name: Verify the installed schema
        env:
          ARTHEXIS_DATA_DIR: ${{ runner.temp }}/arthexis-clean-install
        run: |
          .venv/bin/python manage.py check --fail-level ERROR
          .venv/bin/python manage.py makemigrations --check --dry-run
          .venv/bin/python manage.py ocpp_matrix
          .venv/bin/python -m pip check
