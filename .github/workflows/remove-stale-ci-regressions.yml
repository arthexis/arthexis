name: Remove stale CI regression assertions

on:
  push:
    branches:
      - ci/trim-install-health-matrix

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/trim-install-health-matrix
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Remove stale regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/core/tests/reports/release_publish_regressions.py')
          text = path.read_text(encoding='utf-8')

          text, removed_sanity = re.subn(
              r'\ndef test_linux_sanity_refreshes_cached_virtualenv_before_checks\(\) -> None:\n.*?(?=\ndef test_pr_ci_uses_runtime_python_version)',
              '\n',
              text,
              flags=re.S,
          )
          if removed_sanity != 1:
              raise SystemExit(f'expected one stale linux-sanity regression, found {removed_sanity}')

          replacement = '''\ndef test_release_simulator_requires_current_main_support_matrix_success() -> None:\n    workflow = _workflow_data("release-simulator.yml")\n    evaluate_job = workflow["jobs"]["evaluate"]\n    evaluate_step = _workflow_step(\n        evaluate_job, "Evaluate release blockers from install/upgrade pipeline state"\n    )\n    script = evaluate_step["with"]["script"]\n\n    assert "github.rest.repos.getBranch" in script\n    assert "defaultBranchSha" in script\n    assert (\n        "const ciRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo"\n        in script\n    )\n    assert "function workflowHealthEvidence(workflowName)" in script\n    assert "workflowHealthEvidence('Support Matrix')" in script\n    assert "supportMatrixSummary = supportMatrixEvidence.summary" in script\n    assert "run.head_sha === defaultBranchSha" in script\n    assert "${workflowName} has not run for current" in script\n\n'''
          text, replaced_health = re.subn(
              r'\ndef test_release_simulator_requires_current_main_install_health_success\(\) -> None:\n.*?(?=\ndef test_release_simulator_ignores_retired_install_health_issue_marker)',
              replacement,
              text,
              flags=re.S,
          )
          if replaced_health != 1:
              raise SystemExit(f'expected one stale Install Health regression, found {replaced_health}')

          path.write_text(text, encoding='utf-8')
          PY
          python -m ruff format apps/core/tests/reports/release_publish_regressions.py
          git diff --check
          python -m ruff check apps/core/tests/reports/release_publish_regressions.py
          python -m ruff format --check apps/core/tests/reports/release_publish_regressions.py
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/core/tests/reports/release_publish_regressions.py
          git commit -m "test: remove stale validation process assertions"
          git push origin HEAD:ci/trim-install-health-matrix
