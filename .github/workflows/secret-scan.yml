name: Secret Scan

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          install -m 0755 gitleaks "${RUNNER_TEMP}/gitleaks"
      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 \
              --log-opts="-1 $SHA"
          else
            "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 \
              --log-opts="$BEFORE..$SHA"
          fi
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 \
            --log-opts="$BASE_SHA..$HEAD_SHA"
      - name: Scan current tree
        if: github.event_name == 'workflow_dispatch'
        run: "${RUNNER_TEMP}/gitleaks detect --source . --no-git --redact --no-banner --exit-code 1"
