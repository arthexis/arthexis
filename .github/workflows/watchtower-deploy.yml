name: Watchtower Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: watchtower-deploy-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Watchtower Deploy
    if: >-
      github.repository == 'arthexis/arthexis' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, arthexis-ci]
    timeout-minutes: 45
    env:
      ARTHEXIS_DATA_DIR: /var/lib/arthexis
      ARTHEXIS_ALLOWED_HOSTS: arthexis.com
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Clean privileged Python bytecode from runner workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d "${GITHUB_WORKSPACE}" ]]; then
            sudo -n find "${GITHUB_WORKSPACE}" -type d -name __pycache__ -prune -exec rm -rf {} +
            sudo -n find "${GITHUB_WORKSPACE}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          fi

      - name: Checkout trusted main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted invocation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "arthexis/arthexis"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_main="$(git ls-remote https://github.com/arthexis/arthexis.git refs/heads/main | awk '{print $1}')"
          test -n "${remote_main}"
          test "${remote_main}" = "${GITHUB_SHA}"
          sudo -n true

      - name: Snapshot exact deployment pair
        shell: bash
        run: |
          set -Eeuo pipefail
          arthexis_sha="${GITHUB_SHA}"
          gway_sha="$(git ls-remote https://github.com/arthexis/gway.git refs/heads/main | awk '{print $1}')"
          test -n "${gway_sha}"
          test "$(git rev-parse HEAD)" = "${arthexis_sha}"

          arthexis_version="$(tr -d '[:space:]' < VERSION)"
          gway_version="$(curl --fail --silent --show-error "https://raw.githubusercontent.com/arthexis/gway/${gway_sha}/VERSION" | tr -d '[:space:]')"
          test -n "${arthexis_version}"
          test -n "${gway_version}"

          {
            echo "ARTHEXIS_EXPECTED_SHA=${arthexis_sha}"
            echo "ARTHEXIS_EXPECTED_VERSION=${arthexis_version}"
            echo "GWAY_EXPECTED_SHA=${gway_sha}"
            echo "GWAY_EXPECTED_VERSION=${gway_version}"
          } >> "${GITHUB_ENV}"

          echo "deployment_pair=arthexis@${arthexis_sha} gway@${gway_sha}"

      - name: Install exact canonical Gway
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv "${RUNNER_TEMP}/gway-venv"
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install --upgrade pip >/dev/null 2>&1
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install "gway[toml] @ git+https://github.com/arthexis/gway.git@${GWAY_EXPECTED_SHA}" >/dev/null 2>&1
          "${RUNNER_TEMP}/gway-venv/bin/gway" --help >/dev/null

      - name: Refuse stale deployment pair before mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          current_arthexis="$(git ls-remote https://github.com/arthexis/arthexis.git refs/heads/main | awk '{print $1}')"
          current_gway="$(git ls-remote https://github.com/arthexis/gway.git refs/heads/main | awk '{print $1}')"
          test "${current_arthexis}" = "${ARTHEXIS_EXPECTED_SHA}"
          test "${current_gway}" = "${GWAY_EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${ARTHEXIS_EXPECTED_SHA}"
          echo "deployment_pair=stable_before_mutation"

      - name: Deploy Arthexis through Gway system scope
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n "${RUNNER_TEMP}/gway-venv/bin/gway" install . --system --force >/dev/null 2>&1
          sudo -n test -f /var/lib/gway/projects/arthexis/pyproject.toml
          sudo -n test -f /var/lib/gway/projects/arthexis/install.sh

      - name: Prepare persistent Arthexis runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n mkdir -p "${ARTHEXIS_DATA_DIR}"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/install.sh >/dev/null 2>&1
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python -m pip install "gway[toml] @ git+https://github.com/arthexis/gway.git@${GWAY_EXPECTED_SHA}" >/dev/null 2>&1

      - name: Install canonical Watchtower Gway admin launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n install -d -m 0755 /usr/local/bin
          launcher="$(mktemp)"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -eu' \
            'export GWAY_CACHE_DIR=/var/lib/gway/cache' \
            'cd /var/lib/gway/projects/arthexis' \
            'exec /var/lib/gway/projects/arthexis/.venv/bin/gway "$@"' \
            >"${launcher}"
          chmod 0755 "${launcher}"
          sudo -n install -m 0755 "${launcher}" /usr/local/bin/gway
          rm -f "${launcher}"
          sudo -n /usr/local/bin/gway help security oauth client create >/dev/null
          sudo -n /usr/local/bin/gway security oauth client list >/dev/null
          sudo -n test -f /var/lib/gway/cache/security/state.sqlite
          echo "canonical_gway_admin=ok"

      - name: Install and start Arthexis systemd service
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway service stop --system --name web -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts arthexis.com' >/dev/null 2>&1
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/scripts/retire_legacy_web_service.py >/dev/null 2>&1
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway service install --backend systemd --system --name arthexis.com -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts arthexis.com' >/dev/null 2>&1
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway service restart --system --name arthexis.com --timeout 40 -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts arthexis.com' >/dev/null 2>&1
          sudo -n systemctl is-active --quiet arthexis-arthexis.com.service
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/ready.rx' >/dev/null 2>&1
          echo "service=active"

      - name: Provision Watchtower remote policy and services
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n install -d -m 0700 -o root -g root /var/lib/gway/cache
          if ! sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/remote.rx' >/dev/null; then
            echo "remote_provision=failed"
            sudo -n systemctl status gway-mcp-server.service --no-pager || true
            sudo -n systemctl status gway-remote-auth.service --no-pager || true
            sudo -n journalctl -u gway-mcp-server.service -n 50 --no-pager || true
            sudo -n journalctl -u gway-remote-auth.service -n 50 --no-pager || true
            exit 1
          fi
          sudo -n test -f /var/lib/gway/cache/security/state.sqlite
          sudo -n systemctl is-active --quiet gway-mcp-server.service
          sudo -n systemctl is-active --quiet gway-remote-auth.service
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/scripts/verify_remote_deployment.py local
          echo "remote_services=active"
      - name: Expose Arthexis publicly through Gway recipe
        shell: bash
        env:
          ARTHEXIS_CERTBOT_EMAIL: ${{ secrets.ARTHEXIS_CERTBOT_EMAIL }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${ARTHEXIS_CERTBOT_EMAIL}" ]]; then
            echo "public_exposure=failed"
            echo "ARTHEXIS_CERTBOT_EMAIL Actions secret is required to converge the public HTTPS surface." >&2
            exit 1
          fi

          public_ipv4="$(getent ahostsv4 arthexis.com | awk 'NR == 1 {print $1}')"
          test -n "${public_ipv4}"

          if ! getent ahostsv4 remote.arthexis.com >/dev/null 2>&1; then
            dns_errors="$(mktemp)"
            chmod 600 "${dns_errors}"
            if ! sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/remote-dns.rx --public-ipv4 "'${public_ipv4}'"' \
              >/dev/null 2>"${dns_errors}"; then
              echo "dns_bootstrap=failed"
              tail -n 20 "${dns_errors}" || true
              rm -f "${dns_errors}"
              exit 1
            fi
            rm -f "${dns_errors}"
            echo "dns_bootstrap=ok"
          else
            echo "dns_bootstrap=existing"
          fi

          exposure_errors="$(mktemp)"
          chmod 600 "${exposure_errors}"
          if ! sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/watchtower.rx --email "'${ARTHEXIS_CERTBOT_EMAIL}'" --public-ipv4 "'${public_ipv4}'"' \
            >/dev/null 2>"${exposure_errors}"; then
            echo "public_exposure=failed"
            tail -n 30 "${exposure_errors}" || true
            rm -f "${exposure_errors}"
            exit 1
          fi
          rm -f "${exposure_errors}"

          echo "PUBLIC_EXPOSURE_ENABLED=true" >> "${GITHUB_ENV}"
          echo "public_exposure=ok"

      - name: Verify public remote access surface
        if: env.PUBLIC_EXPOSURE_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/scripts/verify_remote_deployment.py public
          echo "remote_public=ok"

      - name: Verify public Markdown root
        if: env.PUBLIC_EXPOSURE_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          root_html="$(curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors https://arthexis.com/)"
          grep -F '<h1 id="constellation">Constellation</h1>' <<<"${root_html}" >/dev/null
          grep -F '<h2 id="operational-capabilities">Operational Capabilities</h2>' <<<"${root_html}" >/dev/null
          echo "public_root=ok"

      - name: Verify deployed Arthexis
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py check --fail-level ERROR >/dev/null 2>&1
          echo "django_check=ok"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py makemigrations --check --dry-run >/dev/null 2>&1
          echo "migration_drift=none"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py ocpp_matrix >/dev/null 2>&1
          echo "ocpp_matrix=ok"


      - name: Revalidate deployment pair before attestation
        shell: bash
        run: |
          set -Eeuo pipefail
          current_arthexis="$(git ls-remote https://github.com/arthexis/arthexis.git refs/heads/main | awk '{print $1}')"
          current_gway="$(git ls-remote https://github.com/arthexis/gway.git refs/heads/main | awk '{print $1}')"
          test "${current_arthexis}" = "${ARTHEXIS_EXPECTED_SHA}"
          test "${current_gway}" = "${GWAY_EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${ARTHEXIS_EXPECTED_SHA}"
          echo "deployment_pair=stable_for_attestation"

      - name: Record accepted Watchtower deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          repository = os.environ["GITHUB_REPOSITORY"]
          api = os.environ["GITHUB_API_URL"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          state_branch = "watchtower-state"
          state_path = ".watchtower/accepted.json"

          manifest = {
              "arthexis_sha": os.environ["ARTHEXIS_EXPECTED_SHA"],
              "arthexis_version": os.environ["ARTHEXIS_EXPECTED_VERSION"],
              "gway_sha": os.environ["GWAY_EXPECTED_SHA"],
              "gway_version": os.environ["GWAY_EXPECTED_VERSION"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/{repository}/actions/runs/'
                  f'{os.environ["GITHUB_RUN_ID"]}'
              ),
              "accepted_at": datetime.now(timezone.utc).isoformat(),
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}/repos/{repository}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise

          status, _ = request("GET", f"git/ref/heads/{state_branch}")
          if status == 404:
              request(
                  "POST",
                  "git/refs",
                  {"ref": f"refs/heads/{state_branch}", "sha": manifest["arthexis_sha"]},
              )

          status, existing = request(
              "GET", f"contents/{state_path}?ref={state_branch}"
          )
          payload = {
              "message": (
                  "Record accepted Watchtower deployment "
                  f'{manifest["arthexis_sha"][:12]} + {manifest["gway_sha"][:12]}'
              ),
              "content": base64.b64encode(
                  (json.dumps(manifest, indent=2, sort_keys=True) + "\n").encode()
              ).decode(),
              "branch": state_branch,
          }
          if status != 404:
              payload["sha"] = existing["sha"]

          request("PUT", f"contents/{state_path}", payload)
          print(json.dumps(manifest, sort_keys=True))
          PY
