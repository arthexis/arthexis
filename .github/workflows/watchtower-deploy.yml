name: Watchtower Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [gway-candidate]
  workflow_dispatch:

concurrency:
  group: watchtower-deploy-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  classify:
    name: Classify Arthexis main change
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.change.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect version-only rollover
        id: change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          deploy=true
          if [[ "$EVENT_NAME" == "push" ]] &&
             [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BEFORE_SHA="$BEFORE_SHA" AFTER_SHA="$AFTER_SHA" python - <<'PY' > /tmp/deploy
          import os
          import re
          import subprocess

          before = os.environ["BEFORE_SHA"]
          after = os.environ["AFTER_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", before, after], text=True
          ).splitlines()

          version_only = set(changed) == {"VERSION", "pyproject.toml"}
          if version_only:
              old_version = subprocess.check_output(
                  ["git", "show", f"{before}:VERSION"], text=True
              ).strip()
              new_version = subprocess.check_output(
                  ["git", "show", f"{after}:VERSION"], text=True
              ).strip()
              old_pyproject = subprocess.check_output(
                  ["git", "show", f"{before}:pyproject.toml"], text=True
              )
              new_pyproject = subprocess.check_output(
                  ["git", "show", f"{after}:pyproject.toml"], text=True
              )
              pattern = re.compile(r'(?m)^(version\s*=\s*")[^"]+(".*)
    runs-on: [self-hosted, Linux, X64, arthexis-ci]
    timeout-minutes: 45
    env:
      ARTHEXIS_DATA_DIR: /var/lib/arthexis
      ARTHEXIS_ALLOWED_HOSTS: arthexis.com
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Clean privileged Python bytecode from runner workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d "${GITHUB_WORKSPACE}" ]]; then
            sudo -n find "${GITHUB_WORKSPACE}" -type d -name __pycache__ -prune -exec rm -rf {} +
            sudo -n find "${GITHUB_WORKSPACE}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          fi

      - name: Resolve exact deployment pair
        id: pair
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_GWAY_SHA: ${{ github.event.client_payload.gway_sha || '' }}
        run: |
          set -Eeuo pipefail

          current_arthexis="$(git ls-remote https://github.com/arthexis/arthexis.git refs/heads/main | awk '{print $1}')"
          current_gway="$(git ls-remote https://github.com/arthexis/gway.git refs/heads/main | awk '{print $1}')"
          [[ "$current_arthexis" =~ ^[0-9a-f]{40}$ ]]
          [[ "$current_gway" =~ ^[0-9a-f]{40}$ ]]

          previous_arthexis=""
          previous_gway=""
          previous_manifest="$(mktemp)"
          trap 'rm -f "$previous_manifest"' EXIT
          if curl --fail --silent --show-error --location             "https://raw.githubusercontent.com/arthexis/arthexis/watchtower-state/.watchtower/accepted.json"             --output "$previous_manifest"; then
            previous_arthexis="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("arthexis_sha", ""))' "$previous_manifest")"
            previous_gway="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("gway_sha", ""))' "$previous_manifest")"
          fi

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            [[ "$REQUESTED_GWAY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "repository_dispatch must provide a full Gway SHA." >&2
              exit 1
            }
            test "$REQUESTED_GWAY_SHA" = "$current_gway"
            gway_sha="$REQUESTED_GWAY_SHA"
            arthexis_sha="${previous_arthexis:-$current_arthexis}"
            source="gway"
          else
            test "${GITHUB_SHA}" = "$current_arthexis"
            arthexis_sha="${GITHUB_SHA}"
            gway_sha="${previous_gway:-$current_gway}"
            source="arthexis"
          fi

          [[ "$arthexis_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$gway_sha" =~ ^[0-9a-f]{40}$ ]]

          arthexis_version="$(curl --fail --silent --show-error             "https://raw.githubusercontent.com/arthexis/arthexis/$arthexis_sha/VERSION" | tr -d '[:space:]')"
          gway_version="$(curl --fail --silent --show-error             "https://raw.githubusercontent.com/arthexis/gway/$gway_sha/pyproject.toml" |
            python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
          test -n "$arthexis_version"
          test -n "$gway_version"

          arthexis_changed=true
          gway_changed=true
          [[ -n "$previous_arthexis" && "$previous_arthexis" == "$arthexis_sha" ]] && arthexis_changed=false
          [[ -n "$previous_gway" && "$previous_gway" == "$gway_sha" ]] && gway_changed=false

          {
            echo "ARTHEXIS_EXPECTED_SHA=$arthexis_sha"
            echo "ARTHEXIS_EXPECTED_VERSION=$arthexis_version"
            echo "GWAY_EXPECTED_SHA=$gway_sha"
            echo "GWAY_EXPECTED_VERSION=$gway_version"
            echo "ARTHEXIS_CHANGED=$arthexis_changed"
            echo "GWAY_CHANGED=$gway_changed"
          } >> "$GITHUB_ENV"

          {
            echo "arthexis_sha=$arthexis_sha"
            echo "gway_sha=$gway_sha"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"

          echo "deployment_pair source=$source arthexis=$arthexis_sha gway=$gway_sha"

      - name: Checkout exact Arthexis deployment SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.pair.outputs.arthexis_sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted invocation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "arthexis/arthexis"
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          sudo -n true

      - name: Install exact canonical Gway
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv "${RUNNER_TEMP}/gway-venv"
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install --upgrade pip >/dev/null 2>&1
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install "gway[toml] @ git+https://github.com/arthexis/gway.git@${GWAY_EXPECTED_SHA}" >/dev/null 2>&1
          "${RUNNER_TEMP}/gway-venv/bin/gway" --help >/dev/null

      - name: Verify exact deployment pair before mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          test -n "$GWAY_EXPECTED_SHA"
          echo "deployment_pair=stable_before_mutation"

      - name: Deploy Arthexis through Gway system scope
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n "${RUNNER_TEMP}/gway-venv/bin/gway" install . --system --force >/dev/null 2>&1
          sudo -n test -f /var/lib/gway/projects/arthexis/pyproject.toml
          sudo -n test -f /var/lib/gway/projects/arthexis/install.sh

      - name: Prepare persistent Arthexis runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n mkdir -p "${ARTHEXIS_DATA_DIR}"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/install.sh >/dev/null 2>&1
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python -m pip install "gway[toml] @ git+https://github.com/arthexis/gway.git@${GWAY_EXPECTED_SHA}" >/dev/null 2>&1

      - name: Install canonical Watchtower Gway admin launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n install -d -m 0755 /usr/local/bin
          launcher="$(mktemp)"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -eu' \
            'export GWAY_CACHE_DIR=/var/lib/gway/cache' \
            'cd /var/lib/gway/projects/arthexis' \
            'exec /var/lib/gway/projects/arthexis/.venv/bin/gway "$@"' \
            >"${launcher}"
          chmod 0755 "${launcher}"
          sudo -n install -m 0755 "${launcher}" /usr/local/bin/gway
          rm -f "${launcher}"
          sudo -n /usr/local/bin/gway help security oauth client create >/dev/null
          sudo -n /usr/local/bin/gway security oauth client list >/dev/null
          sudo -n test -f /var/lib/gway/cache/security/state.sqlite
          echo "canonical_gway_admin=ok"

      - name: Install and start Arthexis systemd service
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway service stop --system --name web -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts arthexis.com' >/dev/null 2>&1
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/scripts/retire_legacy_web_service.py >/dev/null 2>&1
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway service install --backend systemd --system --name arthexis.com -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts arthexis.com' >/dev/null 2>&1
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway service restart --system --name arthexis.com --timeout 40 -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts arthexis.com' >/dev/null 2>&1
          sudo -n systemctl is-active --quiet arthexis-arthexis.com.service
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/ready.rx' >/dev/null 2>&1
          echo "service=active"

      - name: Provision Watchtower remote policy and services
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n install -d -m 0700 -o root -g root /var/lib/gway/cache
          if ! sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/remote.rx' >/dev/null; then
            echo "remote_provision=failed"
            sudo -n systemctl status gway-mcp-server.service --no-pager || true
            sudo -n systemctl status gway-remote-auth.service --no-pager || true
            sudo -n journalctl -u gway-mcp-server.service -n 50 --no-pager || true
            sudo -n journalctl -u gway-remote-auth.service -n 50 --no-pager || true
            exit 1
          fi
          sudo -n test -f /var/lib/gway/cache/security/state.sqlite
          sudo -n systemctl is-active --quiet gway-mcp-server.service
          sudo -n systemctl is-active --quiet gway-remote-auth.service
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/scripts/verify_remote_deployment.py local
          echo "remote_services=active"
      - name: Expose Arthexis publicly through Gway recipe
        shell: bash
        env:
          ARTHEXIS_CERTBOT_EMAIL: ${{ secrets.ARTHEXIS_CERTBOT_EMAIL }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${ARTHEXIS_CERTBOT_EMAIL}" ]]; then
            echo "public_exposure=failed"
            echo "ARTHEXIS_CERTBOT_EMAIL Actions secret is required to converge the public HTTPS surface." >&2
            exit 1
          fi

          public_ipv4="$(getent ahostsv4 arthexis.com | awk 'NR == 1 {print $1}')"
          test -n "${public_ipv4}"

          if ! getent ahostsv4 remote.arthexis.com >/dev/null 2>&1; then
            dns_errors="$(mktemp)"
            chmod 600 "${dns_errors}"
            if ! sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/remote-dns.rx --public-ipv4 "'${public_ipv4}'"' \
              >/dev/null 2>"${dns_errors}"; then
              echo "dns_bootstrap=failed"
              tail -n 20 "${dns_errors}" || true
              rm -f "${dns_errors}"
              exit 1
            fi
            rm -f "${dns_errors}"
            echo "dns_bootstrap=ok"
          else
            echo "dns_bootstrap=existing"
          fi

          exposure_errors="$(mktemp)"
          chmod 600 "${exposure_errors}"
          if ! sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/watchtower.rx --email "'${ARTHEXIS_CERTBOT_EMAIL}'" --public-ipv4 "'${public_ipv4}'"' \
            >/dev/null 2>"${exposure_errors}"; then
            echo "public_exposure=failed"
            tail -n 30 "${exposure_errors}" || true
            rm -f "${exposure_errors}"
            exit 1
          fi
          rm -f "${exposure_errors}"

          echo "PUBLIC_EXPOSURE_ENABLED=true" >> "${GITHUB_ENV}"
          echo "public_exposure=ok"

      - name: Verify public remote access surface
        if: env.PUBLIC_EXPOSURE_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/scripts/verify_remote_deployment.py public
          echo "remote_public=ok"

      - name: Verify public Markdown root
        if: env.PUBLIC_EXPOSURE_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          root_html="$(curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors https://arthexis.com/)"
          grep -F '<h1 id="constellation">Constellation</h1>' <<<"${root_html}" >/dev/null
          grep -F '<h2 id="operational-capabilities">Operational Capabilities</h2>' <<<"${root_html}" >/dev/null
          echo "public_root=ok"

      - name: Verify deployed Arthexis
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py check --fail-level ERROR >/dev/null 2>&1
          echo "django_check=ok"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py makemigrations --check --dry-run >/dev/null 2>&1
          echo "migration_drift=none"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py ocpp_matrix >/dev/null 2>&1
          echo "ocpp_matrix=ok"


      - name: Revalidate deployment pair before attestation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          test -n "$GWAY_EXPECTED_SHA"
          echo "deployment_pair=stable_for_attestation"

      - name: Record accepted Watchtower deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          repository = os.environ["GITHUB_REPOSITORY"]
          api = os.environ["GITHUB_API_URL"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          state_branch = "watchtower-state"
          state_path = ".watchtower/accepted.json"

          manifest = {
              "arthexis_sha": os.environ["ARTHEXIS_EXPECTED_SHA"],
              "arthexis_version": os.environ["ARTHEXIS_EXPECTED_VERSION"],
              "gway_sha": os.environ["GWAY_EXPECTED_SHA"],
              "gway_version": os.environ["GWAY_EXPECTED_VERSION"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/{repository}/actions/runs/'
                  f'{os.environ["GITHUB_RUN_ID"]}'
              ),
              "accepted_at": datetime.now(timezone.utc).isoformat(),
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}/repos/{repository}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise

          status, _ = request("GET", f"git/ref/heads/{state_branch}")
          if status == 404:
              request(
                  "POST",
                  "git/refs",
                  {"ref": f"refs/heads/{state_branch}", "sha": manifest["arthexis_sha"]},
              )

          status, existing = request(
              "GET", f"contents/{state_path}?ref={state_branch}"
          )
          payload = {
              "message": (
                  "Record accepted Watchtower deployment "
                  f'{manifest["arthexis_sha"][:12]} + {manifest["gway_sha"][:12]}'
              ),
              "content": base64.b64encode(
                  (json.dumps(manifest, indent=2, sort_keys=True) + "\n").encode()
              ).decode(),
              "branch": state_branch,
          }
          if status != 404:
              payload["sha"] = existing["sha"]

          request("PUT", f"contents/{state_path}", payload)
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Dispatch certified package publishers
        shell: bash
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          WATCHTOWER_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          if [[ "$ARTHEXIS_CHANGED" != "true" && "$GWAY_CHANGED" != "true" ]]; then
            echo "publish_dispatch=not_needed"
            exit 0
          fi
          if [[ -z "$RELEASE_AUTOMATION_TOKEN" ]]; then
            echo "RELEASE_AUTOMATION_TOKEN is required to dispatch certified publishers." >&2
            exit 1
          fi

          dispatch() {
            local repo="$1"
            local deployed_sha="$2"
            local companion_sha="$3"
            GH_TOKEN="$RELEASE_AUTOMATION_TOKEN" gh workflow run pypi-publish.yml               --repo "$repo"               --ref main               -f deployed_sha="$deployed_sha"               -f companion_sha="$companion_sha"               -f watchtower_run="$WATCHTOWER_RUN"
          }

          if [[ "$GWAY_CHANGED" == "true" ]]; then
            dispatch arthexis/gway "$GWAY_EXPECTED_SHA" "$ARTHEXIS_EXPECTED_SHA"
            echo "gway_publish=dispatched"
          fi
          if [[ "$ARTHEXIS_CHANGED" == "true" ]]; then
            dispatch arthexis/arthexis "$ARTHEXIS_EXPECTED_SHA" "$GWAY_EXPECTED_SHA"
            echo "arthexis_publish=dispatched"
          fi
)
              old_match = pattern.search(old_pyproject)
              new_match = pattern.search(new_pyproject)
              if not (old_match and new_match):
                  version_only = False
              else:
                  pyproject_only_version = (
                      old_pyproject != new_pyproject
                      and pattern.sub(r'\1<VERSION>\2', old_pyproject, count=1)
                      == pattern.sub(r'\1<VERSION>\2', new_pyproject, count=1)
                  )
                  version_only = (
                      old_version != new_version
                      and new_match.group(1) is not None
                      and re.search(r'^version\s*=\s*"([^"]+)"', new_match.group(0)).group(1)
                      == new_version
                      and pyproject_only_version
                  )

          print("false" if version_only else "true")
          PY
            deploy="$(cat /tmp/deploy)"
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy"

  deploy:
    name: Watchtower Deploy
    needs: classify
    if: >-
      needs.classify.outputs.deploy == 'true' &&
      github.repository == 'arthexis/arthexis' &&
      (github.event_name == 'push' ||
       github.event_name == 'repository_dispatch' ||
       github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, arthexis-ci]
    timeout-minutes: 45
    env:
      ARTHEXIS_DATA_DIR: /var/lib/arthexis
      ARTHEXIS_ALLOWED_HOSTS: arthexis.com
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Clean privileged Python bytecode from runner workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d "${GITHUB_WORKSPACE}" ]]; then
            sudo -n find "${GITHUB_WORKSPACE}" -type d -name __pycache__ -prune -exec rm -rf {} +
            sudo -n find "${GITHUB_WORKSPACE}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          fi

      - name: Resolve exact deployment pair
        id: pair
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_GWAY_SHA: ${{ github.event.client_payload.gway_sha || '' }}
        run: |
          set -Eeuo pipefail

          current_arthexis="$(git ls-remote https://github.com/arthexis/arthexis.git refs/heads/main | awk '{print $1}')"
          current_gway="$(git ls-remote https://github.com/arthexis/gway.git refs/heads/main | awk '{print $1}')"
          [[ "$current_arthexis" =~ ^[0-9a-f]{40}$ ]]
          [[ "$current_gway" =~ ^[0-9a-f]{40}$ ]]

          previous_arthexis=""
          previous_gway=""
          previous_manifest="$(mktemp)"
          trap 'rm -f "$previous_manifest"' EXIT
          if curl --fail --silent --show-error --location             "https://raw.githubusercontent.com/arthexis/arthexis/watchtower-state/.watchtower/accepted.json"             --output "$previous_manifest"; then
            previous_arthexis="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("arthexis_sha", ""))' "$previous_manifest")"
            previous_gway="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("gway_sha", ""))' "$previous_manifest")"
          fi

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            [[ "$REQUESTED_GWAY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "repository_dispatch must provide a full Gway SHA." >&2
              exit 1
            }
            test "$REQUESTED_GWAY_SHA" = "$current_gway"
            gway_sha="$REQUESTED_GWAY_SHA"
            arthexis_sha="${previous_arthexis:-$current_arthexis}"
            source="gway"
          else
            test "${GITHUB_SHA}" = "$current_arthexis"
            arthexis_sha="${GITHUB_SHA}"
            gway_sha="${previous_gway:-$current_gway}"
            source="arthexis"
          fi

          [[ "$arthexis_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$gway_sha" =~ ^[0-9a-f]{40}$ ]]

          arthexis_version="$(curl --fail --silent --show-error             "https://raw.githubusercontent.com/arthexis/arthexis/$arthexis_sha/VERSION" | tr -d '[:space:]')"
          gway_version="$(curl --fail --silent --show-error             "https://raw.githubusercontent.com/arthexis/gway/$gway_sha/pyproject.toml" |
            python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
          test -n "$arthexis_version"
          test -n "$gway_version"

          arthexis_changed=true
          gway_changed=true
          [[ -n "$previous_arthexis" && "$previous_arthexis" == "$arthexis_sha" ]] && arthexis_changed=false
          [[ -n "$previous_gway" && "$previous_gway" == "$gway_sha" ]] && gway_changed=false

          {
            echo "ARTHEXIS_EXPECTED_SHA=$arthexis_sha"
            echo "ARTHEXIS_EXPECTED_VERSION=$arthexis_version"
            echo "GWAY_EXPECTED_SHA=$gway_sha"
            echo "GWAY_EXPECTED_VERSION=$gway_version"
            echo "ARTHEXIS_CHANGED=$arthexis_changed"
            echo "GWAY_CHANGED=$gway_changed"
          } >> "$GITHUB_ENV"

          {
            echo "arthexis_sha=$arthexis_sha"
            echo "gway_sha=$gway_sha"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"

          echo "deployment_pair source=$source arthexis=$arthexis_sha gway=$gway_sha"

      - name: Checkout exact Arthexis deployment SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.pair.outputs.arthexis_sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted invocation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "arthexis/arthexis"
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          sudo -n true

      - name: Install exact canonical Gway
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv "${RUNNER_TEMP}/gway-venv"
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install --upgrade pip >/dev/null 2>&1
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install "gway[toml] @ git+https://github.com/arthexis/gway.git@${GWAY_EXPECTED_SHA}" >/dev/null 2>&1
          "${RUNNER_TEMP}/gway-venv/bin/gway" --help >/dev/null

      - name: Verify exact deployment pair before mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          test -n "$GWAY_EXPECTED_SHA"
          echo "deployment_pair=stable_before_mutation"

      - name: Deploy Arthexis through Gway system scope
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n "${RUNNER_TEMP}/gway-venv/bin/gway" install . --system --force >/dev/null 2>&1
          sudo -n test -f /var/lib/gway/projects/arthexis/pyproject.toml
          sudo -n test -f /var/lib/gway/projects/arthexis/install.sh

      - name: Prepare persistent Arthexis runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n mkdir -p "${ARTHEXIS_DATA_DIR}"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/install.sh >/dev/null 2>&1
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python -m pip install "gway[toml] @ git+https://github.com/arthexis/gway.git@${GWAY_EXPECTED_SHA}" >/dev/null 2>&1

      - name: Install canonical Watchtower Gway admin launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n install -d -m 0755 /usr/local/bin
          launcher="$(mktemp)"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -eu' \
            'export GWAY_CACHE_DIR=/var/lib/gway/cache' \
            'cd /var/lib/gway/projects/arthexis' \
            'exec /var/lib/gway/projects/arthexis/.venv/bin/gway "$@"' \
            >"${launcher}"
          chmod 0755 "${launcher}"
          sudo -n install -m 0755 "${launcher}" /usr/local/bin/gway
          rm -f "${launcher}"
          sudo -n /usr/local/bin/gway help security oauth client create >/dev/null
          sudo -n /usr/local/bin/gway security oauth client list >/dev/null
          sudo -n test -f /var/lib/gway/cache/security/state.sqlite
          echo "canonical_gway_admin=ok"

      - name: Install and start Arthexis systemd service
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway service stop --system --name web -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts arthexis.com' >/dev/null 2>&1
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/scripts/retire_legacy_web_service.py >/dev/null 2>&1
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway service install --backend systemd --system --name arthexis.com -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts arthexis.com' >/dev/null 2>&1
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway service restart --system --name arthexis.com --timeout 40 -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts arthexis.com' >/dev/null 2>&1
          sudo -n systemctl is-active --quiet arthexis-arthexis.com.service
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/ready.rx' >/dev/null 2>&1
          echo "service=active"

      - name: Provision Watchtower remote policy and services
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n install -d -m 0700 -o root -g root /var/lib/gway/cache
          if ! sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/remote.rx' >/dev/null; then
            echo "remote_provision=failed"
            sudo -n systemctl status gway-mcp-server.service --no-pager || true
            sudo -n systemctl status gway-remote-auth.service --no-pager || true
            sudo -n journalctl -u gway-mcp-server.service -n 50 --no-pager || true
            sudo -n journalctl -u gway-remote-auth.service -n 50 --no-pager || true
            exit 1
          fi
          sudo -n test -f /var/lib/gway/cache/security/state.sqlite
          sudo -n systemctl is-active --quiet gway-mcp-server.service
          sudo -n systemctl is-active --quiet gway-remote-auth.service
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/scripts/verify_remote_deployment.py local
          echo "remote_services=active"
      - name: Expose Arthexis publicly through Gway recipe
        shell: bash
        env:
          ARTHEXIS_CERTBOT_EMAIL: ${{ secrets.ARTHEXIS_CERTBOT_EMAIL }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${ARTHEXIS_CERTBOT_EMAIL}" ]]; then
            echo "public_exposure=failed"
            echo "ARTHEXIS_CERTBOT_EMAIL Actions secret is required to converge the public HTTPS surface." >&2
            exit 1
          fi

          public_ipv4="$(getent ahostsv4 arthexis.com | awk 'NR == 1 {print $1}')"
          test -n "${public_ipv4}"

          if ! getent ahostsv4 remote.arthexis.com >/dev/null 2>&1; then
            dns_errors="$(mktemp)"
            chmod 600 "${dns_errors}"
            if ! sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/remote-dns.rx --public-ipv4 "'${public_ipv4}'"' \
              >/dev/null 2>"${dns_errors}"; then
              echo "dns_bootstrap=failed"
              tail -n 20 "${dns_errors}" || true
              rm -f "${dns_errors}"
              exit 1
            fi
            rm -f "${dns_errors}"
            echo "dns_bootstrap=ok"
          else
            echo "dns_bootstrap=existing"
          fi

          exposure_errors="$(mktemp)"
          chmod 600 "${exposure_errors}"
          if ! sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/watchtower.rx --email "'${ARTHEXIS_CERTBOT_EMAIL}'" --public-ipv4 "'${public_ipv4}'"' \
            >/dev/null 2>"${exposure_errors}"; then
            echo "public_exposure=failed"
            tail -n 30 "${exposure_errors}" || true
            rm -f "${exposure_errors}"
            exit 1
          fi
          rm -f "${exposure_errors}"

          echo "PUBLIC_EXPOSURE_ENABLED=true" >> "${GITHUB_ENV}"
          echo "public_exposure=ok"

      - name: Verify public remote access surface
        if: env.PUBLIC_EXPOSURE_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/scripts/verify_remote_deployment.py public
          echo "remote_public=ok"

      - name: Verify public Markdown root
        if: env.PUBLIC_EXPOSURE_ENABLED == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          root_html="$(curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors https://arthexis.com/)"
          grep -F '<h1 id="constellation">Constellation</h1>' <<<"${root_html}" >/dev/null
          grep -F '<h2 id="operational-capabilities">Operational Capabilities</h2>' <<<"${root_html}" >/dev/null
          echo "public_root=ok"

      - name: Verify deployed Arthexis
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py check --fail-level ERROR >/dev/null 2>&1
          echo "django_check=ok"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py makemigrations --check --dry-run >/dev/null 2>&1
          echo "migration_drift=none"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py ocpp_matrix >/dev/null 2>&1
          echo "ocpp_matrix=ok"


      - name: Revalidate deployment pair before attestation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          test -n "$GWAY_EXPECTED_SHA"
          echo "deployment_pair=stable_for_attestation"

      - name: Record accepted Watchtower deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          repository = os.environ["GITHUB_REPOSITORY"]
          api = os.environ["GITHUB_API_URL"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          state_branch = "watchtower-state"
          state_path = ".watchtower/accepted.json"

          manifest = {
              "arthexis_sha": os.environ["ARTHEXIS_EXPECTED_SHA"],
              "arthexis_version": os.environ["ARTHEXIS_EXPECTED_VERSION"],
              "gway_sha": os.environ["GWAY_EXPECTED_SHA"],
              "gway_version": os.environ["GWAY_EXPECTED_VERSION"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/{repository}/actions/runs/'
                  f'{os.environ["GITHUB_RUN_ID"]}'
              ),
              "accepted_at": datetime.now(timezone.utc).isoformat(),
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}/repos/{repository}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise

          status, _ = request("GET", f"git/ref/heads/{state_branch}")
          if status == 404:
              request(
                  "POST",
                  "git/refs",
                  {"ref": f"refs/heads/{state_branch}", "sha": manifest["arthexis_sha"]},
              )

          status, existing = request(
              "GET", f"contents/{state_path}?ref={state_branch}"
          )
          payload = {
              "message": (
                  "Record accepted Watchtower deployment "
                  f'{manifest["arthexis_sha"][:12]} + {manifest["gway_sha"][:12]}'
              ),
              "content": base64.b64encode(
                  (json.dumps(manifest, indent=2, sort_keys=True) + "\n").encode()
              ).decode(),
              "branch": state_branch,
          }
          if status != 404:
              payload["sha"] = existing["sha"]

          request("PUT", f"contents/{state_path}", payload)
          print(json.dumps(manifest, sort_keys=True))
          PY

      - name: Dispatch certified package publishers
        shell: bash
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          WATCHTOWER_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          if [[ "$ARTHEXIS_CHANGED" != "true" && "$GWAY_CHANGED" != "true" ]]; then
            echo "publish_dispatch=not_needed"
            exit 0
          fi
          if [[ -z "$RELEASE_AUTOMATION_TOKEN" ]]; then
            echo "RELEASE_AUTOMATION_TOKEN is required to dispatch certified publishers." >&2
            exit 1
          fi

          dispatch() {
            local repo="$1"
            local deployed_sha="$2"
            local companion_sha="$3"
            GH_TOKEN="$RELEASE_AUTOMATION_TOKEN" gh workflow run pypi-publish.yml               --repo "$repo"               --ref main               -f deployed_sha="$deployed_sha"               -f companion_sha="$companion_sha"               -f watchtower_run="$WATCHTOWER_RUN"
          }

          if [[ "$GWAY_CHANGED" == "true" ]]; then
            dispatch arthexis/gway "$GWAY_EXPECTED_SHA" "$ARTHEXIS_EXPECTED_SHA"
            echo "gway_publish=dispatched"
          fi
          if [[ "$ARTHEXIS_CHANGED" == "true" ]]; then
            dispatch arthexis/arthexis "$ARTHEXIS_EXPECTED_SHA" "$GWAY_EXPECTED_SHA"
            echo "arthexis_publish=dispatched"
          fi
