# CI refresh: evaluate rollover authentication against current workflow set
name: Watchtower Deploy
run-name: ${{ github.event.client_payload.run_name || github.workflow }}

on:
  repository_dispatch:
    types: [gway-candidate, arthexis-candidate]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact merged Arthexis SHA to classify and deploy"
        required: false
        type: string
      stage:
        description: "Watchtower deployment stage"
        required: true
        default: arthexis
        type: choice
        options:
          - arthexis
          - remote-only
          - release

concurrency:
  group: watchtower-deploy-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  classify:
    name: Classify Arthexis main change
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.change.outputs.deploy }}
      stage: ${{ steps.change.outputs.stage }}
      force_deploy: ${{ steps.change.outputs.force_deploy }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'repository_dispatch'
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect version-only rollover
        id: change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          AFTER_SHA: ${{ inputs.candidate_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          deploy=true
          stage="arthexis"
          force_deploy=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            stage="${{ inputs.stage }}"
          elif [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            stage="${{ github.event.client_payload.stage || 'arthexis' }}"
            if [[ "${{ github.event.client_payload.force_deploy || 'false' }}" == "true" ]]; then
              force_deploy=true
            fi
          elif [[ "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${AFTER_SHA}/pulls" --jq '[.[] | select(.merge_commit_sha == "'"$AFTER_SHA"'") | .labels[].name] | unique | .[]')"
            if grep -Fxq remote-only <<<"$labels"; then
              stage="remote-only"
            fi
            if grep -Fxq deploy <<<"$labels"; then
              force_deploy=true
            fi
          fi
          if [[ "$stage" != "arthexis" && "$stage" != "remote-only" && "$stage" != "release" ]]; then
            echo "Unsupported deployment stage: $stage" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] &&
             [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            BEFORE_SHA="$(git rev-parse "$AFTER_SHA^1")"
          fi
          if [[ "$EVENT_NAME" != "repository_dispatch" ]] &&
             [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             python .github/scripts/is_version_only_rollover.py "$BEFORE_SHA" "$AFTER_SHA"; then
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "force_deploy=$force_deploy" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy stage=$stage force_deploy=$force_deploy"


  queue-gate:
    name: Coalesce active PR queue
    needs: classify
    if: needs.classify.outputs.deploy == 'true' && (needs.classify.outputs.stage == 'arthexis' || needs.classify.outputs.stage == 'release')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.queue.outputs.deploy }}
      reason: ${{ steps.queue.outputs.reason }}
    steps:
      - name: Skip superseded deployment while PRs remain
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DEPLOY: ${{ needs.classify.outputs.force_deploy }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$FORCE_DEPLOY" == "true" || "${{ needs.classify.outputs.stage }}" == "release" ]]; then
            echo "watchtower_deploy=forced_by_release_or_deploy_label"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=forced" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          active=0
          for repository in arthexis/arthexis arthexis/gway; do
            prs="$(gh api --paginate "repos/$repository/pulls?state=open&per_page=100" --jq '.[] | select(([.labels[].name | ascii_downcase] | any(. == "on-hold" or . == "on hold")) | not) | [.number, .title] | @tsv')"
            if [[ -n "$prs" ]]; then
              echo "active_prs[$repository]=begin"
              printf '%s\n' "$prs"
              echo "active_prs[$repository]=end"
              active=1
            fi
          done
          if [[ "$active" == 1 ]]; then
            echo "watchtower_deploy=coalesced_active_pr_queue"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=active-pr-queue" >> "$GITHUB_OUTPUT"
          else
            echo "watchtower_deploy=queue_drained"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=queue-drained" >> "$GITHUB_OUTPUT"
          fi


  deployment-deferred:
    name: Deployment deferred — active PR queue
    needs: [classify, queue-gate]
    if: >-
      needs.classify.outputs.deploy == 'true' &&
      needs.classify.outputs.stage == 'arthexis' &&
      needs.queue-gate.outputs.deploy == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Explain deferred certification
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::notice title=Watchtower deployment deferred::No deployment or certification occurred because active PRs remained in the queue. A later queue-draining merge will retry the current pair."
          {
            echo "## Watchtower deployment deferred"
            echo
            echo "No deployment or certification occurred in this run."
            echo
            echo "- Reason: active PR queue"
            echo "- The current candidate pair will be reconsidered when the queue drains."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Watchtower Deploy
    needs: [classify, queue-gate]
    if: >-
      always() &&
      needs.classify.outputs.deploy == 'true' &&
      (needs.classify.outputs.stage == 'release' || needs.classify.outputs.stage != 'arthexis' || needs.queue-gate.outputs.deploy == 'true') &&
      github.repository == 'arthexis/arthexis' &&
      (github.event_name == 'repository_dispatch' ||
       github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, arthexis-ci]
    timeout-minutes: 45
    env:
      ARTHEXIS_DATA_DIR: /var/lib/arthexis
      ARTHEXIS_ALLOWED_HOSTS: arthexis.com
      PYTHONDONTWRITEBYTECODE: '1'
      WATCHTOWER_STAGE: ${{ needs.classify.outputs.stage }}
      RELEASE_INTENT: ${{ needs.classify.outputs.stage == 'release' && 'manual' || '' }}
    steps:
      - name: Clean privileged Python bytecode from runner workspace
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d "${GITHUB_WORKSPACE}" ]]; then
            sudo -n find "${GITHUB_WORKSPACE}" -type d -name __pycache__ -prune -exec rm -rf {} +
            sudo -n find "${GITHUB_WORKSPACE}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          fi

      - name: Resolve exact deployment pair
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        id: pair
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_GWAY_SHA: ${{ github.event.client_payload.gway_sha || '' }}
          REQUESTED_ARTHEXIS_SHA: ${{ github.event.client_payload.arthexis_sha || inputs.candidate_sha || '' }}
          EVENT_TYPE: ${{ github.event.action || '' }}
        run: |
          set -Eeuo pipefail

          retry_capture() {
            local attempts="$1"
            local delay="$2"
            shift 2
            local attempt output
            for attempt in $(seq 1 "$attempts"); do
              if output="$("$@")"; then
                printf '%s' "$output"
                return 0
              fi
              if [[ "$attempt" -lt "$attempts" ]]; then
                echo "watchtower_resolution=retrying attempt=$attempt/$attempts command=$1" >&2
                sleep "$delay"
              fi
            done
            echo "watchtower_resolution=exhausted attempts=$attempts command=$1" >&2
            return 1
          }

          current_arthexis="$(retry_capture 5 2 git ls-remote https://github.com/arthexis/arthexis.git refs/heads/main | awk '{print $1}')"
          current_gway="$(retry_capture 5 2 git ls-remote https://github.com/arthexis/gway.git refs/heads/main | awk '{print $1}')"
          [[ "$current_arthexis" =~ ^[0-9a-f]{40}$ ]]
          [[ "$current_gway" =~ ^[0-9a-f]{40}$ ]]

          previous_arthexis=""
          previous_gway=""
          previous_manifest="$(mktemp)"
          trap 'rm -f "$previous_manifest"' EXIT
          if curl --fail --silent --show-error --location             "https://raw.githubusercontent.com/arthexis/arthexis/watchtower-state/.watchtower/accepted.json"             --output "$previous_manifest"; then
            previous_arthexis="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("arthexis_sha", ""))' "$previous_manifest")"
            previous_gway="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("gway_sha", ""))' "$previous_manifest")"
          fi

          if [[ "$RELEASE_INTENT" == "manual" ]]; then
            [[ "$previous_arthexis" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Manual release requires a valid accepted Arthexis SHA." >&2
              exit 1
            }
            [[ "$previous_gway" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Manual release requires a valid accepted Gway SHA." >&2
              exit 1
            }
            arthexis_sha="$previous_arthexis"
            gway_sha="$previous_gway"
            source="accepted-release"
            echo "release_pair=accepted_manifest arthexis=$arthexis_sha gway=$gway_sha"
          elif [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            if [[ "$EVENT_TYPE" == "gway-candidate" ]]; then
              [[ "$REQUESTED_GWAY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo "gway-candidate dispatch must provide a full Gway SHA." >&2
                exit 1
              }
              if [[ "$REQUESTED_GWAY_SHA" == "$current_gway" ]]; then
                gway_sha="$REQUESTED_GWAY_SHA"
                source="gway"
              else
                compare_status="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
                  "https://api.github.com/repos/arthexis/gway/compare/$REQUESTED_GWAY_SHA...$current_gway" |
                  python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')"
                if [[ "$compare_status" != "ahead" ]]; then
                  echo "Gway candidate is not an ancestor of current main: requested=$REQUESTED_GWAY_SHA current=$current_gway status=$compare_status" >&2
                  exit 1
                fi
                echo "watchtower_resolution=superseded requested=$REQUESTED_GWAY_SHA current=$current_gway"
                gway_sha="$current_gway"
                source="gway-coalesced"
              fi
              arthexis_sha="$current_arthexis"
            elif [[ "$EVENT_TYPE" == "arthexis-candidate" ]]; then
              [[ "$REQUESTED_ARTHEXIS_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo "arthexis-candidate dispatch must provide a full Arthexis SHA." >&2
                exit 1
              }
              if [[ "$REQUESTED_ARTHEXIS_SHA" == "$current_arthexis" ]]; then
                arthexis_sha="$REQUESTED_ARTHEXIS_SHA"
                source="arthexis"
              else
                compare_status="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
                  "https://api.github.com/repos/arthexis/arthexis/compare/$REQUESTED_ARTHEXIS_SHA...$current_arthexis" |
                  python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')"
                if [[ "$compare_status" != "ahead" ]]; then
                  echo "Arthexis candidate is not an ancestor of current main: requested=$REQUESTED_ARTHEXIS_SHA current=$current_arthexis status=$compare_status" >&2
                  exit 1
                fi
                echo "watchtower_resolution=superseded requested=$REQUESTED_ARTHEXIS_SHA current=$current_arthexis"
                arthexis_sha="$current_arthexis"
                source="arthexis-coalesced"
              fi
              gway_sha="$current_gway"
            else
              echo "Unsupported repository dispatch type: $EVENT_TYPE" >&2
              exit 1
            fi
          else
            requested_arthexis="${REQUESTED_ARTHEXIS_SHA:-${GITHUB_SHA}}"
            [[ "$requested_arthexis" =~ ^[0-9a-f]{40}$ ]]
            test "$requested_arthexis" = "$current_arthexis"
            arthexis_sha="$requested_arthexis"
            # Arthexis deployments converge against current GWAY main. Reusing the
            # previously accepted GWAY SHA can downgrade the runtime after GWAY has
            # migrated durable state to a newer schema.
            gway_sha="$current_gway"
            source="arthexis"
          fi

          [[ "$arthexis_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$gway_sha" =~ ^[0-9a-f]{40}$ ]]

          arthexis_version="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors             "https://raw.githubusercontent.com/arthexis/arthexis/$arthexis_sha/VERSION" | tr -d '[:space:]')"
          # This runs before the canonical Gway venv exists. Keep it compatible with
          # the Watchtower host's Python 3.10 and do not assume tomllib/tomli is installed.
          gway_version="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors             "https://raw.githubusercontent.com/arthexis/gway/$gway_sha/pyproject.toml" |
            awk '
              /^\[project\][[:space:]]*$/ { in_project=1; next }
              /^\[/ && in_project { exit }
              in_project && /^[[:space:]]*version[[:space:]]*=/ {
                value=$0
                sub(/^[^=]*=[[:space:]]*/, "", value)
                sub(/[[:space:]]*#.*/, "", value)
                gsub(/^[[:space:]]*["'"'"']|["'"'"'][[:space:]]*$/, "", value)
                print value
                exit
              }
            ')"
          test -n "$arthexis_version"
          test -n "$gway_version"

          arthexis_changed=true
          gway_changed=true
          [[ -n "$previous_arthexis" && "$previous_arthexis" == "$arthexis_sha" ]] && arthexis_changed=false
          [[ -n "$previous_gway" && "$previous_gway" == "$gway_sha" ]] && gway_changed=false

          {
            echo "ARTHEXIS_EXPECTED_SHA=$arthexis_sha"
            echo "ARTHEXIS_EXPECTED_VERSION=$arthexis_version"
            echo "GWAY_EXPECTED_SHA=$gway_sha"
            echo "GWAY_EXPECTED_VERSION=$gway_version"
            echo "ARTHEXIS_CHANGED=$arthexis_changed"
            echo "GWAY_CHANGED=$gway_changed"
          } >> "$GITHUB_ENV"

          {
            echo "arthexis_sha=$arthexis_sha"
            echo "gway_sha=$gway_sha"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"

          echo "deployment_pair source=$source arthexis=$arthexis_sha gway=$gway_sha"
          if [[ "$RELEASE_INTENT" == "manual" ]]; then
            echo "WATCHTOWER_RELEASE_INTENT=manual" >> "$GITHUB_ENV"
          fi

      - name: Checkout exact Arthexis deployment SHA
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.pair.outputs.arthexis_sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted invocation
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "arthexis/arthexis"
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          sudo -n true

      - name: Install exact canonical Gway
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv "${RUNNER_TEMP}/gway-venv"
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install --upgrade pip >/dev/null 2>&1
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install "gway[toml] @ git+https://github.com/arthexis/gway.git@${GWAY_EXPECTED_SHA}" >/dev/null 2>&1
          "${RUNNER_TEMP}/gway-venv/bin/gway" --help >/dev/null

          sudo -n rm -rf /var/lib/gway/venv.next
          sudo -n python3 -m venv /var/lib/gway/venv.next
          sudo -n /var/lib/gway/venv.next/bin/python -m pip install --upgrade pip >/dev/null 2>&1
          sudo -n /var/lib/gway/venv.next/bin/python -m pip install "gway[toml] @ git+https://github.com/arthexis/gway.git@${GWAY_EXPECTED_SHA}" >/dev/null 2>&1
          sudo -n rm -rf /var/lib/gway/venv.previous
          if sudo -n test -d /var/lib/gway/venv; then
            sudo -n mv /var/lib/gway/venv /var/lib/gway/venv.previous
            echo "GWAY_RUNTIME_ROLLBACK_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "GWAY_RUNTIME_ROLLBACK_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
          sudo -n mv /var/lib/gway/venv.next /var/lib/gway/venv
          sudo -n chmod 0711 /var/lib/gway
          sudo -n chmod 0755 /var/lib/gway/venv /var/lib/gway/venv/bin
          echo "GWAY_RUNTIME_SWAPPED=true" >> "$GITHUB_ENV"
          sudo -n /var/lib/gway/venv/bin/python -m gway --help >/dev/null
          GWAY_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/gway" /var/lib/gway/venv/bin/python -m gway version >/dev/null

      - name: Verify exact deployment pair before mutation
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          test -n "$GWAY_EXPECTED_SHA"
          echo "deployment_pair=stable_before_mutation"

      - name: Deploy Arthexis through Gway system scope
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          install_log="${RUNNER_TEMP}/arthexis-product-install.log"
          stale_product=""

          # Recover only the known incomplete migration shape: /opt/arthexis exists
          # but is not a standard Arthexis project tree. Never move a live runtime.
          if sudo -n test -d /opt/arthexis &&
             ! sudo -n test -f /opt/arthexis/pyproject.toml; then
            unit=/etc/systemd/system/arthexis-arthexis.com.service
            if sudo -n test -f "${unit}"; then
              exec_start="$(sudo -n awk -F= '/^ExecStart=/{print substr($0,11)}' "${unit}")"
              if [[ "${exec_start}" == *"/opt/arthexis/"* ]]; then
                echo "Refusing to quarantine active incomplete /opt/arthexis runtime: ${exec_start}" >&2
                exit 1
              fi
            fi

            stale_product="/opt/.arthexis.incomplete-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            sudo -n rm -rf "${stale_product}"
            sudo -n mv /opt/arthexis "${stale_product}"
            echo "arthexis_product_quarantine=${stale_product}"
          fi

          if ! sudo -n "${RUNNER_TEMP}/gway-venv/bin/gway" install . --system --force >"${install_log}" 2>&1; then
            sudo -n python3 scripts/watchtower_diagnostics.py               --input "${install_log}"               --run-id "${GITHUB_RUN_ID}"               --attempt "${GITHUB_RUN_ATTEMPT}"               --step "arthexis-product-install"
            rm -f "${install_log}"
            echo "arthexis_product_install=failed diagnostic_source=recipe/watchtower-deploy"
            if [[ -n "${stale_product}" ]] &&
               ! sudo -n test -e /opt/arthexis &&
               sudo -n test -e "${stale_product}"; then
              sudo -n mv "${stale_product}" /opt/arthexis
              echo "arthexis_product_quarantine=restored"
            fi
            exit 1
          fi
          rm -f "${install_log}"

          if [[ -n "${stale_product}" ]]; then
            sudo -n rm -rf "${stale_product}"
          fi
          echo "arthexis_product_install=ok"
          sudo -n test -f /opt/arthexis/pyproject.toml
          sudo -n test -f /opt/arthexis/install.sh

      - name: Prepare persistent Arthexis runtime
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_log="${RUNNER_TEMP}/arthexis-runtime-install.log"
          sudo -n mkdir -p "${ARTHEXIS_DATA_DIR}"
          if ! sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /opt/arthexis/install.sh >"${runtime_log}" 2>&1; then
            sudo -n python3 scripts/watchtower_diagnostics.py               --input "${runtime_log}"               --run-id "${GITHUB_RUN_ID}"               --attempt "${GITHUB_RUN_ATTEMPT}"               --step "prepare-arthexis-runtime"
            rm -f "${runtime_log}"
            echo "arthexis_runtime=failed diagnostic_source=recipe/watchtower-deploy"
            exit 1
          fi
          rm -f "${runtime_log}"
          if /opt/arthexis/.venv/bin/python -c 'import gway' >/dev/null 2>&1; then
            echo "Arthexis product venv must not contain GWAY" >&2
            exit 1
          fi

      - name: Install canonical Watchtower Gway admin launcher
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n install -d -m 0755 /usr/local/bin
          launcher="$(mktemp)"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -eu' \
            'if [ "$(id -u)" -eq 0 ]; then' \
            '  export GWAY_CACHE_DIR=/var/lib/gway/cache' \
            'else' \
            '  export GWAY_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/gway"' \
            'fi' \
            'exec /var/lib/gway/venv/bin/python -m gway "$@"' \
            >"${launcher}"
          chmod 0755 "${launcher}"
          sudo -n install -m 0755 "${launcher}" /usr/local/bin/gway
          rm -f "${launcher}"
          /usr/local/bin/gway version >/dev/null
          sudo -n /usr/local/bin/gway help security oauth client create >/dev/null
          sudo -n /usr/local/bin/gway security oauth client list >/dev/null
          sudo -n test -f /var/lib/gway/cache/security/state.sqlite
          echo "canonical_gway_user=ok"
          echo "canonical_gway_admin=ok"

      - name: Converge public Gway bootstrap
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        env:
          ARTHEXIS_CERTBOT_EMAIL: ${{ secrets.ARTHEXIS_CERTBOT_EMAIL }}
        run: |
          set -Eeuo pipefail
          test -n "${ARTHEXIS_CERTBOT_EMAIL}"
          public_ipv4="$(getent ahostsv4 arthexis.com | awk 'NR == 1 {print $1}')"
          test -n "${public_ipv4}"
          recipe=/var/lib/gway/venv/share/gway/sampler/bootstrap/watchtower.rx
          sudo -n test -f "${recipe}"
          sudo -n /usr/local/bin/gway --recipe "${recipe}" \
            --email "${ARTHEXIS_CERTBOT_EMAIL}" \
            --public-ipv4 "${public_ipv4}"

          bootstrap="$(mktemp)"
          trap 'rm -f "${bootstrap}"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors \
            https://install.arthexis.com/gway --output "${bootstrap}"
          head -n 1 "${bootstrap}" | grep -Fx '#!/bin/sh' >/dev/null

          installer_page="$(mktemp)"
          trap 'rm -f "${bootstrap}" "${installer_page}"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors \
            https://install.arthexis.com/ --output "${installer_page}"
          grep -F 'id="installer"' "${installer_page}" >/dev/null
          grep -F 'id="command"' "${installer_page}" >/dev/null
          grep -Fx '# GWAY_BOOTSTRAP_V1' "${bootstrap}" >/dev/null
          if grep -F 'git+https://github.com/arthexis/gway' "${bootstrap}" >/dev/null; then
            echo "Public Gway bootstrap must install a certified release, not GitHub main." >&2
            exit 1
          fi
          echo "gway_bootstrap=public_ready"

      - name: Install and start Arthexis systemd service
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail

          service_diagnostics() {
            sudo -n systemctl status arthexis-arthexis.com.service --no-pager || true
            sudo -n journalctl -u arthexis-arthexis.com.service -n 80 --no-pager || true
          }

          if ! sudo -n sh -c 'cd /opt/arthexis && exec /usr/local/bin/gway service stop --system --name web -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts arthexis.com' >/dev/null 2>&1; then
            echo "legacy_web_stop=already_absent_or_inactive"
          fi

          sudo -n /var/lib/gway/venv/bin/python /opt/arthexis/scripts/retire_legacy_web_service.py

          if ! (cd /opt/arthexis && sudo -n /usr/local/bin/gway service install --backend systemd --system --name arthexis.com -- /opt/arthexis/.venv/bin/python -c 'from arthexis.server import main; main(host="127.0.0.1", port=8888, data_dir="/var/lib/arthexis", allowed_hosts="arthexis.com")'); then
            echo "arthexis_service_install=failed"
            service_diagnostics
            exit 1
          fi

          if ! (cd /opt/arthexis && sudo -n /usr/local/bin/gway service restart --system --name arthexis.com --timeout 40 -- /opt/arthexis/.venv/bin/python -c 'from arthexis.server import main; main(host="127.0.0.1", port=8888, data_dir="/var/lib/arthexis", allowed_hosts="arthexis.com")'); then
            echo "arthexis_service_restart=failed"
            service_diagnostics
            exit 1
          fi

          if ! sudo -n systemctl is-active --quiet arthexis-arthexis.com.service; then
            echo "arthexis_service_active=failed"
            service_diagnostics
            exit 1
          fi

          unit=/etc/systemd/system/arthexis-arthexis.com.service
          sudo -n test -f "${unit}"
          exec_start="$(sudo -n awk -F= '/^ExecStart=/{print substr($0,11)}' "${unit}")"
          test -n "${exec_start}"
          if [[ "${exec_start}" == *gway* ]]; then
            echo "Arthexis systemd ExecStart must not depend on GWAY: ${exec_start}" >&2
            exit 1
          fi
          if [[ "${exec_start}" != *"from arthexis.server import main; main("* ]]; then
            echo "Arthexis systemd ExecStart must use the accepted-build-compatible server callable: ${exec_start}" >&2
            exit 1
          fi

          if ! sudo -n systemctl restart arthexis-arthexis.com.service; then
            echo "arthexis_native_restart=failed"
            service_diagnostics
            exit 1
          fi
          if ! sudo -n systemctl is-active --quiet arthexis-arthexis.com.service; then
            echo "arthexis_native_restart_active=failed"
            service_diagnostics
            exit 1
          fi
          ready=false
          for attempt in $(seq 1 10); do
            if sudo -n env \
              ARTHEXIS_DATA_DIR=/var/lib/arthexis \
              ARTHEXIS_ALLOWED_HOSTS=arthexis.com \
              /opt/arthexis/.venv/bin/python -c \
              'from arthexis.ready import local; raise SystemExit(0 if local(host="127.0.0.1", port=8888, domain="arthexis.com", path="/health/", timeout=2) else 1)'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != true ]]; then
            echo "arthexis_ready=failed"
            service_diagnostics
            exit 1
          fi
          echo "service=active_independent_of_gway"

      - name: Preflight Watchtower Remote stage
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'remote-only' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x /usr/local/bin/gway
          test -x /opt/arthexis/.venv/bin/python
          sudo -n systemctl is-active --quiet arthexis-arthexis.com.service
          sudo -n test -f /opt/arthexis/deploy/remote.rx
          sudo -n test -f /opt/arthexis/deploy/remote-expose.rx
          sudo -n test -f /opt/arthexis/deploy/mcp-server.rx
          sudo -n /usr/local/bin/gway help remote serve >/dev/null
          echo "remote_units=begin"
          sudo -n systemctl show gway-mcp-server.service gway-remote-auth.service -p Id -p LoadState -p ActiveState -p SubState --no-pager || true
          echo "remote_units=end"
          echo "remote_listeners=begin"
          sudo -n ss -ltnp '( sport = :8000 or sport = :8001 )' || true
          echo "remote_listeners=end"

      - name: Converge Watchtower Remote stage
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'remote-only' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        env:
          ARTHEXIS_CERTBOT_EMAIL: ${{ secrets.ARTHEXIS_CERTBOT_EMAIL }}
        run: |
          set -Eeuo pipefail
          test -n "${ARTHEXIS_CERTBOT_EMAIL}"
          public_ipv4="$(getent ahostsv4 arthexis.com | awk 'NR == 1 {print $1}')"
          test -n "${public_ipv4}"
          cd /opt/arthexis
          sudo -n /usr/local/bin/gway --recipe deploy/remote.rx
          sudo -n /usr/local/bin/gway --recipe deploy/remote-expose.rx \
            --email "${ARTHEXIS_CERTBOT_EMAIL}" \
            --public-ipv4 "${public_ipv4}"

      - name: Verify Watchtower Remote stage
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'remote-only' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail

          remote_diagnostics() {
            sudo -n systemctl status gway-mcp-server.service gway-remote-auth.service --no-pager || true
            sudo -n ss -ltnp '( sport = :8000 or sport = :8001 )' || true
            sudo -n journalctl -u gway-mcp-server.service -u gway-remote-auth.service -n 80 --no-pager || true
          }

          sudo -n systemctl is-active --quiet gway-mcp-server.service
          sudo -n systemctl is-active --quiet gway-remote-auth.service
          cd /opt/arthexis

          # The local acceptance helper owns listener readiness. It retries both
          # ports after service restart, avoiding a one-shot probe racing systemd.
          if ! sudo -n /var/lib/gway/venv/bin/python scripts/verify_remote_deployment.py local; then
            remote_diagnostics
            exit 1
          fi
          if ! sudo -n /var/lib/gway/venv/bin/python scripts/verify_remote_deployment.py public; then
            remote_diagnostics
            exit 1
          fi
          echo "remote_services=active"
          echo "remote_acceptance=ok"

      - name: Preflight Watchtower Wire capability
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'remote-only' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x /usr/local/bin/gway
          test -x /opt/arthexis/.venv/bin/python
          sudo -n systemctl is-active --quiet arthexis-arthexis.com.service
          sudo -n /usr/local/bin/gway help wire >/dev/null
          sudo -n test -f /var/lib/gway/venv/share/gway/sampler/wire/watchtower.rx
          sudo -n /usr/local/bin/gway --json resolve wire watchtower | grep -F '"kind": "recipe"' >/dev/null
          sudo -n /usr/local/bin/gway --json resolve wire watchtower | grep -F 'sampler/wire/watchtower.rx' >/dev/null
          sudo -n /usr/local/bin/gway wire server check --domain register.arthexis.com >/dev/null
          echo "wire_preflight=ok"
          echo "wire_units=begin"
          sudo -n systemctl show gway-wire-enroll.service gway-wireguard-enroll.service -p Id -p LoadState -p ActiveState -p SubState --no-pager || true
          echo "wire_units=end"
          echo "wire_listener=begin"
          sudo -n ss -ltnp '( sport = :8787 )' || true
          echo "wire_listener=end"

      - name: Converge Watchtower Wire capability
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'remote-only' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        env:
          ARTHEXIS_CERTBOT_EMAIL: ${{ secrets.ARTHEXIS_CERTBOT_EMAIL }}
        run: |
          set -Eeuo pipefail
          test -n "${ARTHEXIS_CERTBOT_EMAIL}"
          public_ipv4="$(getent ahostsv4 arthexis.com | awk 'NR == 1 {print $1}')"
          test -n "${public_ipv4}"
          sudo -n /usr/local/bin/gway wire watchtower \
            --email "${ARTHEXIS_CERTBOT_EMAIL}" \
            --public-address "${public_ipv4}"

      - name: Verify Watchtower Wire capability
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'remote-only' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n systemctl is-active --quiet gway-wire-enroll.service
          if sudo -n systemctl is-active --quiet gway-wireguard-enroll.service; then
            echo "legacy_wire_enrollment=still_active" >&2
            exit 1
          fi
          sudo -n sh -c 'exec /usr/local/bin/gway log sources' | grep -F 'gway/wire-enroll' >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors \
            https://register.arthexis.com/health >/dev/null
          sudo -n /usr/local/bin/gway wire server check --domain register.arthexis.com >/dev/null
          echo "wire_extension=active"
          echo "legacy_wire_enrollment=retired"
          echo "wire_public_health=ok"

      - name: Verify deployed Arthexis
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /opt/arthexis/.venv/bin/python /opt/arthexis/manage.py check --fail-level ERROR >/dev/null 2>&1
          echo "django_check=ok"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /opt/arthexis/.venv/bin/python /opt/arthexis/manage.py makemigrations --check --dry-run >/dev/null 2>&1
          echo "migration_drift=none"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /opt/arthexis/.venv/bin/python /opt/arthexis/manage.py ocpp_matrix >/dev/null 2>&1
          echo "ocpp_matrix=ok"


      - name: Revalidate deployment pair before attestation
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          test -n "$GWAY_EXPECTED_SHA"
          echo "deployment_pair=stable_for_attestation"

      - name: Record accepted Watchtower deployment
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          repository = os.environ["GITHUB_REPOSITORY"]
          api = os.environ["GITHUB_API_URL"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          state_branch = "watchtower-state"
          state_path = ".watchtower/accepted.json"

          manifest = {
              "arthexis_sha": os.environ["ARTHEXIS_EXPECTED_SHA"],
              "arthexis_version": os.environ["ARTHEXIS_EXPECTED_VERSION"],
              "gway_sha": os.environ["GWAY_EXPECTED_SHA"],
              "gway_version": os.environ["GWAY_EXPECTED_VERSION"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/{repository}/actions/runs/'
                  f'{os.environ["GITHUB_RUN_ID"]}'
              ),
              "accepted_at": datetime.now(timezone.utc).isoformat(),
              "release_intent": os.environ.get("WATCHTOWER_RELEASE_INTENT") or None,
              "stages": ["arthexis", "remote"],
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}/repos/{repository}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise

          status, _ = request("GET", f"git/ref/heads/{state_branch}")
          if status == 404:
              request(
                  "POST",
                  "git/refs",
                  {"ref": f"refs/heads/{state_branch}", "sha": manifest["arthexis_sha"]},
              )

          status, existing = request(
              "GET", f"contents/{state_path}?ref={state_branch}"
          )
          payload = {
              "message": (
                  "Record accepted Watchtower deployment "
                  f'{manifest["arthexis_sha"][:12]} + {manifest["gway_sha"][:12]}'
              ),
              "content": base64.b64encode(
                  (json.dumps(manifest, indent=2, sort_keys=True) + "\n").encode()
              ).decode(),
              "branch": state_branch,
          }
          if status != 404:
              payload["sha"] = existing["sha"]

          request("PUT", f"contents/{state_path}", payload)
          print(json.dumps(manifest, sort_keys=True))
          PY
          echo "WATCHTOWER_DEPLOYMENT_ACCEPTED=true" >> "$GITHUB_ENV"

      - name: Restore previous Gway runtime after failed deployment
        if: ${{ failure() && env.WATCHTOWER_STAGE == 'arthexis' && env.GWAY_RUNTIME_SWAPPED == 'true' && env.WATCHTOWER_DEPLOYMENT_ACCEPTED != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${GWAY_RUNTIME_ROLLBACK_AVAILABLE:-false}" != "true" ]] ||
             ! sudo -n test -d /var/lib/gway/venv.previous; then
            echo "gway_runtime_rollback=unavailable"
            exit 0
          fi

          echo "gway_runtime_rollback=starting"
          sudo -n rm -rf /var/lib/gway/venv.failed
          if sudo -n test -d /var/lib/gway/venv; then
            sudo -n mv /var/lib/gway/venv /var/lib/gway/venv.failed
          fi
          sudo -n mv /var/lib/gway/venv.previous /var/lib/gway/venv
          sudo -n chmod 0711 /var/lib/gway
          sudo -n chmod 0755 /var/lib/gway/venv /var/lib/gway/venv/bin
          sudo -n /var/lib/gway/venv/bin/python -m gway --help >/dev/null
          GWAY_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/gway" /var/lib/gway/venv/bin/python -m gway version >/dev/null

          sudo -n systemctl daemon-reload
          sudo -n systemctl restart gway-mcp-server.service
          sudo -n systemctl restart gway-remote-auth.service
          sudo -n systemctl is-active --quiet gway-mcp-server.service
          sudo -n systemctl is-active --quiet gway-remote-auth.service

          for port in 8000 8001; do
            ready=false
            for attempt in $(seq 1 20); do
              if python3 - "$port" <<'PY'
          import socket
          import sys

          with socket.create_connection(("127.0.0.1", int(sys.argv[1])), timeout=1):
              pass
          PY
              then
                ready=true
                break
              fi
              sleep 1
            done
            if [[ "$ready" != "true" ]]; then
              echo "gway_runtime_rollback=service_port_failed port=$port" >&2
              exit 1
            fi
          done

          sudo -n rm -rf /var/lib/gway/venv.failed
          echo "gway_runtime_rollback=restored"

      - name: Reconcile certified package publisher handoff
        if: env.WATCHTOWER_STAGE == 'arthexis' || env.WATCHTOWER_STAGE == 'release'
        shell: bash
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          WATCHTOWER_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$RELEASE_AUTOMATION_TOKEN" ]]; then
            echo "RELEASE_AUTOMATION_TOKEN is required to dispatch certified publishers." >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          token = os.environ["RELEASE_AUTOMATION_TOKEN"]
          watchtower_run = os.environ["WATCHTOWER_RUN"]

          releases = (
              {
                  "package": "gway",
                  "repository": "arthexis/gway",
                  "workflow": "release.yml",
                  "version": os.environ["GWAY_EXPECTED_VERSION"],
                  "sha": os.environ["GWAY_EXPECTED_SHA"],
                  "companion_sha": os.environ["ARTHEXIS_EXPECTED_SHA"],
              },
              {
                  "package": "arthexis",
                  "repository": "arthexis/arthexis",
                  "workflow": "publish.yml",
                  "version": os.environ["ARTHEXIS_EXPECTED_VERSION"],
                  "sha": os.environ["ARTHEXIS_EXPECTED_SHA"],
                  "companion_sha": os.environ["GWAY_EXPECTED_SHA"],
              },
          )

          def request(method, url, payload=None, *, raw=False):
              data = None if payload is None else json.dumps(payload).encode()
              accept = (
                  "application/vnd.github.raw+json"
                  if raw
                  else "application/vnd.github+json"
              )
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": accept,
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      if not body:
                          return response.status, None
                      return response.status, (
                          body.decode() if raw else json.loads(body)
                      )
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise

          for release in releases:
              package = release["package"]
              version = release["version"]

              # Release intent can come from durable PR metadata or from a manually
              # certified Watchtower release run. Both remain rediscoverable on retry.
              _, pulls = request(
                  "GET",
                  f"{api}/repos/{release['repository']}/commits/{release['sha']}/pulls",
              )
              release_prs = [
                  pull
                  for pull in (pulls or [])
                  if pull.get("merge_commit_sha") == release["sha"]
                  and any(
                      label.get("name") == "release"
                      for label in pull.get("labels", [])
                  )
              ]
              manual_release = os.environ.get("WATCHTOWER_RELEASE_INTENT") == "manual"
              if not release_prs and not manual_release:
                  print(f"{package}_publish=not_requested")
                  continue

              target = f".watchtower/releases/{package}/{version}.json"
              status, body = request(
                  "GET",
                  (
                      f"{api}/repos/arthexis/arthexis/contents/{target}"
                      "?ref=watchtower-state"
                  ),
                  raw=True,
              )

              if status != 404:
                  manifest = json.loads(body)
                  expected = {
                      "package": package,
                      "version": version,
                      "sha": release["sha"],
                      "companion_sha": release["companion_sha"],
                  }
                  mismatches = {
                      key: (manifest.get(key), value)
                      for key, value in expected.items()
                      if manifest.get(key) != value
                  }
                  publication = manifest.get("publication", {})
                  incomplete = [
                      name
                      for name in ("pypi", "git_tag", "github_release")
                      if publication.get(name, {}).get("state") != "published"
                  ]
                  if mismatches or incomplete:
                      raise SystemExit(
                          f"Release evidence conflict for {target}: "
                          f"mismatches={mismatches!r} incomplete={incomplete!r}"
                      )
                  print(f"{package}_publish=already_recorded")
                  continue

              dispatch_url = (
                  f"{api}/repos/{release['repository']}/actions/workflows/"
                  f"{release['workflow']}/dispatches"
              )
              request(
                  "POST",
                  dispatch_url,
                  {
                      "ref": "main",
                      "inputs": {
                          "deployed_sha": release["sha"],
                          "companion_sha": release["companion_sha"],
                          "watchtower_run": watchtower_run,
                      },
                  },
              )
              print(f"{package}_publish=dispatched")
          PY
