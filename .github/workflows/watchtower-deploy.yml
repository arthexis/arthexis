name: Watchtower Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: watchtower-deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Watchtower Deploy
    if: >-
      github.repository == 'arthexis/arthexis' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, arthexis-ci]
    timeout-minutes: 45
    env:
      ARTHEXIS_DATA_DIR: /var/lib/arthexis
      ARTHEXIS_ALLOWED_HOSTS: 0.0.0.0,arthexis.com
      ARTHEXIS_CERTBOT_EMAIL: ${{ vars.ARTHEXIS_CERTBOT_EMAIL }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Clean privileged Python bytecode from runner workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d "${GITHUB_WORKSPACE}" ]]; then
            sudo -n find "${GITHUB_WORKSPACE}" -type d -name __pycache__ -prune -exec rm -rf {} +
            sudo -n find "${GITHUB_WORKSPACE}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          fi

      - name: Checkout trusted main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted invocation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "arthexis/arthexis"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_main="$(git ls-remote https://github.com/arthexis/arthexis.git refs/heads/main | awk '{print $1}')"
          test -n "${remote_main}"
          test "${remote_main}" = "${GITHUB_SHA}"
          sudo -n true

      - name: Install exact canonical Gway
        shell: bash
        run: |
          set -Eeuo pipefail
          gway_sha="$(git ls-remote https://github.com/arthexis/gway.git refs/heads/main | awk '{print $1}')"
          test -n "${gway_sha}"
          python3 -m venv "${RUNNER_TEMP}/gway-venv"
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install "gway[toml] @ git+https://github.com/arthexis/gway.git@${gway_sha}"
          "${RUNNER_TEMP}/gway-venv/bin/gway" --help >/dev/null
          echo "GWAY_EXPECTED_SHA=${gway_sha}" >> "${GITHUB_ENV}"

      - name: Deploy Arthexis through Gway system scope
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n "${RUNNER_TEMP}/gway-venv/bin/gway" install . --system --force
          sudo -n test -f /var/lib/gway/projects/arthexis/pyproject.toml
          sudo -n test -f /var/lib/gway/projects/arthexis/install.sh

      - name: Prepare persistent Arthexis runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n mkdir -p "${ARTHEXIS_DATA_DIR}"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/install.sh
          sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python -m pip install "gway[toml] @ git+https://github.com/arthexis/gway.git@${GWAY_EXPECTED_SHA}"

      - name: Install and start Arthexis systemd service
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway service install --backend systemd --system --name web -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts 0.0.0.0,arthexis.com'
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway service restart --system --name web --timeout 40 -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts 0.0.0.0,arthexis.com'
          sudo -n systemctl is-active --quiet arthexis-web.service
          curl --fail --silent --show-error --header 'Host: arthexis.com' http://127.0.0.1:8888/health/ >/dev/null

      - name: Expose Arthexis publicly through Gway recipe
        if: env.ARTHEXIS_CERTBOT_EMAIL != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n sh -c 'cd /var/lib/gway/projects/arthexis && exec .venv/bin/python -m gway ./deploy/watchtower.rx --email "'${ARTHEXIS_CERTBOT_EMAIL}'"'

      - name: Record public exposure prerequisite
        if: env.ARTHEXIS_CERTBOT_EMAIL == ''
        shell: bash
        run: |
          echo "::notice::ARTHEXIS_CERTBOT_EMAIL is not configured; local service health was verified but public Nginx/TLS exposure was not attempted."

      - name: Verify deployed Arthexis
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py check --fail-level ERROR
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py makemigrations --check --dry-run
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py ocpp_matrix

      - name: Capture deployment evidence
        if: always()
        shell: bash
        run: |
          set +e
          evidence="${RUNNER_TEMP}/watchtower-deploy-${GITHUB_SHA}.txt"
          {
            echo "arthexis_sha=${GITHUB_SHA}"
            echo "gway_sha=${GWAY_EXPECTED_SHA:-unknown}"
            echo "runner=${RUNNER_NAME}"
            echo "managed_path=/var/lib/gway/projects/arthexis"
            echo "data_path=${ARTHEXIS_DATA_DIR}"
            echo "=== managed project ==="
            sudo -n ls -ld /var/lib/gway /var/lib/gway/projects /var/lib/gway/projects/arthexis 2>&1
            sudo -n ls -ld "${ARTHEXIS_DATA_DIR}" 2>&1
            echo "=== package/runtime ==="
            sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python --version 2>&1
            sudo -n /var/lib/gway/projects/arthexis/.venv/bin/python -m pip check 2>&1
            echo "=== systemd ==="
            sudo -n systemctl status arthexis-web.service --no-pager 2>&1
            echo "=== local health ==="
            curl --fail --silent --show-error --header 'Host: arthexis.com' http://127.0.0.1:8888/health/ 2>&1
            echo
            echo "=== public health ==="
            curl --fail --silent --show-error https://arthexis.com/health/ 2>&1 || true
            echo
            echo "=== django ==="
            sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py check --fail-level ERROR 2>&1
          } | tee "${evidence}"
          echo "WATCHTOWER_EVIDENCE=${evidence}" >> "${GITHUB_ENV}"

      - name: Upload deployment evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: watchtower-deploy-${{ github.sha }}
          path: ${{ env.WATCHTOWER_EVIDENCE }}
          if-no-files-found: warn
