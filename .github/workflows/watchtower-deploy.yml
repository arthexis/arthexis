# CI refresh: evaluate rollover authentication against current workflow set
name: Watchtower Deploy
run-name: ${{ github.event.client_payload.run_name || github.workflow }}

on:
  repository_dispatch:
    types: [gway-candidate, arthexis-candidate]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact merged Arthexis SHA to classify and deploy"
        required: false
        type: string
      stage:
        description: "Highest cumulative certification stage"
        required: true
        default: 2-remote
        type: choice
        options:
          - 0-gway
          - 1-arthexis
          - 2-remote
          - 3-release
      timing:
        description: "Deployment timing"
        required: true
        default: queued
        type: choice
        options:
          - queued
          - immediate

concurrency:
  group: watchtower-deploy-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  classify:
    name: Classify Arthexis main change
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.change.outputs.deploy }}
      stage: ${{ steps.change.outputs.stage }}
      stage_level: ${{ steps.change.outputs.stage_level }}
      timing: ${{ steps.change.outputs.timing }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'repository_dispatch'
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect version-only rollover
        id: change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          AFTER_SHA: ${{ inputs.candidate_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          deploy=true
          stage="2-remote"
          timing="queued"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            stage="${{ inputs.stage }}"
            timing="${{ inputs.timing }}"
          elif [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            stage="${{ github.event.client_payload.stage || '2-remote' }}"
            timing="${{ github.event.client_payload.timing || 'queued' }}"
          fi
          case "$stage" in
            0-gway) stage_level=0 ;;
            1-arthexis) stage_level=1 ;;
            2-remote) stage_level=2 ;;
            3-release) stage_level=3 ;;
            *)
              echo "Unsupported certification stage: $stage" >&2
              exit 1
              ;;
          esac
          if [[ "$timing" != "queued" && "$timing" != "immediate" ]]; then
            echo "Unsupported deployment timing: $timing" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] &&
             [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            BEFORE_SHA="$(git rev-parse "$AFTER_SHA^1")"
          fi
          if [[ "$EVENT_NAME" != "repository_dispatch" ]] &&
             [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             python .github/scripts/is_version_only_rollover.py "$BEFORE_SHA" "$AFTER_SHA"; then
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "stage_level=$stage_level" >> "$GITHUB_OUTPUT"
          echo "timing=$timing" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy stage=$stage stage_level=$stage_level timing=$timing"


  queue-gate:
    name: Coalesce active PR queue
    needs: classify
    if: needs.classify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.queue.outputs.deploy }}
      reason: ${{ steps.queue.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Skip superseded deployment while PRs remain
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          TIMING: ${{ needs.classify.outputs.timing }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$TIMING" == "immediate" ]]; then
            echo "watchtower_deploy=immediate"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=immediate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          active=0
          for repository in arthexis/arthexis arthexis/gway; do
            echo "active_prs[$repository]=begin"
            while IFS= read -r number; do
              [[ -n "$number" ]] || continue
              pr_json="$(gh api "repos/$repository/pulls/$number")"
              labels="$(jq -r '[.labels[].name | ascii_downcase] | "|" + join("|") + "|"' <<< "$pr_json")"

              if [[ "$labels" == *"|on-hold|"* || "$labels" == *"|on hold|"* ]]; then
                continue
              fi

              if [[ "$labels" == *"|needs-watchtower|"* ]]; then
                set +e
                dependency="$(python .github/scripts/watchtower_dependency.py "$repository" "$number")"
                dependency_rc=$?
                set -e
                dependency_status="$(jq -r '.status' <<< "$dependency")"
                echo "watchtower_dependency[$repository#$number]=$dependency"
                if [[ "$dependency_rc" == 0 &&
                      ( "$dependency_status" == "waiting-merge" ||
                        "$dependency_status" == "waiting-watchtower" ) ]]; then
                  continue
                fi
              fi

              title="$(jq -r '.title' <<< "$pr_json")"
              printf '%s %s\n' "$number" "$title"
              active=1
            done < <(
              gh pr list --repo "$repository" --state open --limit 1000 --json number --jq '.[].number'
            )
            echo "active_prs[$repository]=end"
          done

          if [[ "$active" == 1 ]]; then
            echo "watchtower_deploy=coalesced_active_pr_queue"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=active-pr-queue" >> "$GITHUB_OUTPUT"
          else
            echo "watchtower_deploy=dependency_unblock_or_queue_drained"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=dependency-unblock-or-queue-drained" >> "$GITHUB_OUTPUT"
          fi


  deployment-deferred:
    name: Deployment deferred — active PR queue
    needs: [classify, queue-gate]
    if: >-
      needs.classify.outputs.deploy == 'true' &&
      needs.queue-gate.outputs.deploy == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Explain deferred certification
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::notice title=Watchtower deployment deferred::No deployment or certification occurred because active PRs remained in the queue. A later queue-draining merge will retry the current pair."
          {
            echo "## Watchtower deployment deferred"
            echo
            echo "No deployment or certification occurred in this run."
            echo
            echo "- Reason: active PR queue"
            echo "- The current candidate pair will be reconsidered when the queue drains."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Watchtower Deploy
    needs: [classify, queue-gate]
    if: >-
      always() &&
      needs.classify.outputs.deploy == 'true' &&
      needs.queue-gate.outputs.deploy == 'true' &&
      github.repository == 'arthexis/arthexis' &&
      (github.event_name == 'repository_dispatch' ||
       github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, arthexis-ci]
    timeout-minutes: 45
    env:
      ARTHEXIS_DATA_DIR: /var/lib/arthexis
      ARTHEXIS_ALLOWED_HOSTS: arthexis.com
      PYTHONDONTWRITEBYTECODE: '1'
      WATCHTOWER_STAGE: ${{ needs.classify.outputs.stage }}
      WATCHTOWER_LEVEL: ${{ needs.classify.outputs.stage_level }}
      WATCHTOWER_RELEASE_INTENT: ${{ needs.classify.outputs.stage == '3-release' && 'manual' || '' }}
    steps:
      - name: Clean privileged Python bytecode from runner workspace
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 0
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d "${GITHUB_WORKSPACE}" ]]; then
            sudo -n find "${GITHUB_WORKSPACE}" -type d -name __pycache__ -prune -exec rm -rf {} +
            sudo -n find "${GITHUB_WORKSPACE}" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          fi

      - name: Resolve exact deployment pair
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 0
        id: pair
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_GWAY_SHA: ${{ github.event.client_payload.gway_sha || '' }}
          REQUESTED_ARTHEXIS_SHA: ${{ github.event.client_payload.arthexis_sha || inputs.candidate_sha || '' }}
          EVENT_TYPE: ${{ github.event.action || '' }}
        run: |
          set -Eeuo pipefail

          retry_capture() {
            local attempts="$1"
            local delay="$2"
            shift 2
            local attempt output
            for attempt in $(seq 1 "$attempts"); do
              if output="$("$@")"; then
                printf '%s' "$output"
                return 0
              fi
              if [[ "$attempt" -lt "$attempts" ]]; then
                echo "watchtower_resolution=retrying attempt=$attempt/$attempts command=$1" >&2
                sleep "$delay"
              fi
            done
            echo "watchtower_resolution=exhausted attempts=$attempts command=$1" >&2
            return 1
          }

          current_arthexis="$(retry_capture 5 2 git ls-remote https://github.com/arthexis/arthexis.git refs/heads/main | awk '{print $1}')"
          current_gway="$(retry_capture 5 2 git ls-remote https://github.com/arthexis/gway.git refs/heads/main | awk '{print $1}')"
          [[ "$current_arthexis" =~ ^[0-9a-f]{40}$ ]]
          [[ "$current_gway" =~ ^[0-9a-f]{40}$ ]]

          previous_arthexis=""
          previous_gway=""
          previous_manifest="$(mktemp)"
          trap 'rm -f "$previous_manifest"' EXIT
          if curl --fail --silent --show-error --location             "https://raw.githubusercontent.com/arthexis/arthexis/watchtower-state/.watchtower/accepted.json"             --output "$previous_manifest"; then
            previous_arthexis="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("arthexis_sha", ""))' "$previous_manifest")"
            previous_gway="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("gway_sha", ""))' "$previous_manifest")"
          fi

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            if [[ "$EVENT_TYPE" == "gway-candidate" ]]; then
              [[ "$REQUESTED_GWAY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo "gway-candidate dispatch must provide a full Gway SHA." >&2
                exit 1
              }
              if [[ "$REQUESTED_GWAY_SHA" == "$current_gway" ]]; then
                gway_sha="$REQUESTED_GWAY_SHA"
                source="gway"
              else
                compare_status="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
                  "https://api.github.com/repos/arthexis/gway/compare/$REQUESTED_GWAY_SHA...$current_gway" |
                  python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')"
                if [[ "$compare_status" != "ahead" ]]; then
                  echo "Gway candidate is not an ancestor of current main: requested=$REQUESTED_GWAY_SHA current=$current_gway status=$compare_status" >&2
                  exit 1
                fi
                echo "watchtower_resolution=superseded requested=$REQUESTED_GWAY_SHA current=$current_gway"
                gway_sha="$current_gway"
                source="gway-coalesced"
              fi
              arthexis_sha="$current_arthexis"
            elif [[ "$EVENT_TYPE" == "arthexis-candidate" ]]; then
              [[ "$REQUESTED_ARTHEXIS_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo "arthexis-candidate dispatch must provide a full Arthexis SHA." >&2
                exit 1
              }
              if [[ "$REQUESTED_ARTHEXIS_SHA" == "$current_arthexis" ]]; then
                arthexis_sha="$REQUESTED_ARTHEXIS_SHA"
                source="arthexis"
              else
                compare_status="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
                  "https://api.github.com/repos/arthexis/arthexis/compare/$REQUESTED_ARTHEXIS_SHA...$current_arthexis" |
                  python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')"
                if [[ "$compare_status" != "ahead" ]]; then
                  echo "Arthexis candidate is not an ancestor of current main: requested=$REQUESTED_ARTHEXIS_SHA current=$current_arthexis status=$compare_status" >&2
                  exit 1
                fi
                echo "watchtower_resolution=superseded requested=$REQUESTED_ARTHEXIS_SHA current=$current_arthexis"
                arthexis_sha="$current_arthexis"
                source="arthexis-coalesced"
              fi
              gway_sha="$current_gway"
            else
              echo "Unsupported repository dispatch type: $EVENT_TYPE" >&2
              exit 1
            fi
          else
            requested_arthexis="${REQUESTED_ARTHEXIS_SHA:-${GITHUB_SHA}}"
            [[ "$requested_arthexis" =~ ^[0-9a-f]{40}$ ]]
            test "$requested_arthexis" = "$current_arthexis"
            arthexis_sha="$requested_arthexis"
            # Arthexis deployments converge against current GWAY main. Reusing the
            # previously accepted GWAY SHA can downgrade the runtime after GWAY has
            # migrated durable state to a newer schema.
            gway_sha="$current_gway"
            source="arthexis"
          fi

          [[ "$arthexis_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$gway_sha" =~ ^[0-9a-f]{40}$ ]]

          arthexis_version="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors             "https://raw.githubusercontent.com/arthexis/arthexis/$arthexis_sha/VERSION" | tr -d '[:space:]')"
          # This runs before the canonical Gway venv exists. Keep it compatible with
          # the Watchtower host's Python 3.10 and do not assume tomllib/tomli is installed.
          gway_version="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors             "https://raw.githubusercontent.com/arthexis/gway/$gway_sha/pyproject.toml" |
            awk '
              /^\[project\][[:space:]]*$/ { in_project=1; next }
              /^\[/ && in_project { exit }
              in_project && /^[[:space:]]*version[[:space:]]*=/ {
                value=$0
                sub(/^[^=]*=[[:space:]]*/, "", value)
                sub(/[[:space:]]*#.*/, "", value)
                gsub(/^[[:space:]]*["'"'"']|["'"'"'][[:space:]]*$/, "", value)
                print value
                exit
              }
            ')"
          test -n "$arthexis_version"
          test -n "$gway_version"

          arthexis_changed=true
          gway_changed=true
          [[ -n "$previous_arthexis" && "$previous_arthexis" == "$arthexis_sha" ]] && arthexis_changed=false
          [[ -n "$previous_gway" && "$previous_gway" == "$gway_sha" ]] && gway_changed=false

          {
            echo "ARTHEXIS_EXPECTED_SHA=$arthexis_sha"
            echo "ARTHEXIS_EXPECTED_VERSION=$arthexis_version"
            echo "GWAY_EXPECTED_SHA=$gway_sha"
            echo "GWAY_EXPECTED_VERSION=$gway_version"
            echo "ARTHEXIS_CHANGED=$arthexis_changed"
            echo "GWAY_CHANGED=$gway_changed"
          } >> "$GITHUB_ENV"

          {
            echo "arthexis_sha=$arthexis_sha"
            echo "gway_sha=$gway_sha"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"

          echo "deployment_pair source=$source arthexis=$arthexis_sha gway=$gway_sha"

      - name: Checkout exact Arthexis deployment SHA
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 0
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.pair.outputs.arthexis_sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted invocation
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 0
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "arthexis/arthexis"
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          sudo -n true

      - name: Install exact canonical Gway
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 0
        shell: bash
        run: |
          set -Eeuo pipefail

          timing_start() {
            date +%s%N
          }

          timing_end() {
            local phase="$1"
            local started="$2"
            local ended elapsed
            ended="$(date +%s%N)"
            elapsed=$((ended - started))
            printf 'watchtower_timing phase=%s seconds=%d.%03d\n' \
              "$phase" "$((elapsed / 1000000000))" "$(((elapsed / 1000000) % 1000))"
          }

          runtime_root=/var/lib/gway/venvs
          candidate="${runtime_root}/${GWAY_EXPECTED_SHA}"
          link=/var/lib/gway/venv
          link_next=/var/lib/gway/venv.next
          previous_target=""
          legacy_directory=false

          sudo -n install -d -m 0755 "${runtime_root}"
          sudo -n rm -rf "${link_next}"

          if sudo -n test -L "${link}"; then
            current_target="$(sudo -n readlink -f "${link}")"
            if [[ "${current_target}" == "${candidate}" ]]; then
              echo "GWAY_RUNTIME_CANDIDATE_TARGET=${candidate}" >> "$GITHUB_ENV"
              echo "GWAY_RUNTIME_PREVIOUS_TARGET=" >> "$GITHUB_ENV"
              echo "GWAY_RUNTIME_ROLLBACK_AVAILABLE=false" >> "$GITHUB_ENV"
              echo "GWAY_RUNTIME_SWITCH_STARTED=false" >> "$GITHUB_ENV"
              echo "GWAY_RUNTIME_SWAPPED=false" >> "$GITHUB_ENV"
              sudo -n "${link}/bin/python" -m gway --help >/dev/null
              sudo -n "${link}/bin/gway" --help >/dev/null
              GWAY_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/gway" \
                "${link}/bin/python" -m gway version >/dev/null
              echo "canonical_gway_runtime=reused target=${candidate}"
              exit 0
            fi
          fi

          if sudo -n test -e "${candidate}"; then
            sudo -n rm -rf "${candidate}"
          fi

          started="$(timing_start)"
          sudo -n python3 -m venv "${candidate}"
          timing_end canonical-gway-venv "$started"

          started="$(timing_start)"
          sudo -n "${candidate}/bin/python" -m pip install --upgrade pip >/dev/null 2>&1
          timing_end canonical-gway-pip "$started"

          started="$(timing_start)"
          sudo -n "${candidate}/bin/python" -m pip install \
            "gway[toml] @ git+https://github.com/arthexis/gway.git@${GWAY_EXPECTED_SHA}" \
            >/dev/null 2>&1
          timing_end canonical-gway-install "$started"

          started="$(timing_start)"
          sudo -n env GWAY_EXPECTED_SHA="$GWAY_EXPECTED_SHA" \
            "${candidate}/bin/python" - <<'PY'
          import importlib.metadata
          import json
          import os

          distribution = importlib.metadata.distribution("gway")
          direct_url = distribution.read_text("direct_url.json")
          if not direct_url:
              raise SystemExit("Gway installation has no direct_url.json provenance")
          payload = json.loads(direct_url)
          commit_id = payload.get("vcs_info", {}).get("commit_id")
          expected = os.environ["GWAY_EXPECTED_SHA"]
          if commit_id != expected:
              raise SystemExit(
                  f"Gway provenance mismatch: installed={commit_id!r} expected={expected!r}"
              )
          PY
          sudo -n "${candidate}/bin/python" -m gway --help >/dev/null
          sudo -n "${candidate}/bin/gway" --help >/dev/null
          GWAY_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/gway" \
            "${candidate}/bin/python" -m gway version >/dev/null
          timing_end canonical-gway-pre-swap-verify "$started"

          started="$(timing_start)"
          if sudo -n test -L "${link}"; then
            previous_target="$(sudo -n readlink -f "${link}")"
          elif sudo -n test -d "${link}"; then
            previous_target="${runtime_root}/legacy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            legacy_directory=true
          fi

          echo "GWAY_RUNTIME_CANDIDATE_TARGET=${candidate}" >> "$GITHUB_ENV"
          echo "GWAY_RUNTIME_PREVIOUS_TARGET=${previous_target}" >> "$GITHUB_ENV"
          if [[ -n "${previous_target}" ]]; then
            echo "GWAY_RUNTIME_ROLLBACK_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "GWAY_RUNTIME_ROLLBACK_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
          echo "GWAY_RUNTIME_SWITCH_STARTED=true" >> "$GITHUB_ENV"

          if [[ "${legacy_directory}" == true ]]; then
            sudo -n rm -rf "${previous_target}"
            sudo -n mv "${link}" "${previous_target}"
          fi

          sudo -n ln -s "${candidate}" "${link_next}"
          if sudo -n test -L "${link}"; then
            sudo -n mv -Tf "${link_next}" "${link}"
          else
            sudo -n mv "${link_next}" "${link}"
          fi
          sudo -n chmod 0711 /var/lib/gway
          sudo -n chmod 0755 "${candidate}" "${candidate}/bin"

          echo "GWAY_RUNTIME_SWAPPED=true" >> "$GITHUB_ENV"
          timing_end canonical-gway-swap "$started"

          started="$(timing_start)"
          sudo -n test -L "${link}"
          test "$(sudo -n readlink -f "${link}")" = "${candidate}"
          sudo -n "${link}/bin/python" -m gway --help >/dev/null
          sudo -n "${link}/bin/gway" --help >/dev/null
          GWAY_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/gway" \
            "${link}/bin/python" -m gway version >/dev/null
          timing_end canonical-gway-post-swap-verify "$started"

      - name: Verify exact deployment pair before mutation
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 0
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          test -n "$GWAY_EXPECTED_SHA"
          echo "deployment_pair=stable_before_mutation"

      - name: Deploy Arthexis through Gway system scope
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 1
        shell: bash
        run: |
          set -Eeuo pipefail
          install_log="${RUNNER_TEMP}/arthexis-product-install.log"
          stale_product=""

          # Recover only the known incomplete migration shape: /opt/arthexis exists
          # but is not a standard Arthexis project tree. Never move a live runtime.
          if sudo -n test -d /opt/arthexis &&
             ! sudo -n test -f /opt/arthexis/pyproject.toml; then
            unit=/etc/systemd/system/arthexis-arthexis.com.service
            if sudo -n test -f "${unit}"; then
              exec_start="$(sudo -n awk -F= '/^ExecStart=/{print substr($0,11)}' "${unit}")"
              if [[ "${exec_start}" == *"/opt/arthexis/"* ]]; then
                echo "Refusing to quarantine active incomplete /opt/arthexis runtime: ${exec_start}" >&2
                exit 1
              fi
            fi

            stale_product="/opt/.arthexis.incomplete-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            sudo -n rm -rf "${stale_product}"
            sudo -n mv /opt/arthexis "${stale_product}"
            echo "arthexis_product_quarantine=${stale_product}"
          fi

          if ! sudo -n /var/lib/gway/venv/bin/gway -t install . --system --force >"${install_log}" 2>&1; then
            sudo -n python3 scripts/watchtower_diagnostics.py               --input "${install_log}"               --run-id "${GITHUB_RUN_ID}"               --attempt "${GITHUB_RUN_ATTEMPT}"               --step "arthexis-product-install"
            rm -f "${install_log}"
            echo "arthexis_product_install=failed diagnostic_source=recipe/watchtower-deploy"
            if [[ -n "${stale_product}" ]] &&
               ! sudo -n test -e /opt/arthexis &&
               sudo -n test -e "${stale_product}"; then
              sudo -n mv "${stale_product}" /opt/arthexis
              echo "arthexis_product_quarantine=restored"
            fi
            exit 1
          fi
          cat "$install_log"
          rm -f "$install_log"

          if [[ -n "${stale_product}" ]]; then
            sudo -n rm -rf "${stale_product}"
          fi
          echo "arthexis_product_install=ok"
          sudo -n test -f /opt/arthexis/pyproject.toml
          sudo -n test -f /opt/arthexis/install.sh

      - name: Prepare persistent Arthexis runtime
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 1
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_log="${RUNNER_TEMP}/arthexis-runtime-install.log"
          sudo -n mkdir -p "${ARTHEXIS_DATA_DIR}"
          if ! sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /opt/arthexis/install.sh >"${runtime_log}" 2>&1; then
            sudo -n python3 scripts/watchtower_diagnostics.py               --input "${runtime_log}"               --run-id "${GITHUB_RUN_ID}"               --attempt "${GITHUB_RUN_ATTEMPT}"               --step "prepare-arthexis-runtime"
            rm -f "${runtime_log}"
            echo "arthexis_runtime=failed diagnostic_source=recipe/watchtower-deploy"
            exit 1
          fi
          rm -f "${runtime_log}"
          if /opt/arthexis/.venv/bin/python -c 'import gway' >/dev/null 2>&1; then
            echo "Arthexis product venv must not contain GWAY" >&2
            exit 1
          fi

      - name: Install canonical Watchtower Gway admin launcher
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 0
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n install -d -m 0755 /usr/local/bin
          launcher="$(mktemp)"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -eu' \
            'if [ "$(id -u)" -eq 0 ]; then' \
            '  export GWAY_CACHE_DIR=/var/lib/gway/cache' \
            'else' \
            '  export GWAY_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/gway"' \
            'fi' \
            'exec /var/lib/gway/venv/bin/python -m gway "$@"' \
            >"${launcher}"
          chmod 0755 "${launcher}"
          sudo -n install -m 0755 "${launcher}" /usr/local/bin/gway
          rm -f "${launcher}"
          /usr/local/bin/gway version >/dev/null
          sudo -n /usr/local/bin/gway help security oauth client create >/dev/null
          sudo -n /usr/local/bin/gway security oauth client list >/dev/null
          sudo -n test -f /var/lib/gway/cache/security/state.sqlite
          echo "canonical_gway_user=ok"
          echo "canonical_gway_admin=ok"

      - name: Activate and verify canonical Gway
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 0
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n test -f /var/lib/gway/venv/share/gway/sampler/survey/__main__.rx
          sudo -n test -f /var/lib/gway/venv/share/gway/sampler/mcp/local.rx
          sudo -n test -f /var/lib/gway/venv/share/gway/sampler/mcp/serve.rx
          sudo -n /usr/local/bin/gway help survey >/dev/null
          sudo -n /usr/local/bin/gway help mcp local >/dev/null
          sudo -n /usr/local/bin/gway --json resolve mcp local |
            python3 -c 'import json,sys; value=json.load(sys.stdin); assert value.get("kind") in {"recipe","operation"}; assert "mcp" in str(value.get("target","")) and "local" in str(value.get("target",""))'
          sudo -n /usr/local/bin/gway --json resolve mcp serve |
            python3 -c 'import json,sys; value=json.load(sys.stdin); assert value.get("kind") in {"recipe","operation"}; assert "mcp" in str(value.get("target","")) and "serve" in str(value.get("target",""))'
          sudo -n /usr/local/bin/gway security scope list >/dev/null
          sudo -n /usr/local/bin/gway security whoami >/dev/null
          echo "gway_activation=ok"
          echo "gway_sampler_survey=ok"
          echo "gway_mcp_local=ok"
          echo "gway_security_registry=ok"

      - name: Record accepted Gway stage
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          repository = os.environ["GITHUB_REPOSITORY"]
          api = os.environ["GITHUB_API_URL"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          state_branch = "watchtower-state"
          state_path = ".watchtower/gway-accepted.json"

          manifest = {
              "gway_sha": os.environ["GWAY_EXPECTED_SHA"],
              "gway_version": os.environ["GWAY_EXPECTED_VERSION"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/{repository}/actions/runs/'
                  f'{os.environ["GITHUB_RUN_ID"]}'
              ),
              "accepted_at": datetime.now(timezone.utc).isoformat(),
              "stages": ["0-gway"],
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}/repos/{repository}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise

          status, _ = request("GET", f"git/ref/heads/{state_branch}")
          if status == 404:
              request(
                  "POST",
                  "git/refs",
                  {"ref": f"refs/heads/{state_branch}", "sha": os.environ["GITHUB_SHA"]},
              )

          status, existing = request(
              "GET", f"contents/{state_path}?ref={state_branch}"
          )
          payload = {
              "message": (
                  "Record accepted Gway stage "
                  f'{manifest["gway_sha"][:12]}'
              ),
              "content": base64.b64encode(
                  (json.dumps(manifest, indent=2, sort_keys=True) + "\n").encode()
              ).decode(),
              "branch": state_branch,
          }
          if status != 404:
              payload["sha"] = existing["sha"]

          request("PUT", f"contents/{state_path}", payload)
          print(json.dumps(manifest, sort_keys=True))
          PY
          echo "GWAY_DEPLOYMENT_ACCEPTED=true" >> "$GITHUB_ENV"

      - name: Validate baseline Nginx configuration
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 1
        shell: bash
        run: |
          set -Eeuo pipefail

          check_nginx() {
            sudo -n /usr/sbin/nginx -t 2>&1
          }

          if output="$(check_nginx)"; then
            printf '%s\n' "$output"
            echo "nginx_baseline=ok"
            exit 0
          fi

          printf '%s\n' "$output" >&2
          echo "nginx_baseline=invalid"

          enabled_path="$(sed -nE 's#.* in (/etc/nginx/sites-enabled/[^: ]+):[0-9]+.*#\1#p' <<<"$output" | head -n 1)"
          if [[ -z "$enabled_path" ]] || ! sudo -n test -L "$enabled_path"; then
            echo "nginx_recovery=unowned_or_unresolved" >&2
            exit 1
          fi

          target="$(sudo -n readlink -f "$enabled_path")"
          expected="/etc/nginx/sites-available/$(basename "$enabled_path")"
          if [[ "$target" != "$expected" ]]; then
            echo "nginx_recovery=unexpected_target target=$target" >&2
            exit 1
          fi

          if sudo -n /usr/local/bin/gway recover path "$target"; then
            echo "nginx_recovery=journal_restored path=$target"
          elif [[ "$(basename "$enabled_path")" == "register-arthexis-com" ]]; then
            # Compatibility cleanup for the one known corrupt artifact created by
            # the pre-recovery Watchtower bootstrap. Preserve it for inspection.
            quarantine="/etc/nginx/sites-available/.register-arthexis-com.corrupt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            sudo -n mv "$target" "$quarantine"
            sudo -n rm -f "$enabled_path"
            echo "nginx_recovery=legacy_quarantined path=$quarantine"
          else
            echo "nginx_recovery=no_proven_managed_state path=$target" >&2
            exit 1
          fi

          if ! output="$(check_nginx)"; then
            printf '%s\n' "$output" >&2
            echo "nginx_recovery=failed" >&2
            exit 1
          fi
          printf '%s\n' "$output"
          echo "nginx_baseline=recovered"

      - name: Converge public Gway bootstrap
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 1
        shell: bash
        env:
          ARTHEXIS_CERTBOT_EMAIL: ${{ secrets.ARTHEXIS_CERTBOT_EMAIL }}
        run: |
          set -Eeuo pipefail
          test -n "${ARTHEXIS_CERTBOT_EMAIL}"
          public_ipv4="$(getent ahostsv4 arthexis.com | awk 'NR == 1 {print $1}')"
          test -n "${public_ipv4}"
          recipe=/var/lib/gway/venv/share/gway/sampler/bootstrap/watchtower.rx
          sudo -n test -f "${recipe}"
          if ! bootstrap_output="$(sudo -n /usr/local/bin/gway -t --recipe "${recipe}" \
            --email "${ARTHEXIS_CERTBOT_EMAIL}" \
            --public-ipv4 "${public_ipv4}" 2>&1)"; then
            printf '%s\n' "$bootstrap_output" >&2
            echo "gway_bootstrap=failed" >&2
            if rollback_output="$(sudo -n /usr/sbin/nginx -t 2>&1)"; then
              printf '%s\n' "$rollback_output"
              echo "nginx_rollback=restored"
            else
              printf '%s\n' "$rollback_output" >&2
              echo "nginx_rollback=invalid" >&2
            fi
            exit 1
          fi
          printf '%s\n' "$bootstrap_output"
          sudo -n /usr/sbin/nginx -t
          echo "nginx_candidate=ok"

          bootstrap="$(mktemp)"
          trap 'rm -f "${bootstrap}"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors \
            https://install.arthexis.com/gway --output "${bootstrap}"
          head -n 1 "${bootstrap}" | grep -Fx '#!/bin/sh' >/dev/null

          installer_page="$(mktemp)"
          trap 'rm -f "${bootstrap}" "${installer_page}"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors \
            https://install.arthexis.com/ --output "${installer_page}"
          grep -F 'id="installer"' "${installer_page}" >/dev/null
          grep -F 'id="command"' "${installer_page}" >/dev/null
          grep -Fx '# GWAY_BOOTSTRAP_V1' "${bootstrap}" >/dev/null
          if grep -F 'git+https://github.com/arthexis/gway' "${bootstrap}" >/dev/null; then
            echo "Public Gway bootstrap must install a certified release, not GitHub main." >&2
            exit 1
          fi
          echo "gway_bootstrap=public_ready"

      - name: Install and start Arthexis systemd service
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 1
        shell: bash
        run: |
          set -Eeuo pipefail

          service_diagnostics() {
            sudo -n systemctl status arthexis-arthexis.com.service --no-pager || true
            sudo -n journalctl -u arthexis-arthexis.com.service -n 80 --no-pager || true
          }

          if ! sudo -n sh -c 'cd /opt/arthexis && exec /usr/local/bin/gway service stop --system --name web -- serve --host 127.0.0.1 --port 8888 --data-dir /var/lib/arthexis --allowed-hosts arthexis.com' >/dev/null 2>&1; then
            echo "legacy_web_stop=already_absent_or_inactive"
          fi

          sudo -n /var/lib/gway/venv/bin/python /opt/arthexis/scripts/retire_legacy_web_service.py

          if ! (cd /opt/arthexis && sudo -n /usr/local/bin/gway -t service install --backend systemd --system --name arthexis.com -- /opt/arthexis/.venv/bin/python -c 'from arthexis.server import main; main(host="127.0.0.1", port=8888, data_dir="/var/lib/arthexis", allowed_hosts="arthexis.com")'); then
            echo "arthexis_service_install=failed"
            service_diagnostics
            exit 1
          fi

          if ! (cd /opt/arthexis && sudo -n /usr/local/bin/gway -t service restart --system --name arthexis.com --timeout 40 -- /opt/arthexis/.venv/bin/python -c 'from arthexis.server import main; main(host="127.0.0.1", port=8888, data_dir="/var/lib/arthexis", allowed_hosts="arthexis.com")'); then
            echo "arthexis_service_restart=failed"
            service_diagnostics
            exit 1
          fi

          if ! sudo -n systemctl is-active --quiet arthexis-arthexis.com.service; then
            echo "arthexis_service_active=failed"
            service_diagnostics
            exit 1
          fi

          unit=/etc/systemd/system/arthexis-arthexis.com.service
          sudo -n test -f "${unit}"
          exec_start="$(sudo -n awk -F= '/^ExecStart=/{print substr($0,11)}' "${unit}")"
          test -n "${exec_start}"
          if [[ "${exec_start}" == *gway* ]]; then
            echo "Arthexis systemd ExecStart must not depend on GWAY: ${exec_start}" >&2
            exit 1
          fi
          if [[ "${exec_start}" != *"from arthexis.server import main; main("* ]]; then
            echo "Arthexis systemd ExecStart must use the accepted-build-compatible server callable: ${exec_start}" >&2
            exit 1
          fi

          if ! sudo -n systemctl restart arthexis-arthexis.com.service; then
            echo "arthexis_native_restart=failed"
            service_diagnostics
            exit 1
          fi
          if ! sudo -n systemctl is-active --quiet arthexis-arthexis.com.service; then
            echo "arthexis_native_restart_active=failed"
            service_diagnostics
            exit 1
          fi
          ready=false
          for attempt in $(seq 1 10); do
            if sudo -n env \
              ARTHEXIS_DATA_DIR=/var/lib/arthexis \
              ARTHEXIS_ALLOWED_HOSTS=arthexis.com \
              /opt/arthexis/.venv/bin/python -c \
              'from arthexis.ready import local; raise SystemExit(0 if local(host="127.0.0.1", port=8888, domain="arthexis.com", path="/health/", timeout=2) else 1)'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != true ]]; then
            echo "arthexis_ready=failed"
            service_diagnostics
            exit 1
          fi
          echo "service=active_independent_of_gway"

      - name: Verify satellite bootstrap from candidate sources
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 1
        shell: bash
        run: |
          set -Eeuo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT

          bootstrap=/var/lib/gway/venv/share/gway/sampler/bootstrap/arthexis.sh
          test -f "$bootstrap"

          mkdir -p "$sandbox/home" "$sandbox/cache"

          HOME="$sandbox/home" \
          XDG_CACHE_HOME="$sandbox/cache" \
          GWAY_BOOTSTRAP_GWAY=/usr/local/bin/gway \
          ARTHEXIS_BOOTSTRAP_SOURCE="$GITHUB_WORKSPACE" \
          ARTHEXIS_BOOTSTRAP_SHA="$ARTHEXIS_EXPECTED_SHA" \
          ARTHEXIS_BOOTSTRAP_HOME="$sandbox/home/.local/opt/arthexis" \
          ARTHEXIS_BOOTSTRAP_VERIFY_ONLY=1 \
            sh "$bootstrap"

          test -s "$sandbox/home/.local/opt/arthexis/var/db.sqlite3"
          test -x "$sandbox/home/.local/opt/arthexis/.venv/bin/python"

          {
            echo "SATELLITE_BOOTSTRAP_TESTED_GWAY_SHA=$GWAY_EXPECTED_SHA"
            echo "SATELLITE_BOOTSTRAP_TESTED_ARTHEXIS_SHA=$ARTHEXIS_EXPECTED_SHA"
          } >> "$GITHUB_ENV"

          echo "satellite_bootstrap_candidate_source=ok"

      - name: Preflight Watchtower Remote stage
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 2
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x /usr/local/bin/gway
          test -x /opt/arthexis/.venv/bin/python
          sudo -n systemctl is-active --quiet arthexis-arthexis.com.service
          sudo -n test -f /opt/arthexis/deploy/remote.rx
          sudo -n test -f /opt/arthexis/deploy/remote-expose.rx
          sudo -n test -f /opt/arthexis/deploy/mcp-server.rx
          sudo -n /usr/local/bin/gway help remote serve >/dev/null
          echo "remote_units=begin"
          sudo -n systemctl show gway-mcp-server.service gway-remote-auth.service -p Id -p LoadState -p ActiveState -p SubState --no-pager || true
          echo "remote_units=end"
          echo "remote_listeners=begin"
          sudo -n ss -ltnp '( sport = :8000 or sport = :8001 )' || true
          echo "remote_listeners=end"

      - name: Converge Watchtower Remote stage
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 2
        shell: bash
        env:
          ARTHEXIS_CERTBOT_EMAIL: ${{ secrets.ARTHEXIS_CERTBOT_EMAIL }}
        run: |
          set -Eeuo pipefail
          test -n "${ARTHEXIS_CERTBOT_EMAIL}"
          public_ipv4="$(getent ahostsv4 arthexis.com | awk 'NR == 1 {print $1}')"
          test -n "${public_ipv4}"
          cd /opt/arthexis
          sudo -n /usr/local/bin/gway -t --recipe deploy/remote.rx
          sudo -n /usr/local/bin/gway -t --recipe deploy/remote-expose.rx \
            --email "${ARTHEXIS_CERTBOT_EMAIL}" \
            --public-ipv4 "${public_ipv4}"

      - name: Verify Watchtower Remote stage
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 2
        shell: bash
        run: |
          set -Eeuo pipefail

          remote_diagnostics() {
            sudo -n systemctl status gway-mcp-server.service gway-remote-auth.service --no-pager || true
            sudo -n ss -ltnp '( sport = :8000 or sport = :8001 )' || true
            sudo -n journalctl -u gway-mcp-server.service -u gway-remote-auth.service -n 80 --no-pager || true
          }

          cd /opt/arthexis

          # The local acceptance helper owns listener readiness. It retries both
          # ports after service restart, avoiding a one-shot probe racing systemd.
          if ! sudo -n /var/lib/gway/venv/bin/python scripts/verify_remote_deployment.py local; then
            remote_diagnostics
            exit 1
          fi

          # Once listener readiness has succeeded, both units must also have
          # converged to active. Wrap these checks so failures emit diagnostics
          # instead of leaking systemctl's opaque exit code 3.
          if ! sudo -n systemctl is-active --quiet gway-mcp-server.service; then
            echo "gway_mcp_server_active=failed"
            remote_diagnostics
            exit 1
          fi
          if ! sudo -n systemctl is-active --quiet gway-remote-auth.service; then
            echo "gway_remote_auth_active=failed"
            remote_diagnostics
            exit 1
          fi
          if ! sudo -n /var/lib/gway/venv/bin/python scripts/verify_remote_deployment.py public; then
            remote_diagnostics
            exit 1
          fi
          echo "remote_services=active"
          echo "remote_acceptance=ok"

      - name: Verify public satellite package identity
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 2
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${SATELLITE_BOOTSTRAP_TESTED_GWAY_SHA:-}"
          test -n "${SATELLITE_BOOTSTRAP_TESTED_ARTHEXIS_SHA:-}"
          test "$SATELLITE_BOOTSTRAP_TESTED_GWAY_SHA" = "$GWAY_EXPECTED_SHA"
          test "$SATELLITE_BOOTSTRAP_TESTED_ARTHEXIS_SHA" = "$ARTHEXIS_EXPECTED_SHA"

          satellite="$(mktemp)"
          gway_bootstrap="$(mktemp)"
          trap 'rm -f "$satellite" "$gway_bootstrap"' EXIT

          curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors \
            https://install.arthexis.com/satellite --output "$satellite"
          curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors \
            https://install.arthexis.com/gway --output "$gway_bootstrap"

          grep -F 'GWAY_BOOTSTRAP_GWAY' "$satellite" >/dev/null
          grep -F 'ARTHEXIS_BOOTSTRAP_SHA' "$satellite" >/dev/null
          grep -F 'ARTHEXIS_BOOTSTRAP_VERIFY_ONLY' "$satellite" >/dev/null
          grep -Fx '# GWAY_BOOTSTRAP_V1' "$gway_bootstrap" >/dev/null

          gway_archive="https://github.com/arthexis/gway/archive/$GWAY_EXPECTED_SHA.tar.gz"
          arthexis_archive="https://github.com/arthexis/arthexis/archive/$ARTHEXIS_EXPECTED_SHA.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 1 --retry-all-errors \
            --range 0-0 "$gway_archive" >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 1 --retry-all-errors \
            --range 0-0 "$arthexis_archive" >/dev/null

          echo "satellite_public_package_identity=ok"

      - name: Preflight Watchtower Wire capability
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 2
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x /usr/local/bin/gway
          test -x /opt/arthexis/.venv/bin/python
          sudo -n systemctl is-active --quiet arthexis-arthexis.com.service
          sudo -n /usr/local/bin/gway help wire >/dev/null
          sudo -n test -f /var/lib/gway/venv/share/gway/sampler/wire/watchtower.rx
          sudo -n /usr/local/bin/gway --json resolve wire watchtower | grep -F '"kind": "recipe"' >/dev/null
          sudo -n /usr/local/bin/gway --json resolve wire watchtower | grep -F 'sampler/wire/watchtower.rx' >/dev/null
          sudo -n /usr/local/bin/gway wire server check --domain register.arthexis.com >/dev/null
          echo "wire_preflight=ok"
          echo "wire_units=begin"
          sudo -n systemctl show gway-wire-enroll.service gway-wireguard-enroll.service -p Id -p LoadState -p ActiveState -p SubState --no-pager || true
          echo "wire_units=end"
          echo "wire_listener=begin"
          sudo -n ss -ltnp '( sport = :8787 )' || true
          echo "wire_listener=end"

      - name: Converge Watchtower Wire capability
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 2
        shell: bash
        env:
          ARTHEXIS_CERTBOT_EMAIL: ${{ secrets.ARTHEXIS_CERTBOT_EMAIL }}
        run: |
          set -Eeuo pipefail
          test -n "${ARTHEXIS_CERTBOT_EMAIL}"
          public_ipv4="$(getent ahostsv4 arthexis.com | awk 'NR == 1 {print $1}')"
          test -n "${public_ipv4}"
          sudo -n /usr/local/bin/gway -t wire watchtower \
            --email "${ARTHEXIS_CERTBOT_EMAIL}" \
            --public-address "${public_ipv4}"

      - name: Verify Watchtower Wire capability
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 2
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n systemctl is-active --quiet gway-wire-enroll.service
          if sudo -n systemctl is-active --quiet gway-wireguard-enroll.service; then
            echo "legacy_wire_enrollment=still_active" >&2
            exit 1
          fi
          sudo -n sh -c 'exec /usr/local/bin/gway log sources' | grep -F 'gway/wire-enroll' >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors \
            https://register.arthexis.com/health >/dev/null
          sudo -n /usr/local/bin/gway wire server check --domain register.arthexis.com >/dev/null
          echo "wire_extension=active"
          echo "legacy_wire_enrollment=retired"
          echo "wire_public_health=ok"

      - name: Verify deployed Arthexis
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 1
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /opt/arthexis/.venv/bin/python /opt/arthexis/manage.py check --fail-level ERROR >/dev/null 2>&1
          echo "django_check=ok"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /opt/arthexis/.venv/bin/python /opt/arthexis/manage.py makemigrations --check --dry-run >/dev/null 2>&1
          echo "migration_drift=none"
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" /opt/arthexis/.venv/bin/python /opt/arthexis/manage.py ocpp_matrix >/dev/null 2>&1
          echo "ocpp_matrix=ok"


      - name: Revalidate deployment pair before attestation
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 2
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ARTHEXIS_EXPECTED_SHA"
          test -n "$GWAY_EXPECTED_SHA"
          echo "deployment_pair=stable_for_attestation"

      - name: Record accepted Watchtower deployment
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          repository = os.environ["GITHUB_REPOSITORY"]
          api = os.environ["GITHUB_API_URL"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          state_branch = "watchtower-state"
          state_path = ".watchtower/accepted.json"

          manifest = {
              "arthexis_sha": os.environ["ARTHEXIS_EXPECTED_SHA"],
              "arthexis_version": os.environ["ARTHEXIS_EXPECTED_VERSION"],
              "gway_sha": os.environ["GWAY_EXPECTED_SHA"],
              "gway_version": os.environ["GWAY_EXPECTED_VERSION"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/{repository}/actions/runs/'
                  f'{os.environ["GITHUB_RUN_ID"]}'
              ),
              "accepted_at": datetime.now(timezone.utc).isoformat(),
              "release_intent": os.environ.get("WATCHTOWER_RELEASE_INTENT") or None,
              "stages": ["0-gway", "1-arthexis", "2-remote"],
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api}/repos/{repository}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise

          status, _ = request("GET", f"git/ref/heads/{state_branch}")
          if status == 404:
              request(
                  "POST",
                  "git/refs",
                  {"ref": f"refs/heads/{state_branch}", "sha": manifest["arthexis_sha"]},
              )

          status, existing = request(
              "GET", f"contents/{state_path}?ref={state_branch}"
          )
          payload = {
              "message": (
                  "Record accepted Watchtower deployment "
                  f'{manifest["arthexis_sha"][:12]} + {manifest["gway_sha"][:12]}'
              ),
              "content": base64.b64encode(
                  (json.dumps(manifest, indent=2, sort_keys=True) + "\n").encode()
              ).decode(),
              "branch": state_branch,
          }
          if status != 404:
              payload["sha"] = existing["sha"]

          request("PUT", f"contents/{state_path}", payload)
          print(json.dumps(manifest, sort_keys=True))
          PY
          echo "WATCHTOWER_DEPLOYMENT_ACCEPTED=true" >> "$GITHUB_ENV"

      - name: Reconcile PRs waiting on Watchtower
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 2
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${WATCHTOWER_DEPLOYMENT_ACCEPTED:-false}" != "true" ]]; then
            echo "Watchtower acceptance was not recorded; dependency reconciliation is skipped."
            exit 0
          fi
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "RELEASE_AUTOMATION_TOKEN is required to reconcile cross-repository Watchtower dependencies." >&2
            exit 1
          fi
          for repository in arthexis/arthexis arthexis/gway; do
            printf '{"event_type":"watchtower-accepted","client_payload":{"run_id":"%s"}}\n' \
              "$GITHUB_RUN_ID" | \
              gh api --method POST "repos/$repository/dispatches" --input -
          done

      - name: Restore previous Gway runtime after failed Gway stage
        if: ${{ failure() && fromJSON(env.WATCHTOWER_LEVEL) >= 0 && (env.GWAY_RUNTIME_SWAPPED == 'true' || env.GWAY_RUNTIME_SWITCH_STARTED == 'true') && env.GWAY_DEPLOYMENT_ACCEPTED != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          previous_target="${GWAY_RUNTIME_PREVIOUS_TARGET:-}"
          candidate_target="${GWAY_RUNTIME_CANDIDATE_TARGET:-}"
          if [[ "${GWAY_RUNTIME_ROLLBACK_AVAILABLE:-false}" != "true" ]] ||
             [[ -z "${previous_target}" ]] ||
             ! sudo -n test -d "${previous_target}"; then
            echo "gway_runtime_rollback=unavailable"
            exit 0
          fi

          echo "gway_runtime_rollback=starting target=${previous_target}"
          rollback_link=/var/lib/gway/venv.rollback
          sudo -n rm -rf "${rollback_link}"
          sudo -n ln -s "${previous_target}" "${rollback_link}"
          if sudo -n test -d /var/lib/gway/venv && ! sudo -n test -L /var/lib/gway/venv; then
            sudo -n rm -rf /var/lib/gway/venv
          fi
          sudo -n mv -Tf "${rollback_link}" /var/lib/gway/venv
          sudo -n chmod 0711 /var/lib/gway
          sudo -n chmod 0755 "${previous_target}" "${previous_target}/bin"
          sudo -n /var/lib/gway/venv/bin/python -m gway --help >/dev/null
          sudo -n /var/lib/gway/venv/bin/gway --help >/dev/null
          GWAY_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/gway" /var/lib/gway/venv/bin/python -m gway version >/dev/null

          sudo -n /usr/local/bin/gway --help >/dev/null
          sudo -n /usr/local/bin/gway version >/dev/null

          if [[ -n "${candidate_target}" && "${candidate_target}" != "${previous_target}" ]]; then
            sudo -n rm -rf "${candidate_target}"
          fi
          echo "gway_runtime_rollback=restored"

      - name: Finalize canonical Gway runtime
        if: ${{ success() && fromJSON(env.WATCHTOWER_LEVEL) >= 0 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          runtime_root=/var/lib/gway/venvs
          current_target="$(sudo -n readlink -f /var/lib/gway/venv)"
          sudo -n test -d "${current_target}"
          sudo -n /var/lib/gway/venv/bin/gway --help >/dev/null
          if sudo -n test -d "${runtime_root}"; then
            while IFS= read -r path; do
              [[ -n "${path}" ]] || continue
              resolved="$(sudo -n readlink -f "${path}")"
              if [[ "${resolved}" != "${current_target}" ]]; then
                sudo -n rm -rf "${path}"
              fi
            done < <(sudo -n find "${runtime_root}" -mindepth 1 -maxdepth 1 -print)
          fi
          echo "gway_runtime_finalized target=${current_target}"

      - name: Reconcile certified package publisher handoff
        if: fromJSON(env.WATCHTOWER_LEVEL) >= 3
        shell: bash
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          WATCHTOWER_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$RELEASE_AUTOMATION_TOKEN" ]]; then
            echo "RELEASE_AUTOMATION_TOKEN is required to dispatch certified publishers." >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          token = os.environ["RELEASE_AUTOMATION_TOKEN"]
          watchtower_run = os.environ["WATCHTOWER_RUN"]

          releases = (
              {
                  "package": "gway",
                  "repository": "arthexis/gway",
                  "workflow": "release.yml",
                  "version": os.environ["GWAY_EXPECTED_VERSION"],
                  "sha": os.environ["GWAY_EXPECTED_SHA"],
                  "companion_sha": os.environ["ARTHEXIS_EXPECTED_SHA"],
              },
              {
                  "package": "arthexis",
                  "repository": "arthexis/arthexis",
                  "workflow": "publish.yml",
                  "version": os.environ["ARTHEXIS_EXPECTED_VERSION"],
                  "sha": os.environ["ARTHEXIS_EXPECTED_SHA"],
                  "companion_sha": os.environ["GWAY_EXPECTED_SHA"],
              },
          )

          def request(method, url, payload=None, *, raw=False):
              data = None if payload is None else json.dumps(payload).encode()
              accept = (
                  "application/vnd.github.raw+json"
                  if raw
                  else "application/vnd.github+json"
              )
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": accept,
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      if not body:
                          return response.status, None
                      return response.status, (
                          body.decode() if raw else json.loads(body)
                      )
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise

          for release in releases:
              package = release["package"]
              version = release["version"]

              # Reaching stage 3 is the release intent. Lower runlevels never execute
              # this handoff, so no secondary PR-label gate is required here.
              target = f".watchtower/releases/{package}/{version}.json"
              status, body = request(
                  "GET",
                  (
                      f"{api}/repos/arthexis/arthexis/contents/{target}"
                      "?ref=watchtower-state"
                  ),
                  raw=True,
              )

              if status != 404:
                  manifest = json.loads(body)
                  expected = {
                      "package": package,
                      "version": version,
                      "sha": release["sha"],
                      "companion_sha": release["companion_sha"],
                  }
                  mismatches = {
                      key: (manifest.get(key), value)
                      for key, value in expected.items()
                      if manifest.get(key) != value
                  }
                  publication = manifest.get("publication", {})
                  incomplete = [
                      name
                      for name in ("pypi", "git_tag", "github_release")
                      if publication.get(name, {}).get("state") != "published"
                  ]
                  if mismatches or incomplete:
                      raise SystemExit(
                          f"Release evidence conflict for {target}: "
                          f"mismatches={mismatches!r} incomplete={incomplete!r}"
                      )
                  print(f"{package}_publish=already_recorded")
                  continue

              dispatch_url = (
                  f"{api}/repos/{release['repository']}/actions/workflows/"
                  f"{release['workflow']}/dispatches"
              )
              request(
                  "POST",
                  dispatch_url,
                  {
                      "ref": "main",
                      "inputs": {
                          "deployed_sha": release["sha"],
                          "companion_sha": release["companion_sha"],
                          "watchtower_run": watchtower_run,
                      },
                  },
              )
              print(f"{package}_publish=dispatched")
          PY
