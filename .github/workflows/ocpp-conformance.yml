name: OCPP Conformance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Official schema conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip

      - name: Install conformance runtime
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'jsonschema==4.25.1'

      - name: Prepare official schemas
        shell: bash
        run: |
          set -Eeuo pipefail
          schema_root="${RUNNER_TEMP}/ocpp-official-schemas"
          python -m scripts.ocpp_conformance_prepare --output-root "${schema_root}"
          echo "OCPP_CONFORMANCE_SCHEMA_ROOT=${schema_root}" >> "${GITHUB_ENV}"

      - name: Run official schema conformance
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/ocpp/test_official_schema_conformance.py
