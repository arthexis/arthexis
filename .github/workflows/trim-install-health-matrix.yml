name: Trim Install Health Matrix

on:
  push:
    branches:
      - ci/trim-install-health-matrix

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ci/trim-install-health-matrix
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Update matrix and tests
        run: python scripts/ci/trim_install_health_matrix.py
      - name: Commit changes
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/install-health.yml apps/core/tests/reports/release_publish_regressions.py
          git diff --cached --quiet && exit 0
          git commit -m 'ci: focus install health on supported platforms'
          git push origin HEAD:ci/trim-install-health-matrix
