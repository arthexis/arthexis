name: Ruff Autofix

on:
  pull_request:

jobs:
  autofix:
    name: Ruff autofix
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install normalization tools
        run: python -m pip install --upgrade pip ruff
      - name: Apply remaining deterministic normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          simple = {
              "apps/core/management/commands/benchmark.py": [
                  ("from typing import Dict, Tuple\n", ""),
                  ("Dict[", "dict["),
                  ("Tuple[", "tuple["),
              ],
              "apps/core/templatetags/sites.py": [
                  ("from typing import Optional, Union\n", "from typing import Optional\n"),
                  ("SiteLike = Union[Site, RequestSite]", "SiteLike = Site | RequestSite"),
              ],
              "apps/migration_utils.py": [
                  ("from typing import Any, Dict, Optional, Tuple\n", "from typing import Any, Optional\n"),
                  ("Dict[", "dict["),
                  ("Tuple[", "tuple["),
              ],
              "apps/protocols/registry.py": [
                  ("from collections.abc import Callable, Iterable, Sequence\n", "from collections.abc import Callable, Iterable, Sequence, Set\n"),
                  ("from typing import AbstractSet, Protocol, TypeAlias\n", "from typing import Protocol, TypeAlias\n"),
                  ("AbstractSet[", "Set["),
              ],
              "apps/sigils/sigil_context.py": [
                  ("from typing import Dict, Optional, Type\n", "from typing import Optional\n"),
                  ("Dict[", "dict["),
                  ("Type[", "type["),
              ],
              "apps/sites/management/commands/view_errors.py": [
                  ("from typing import List\n", ""),
                  ("List[", "list["),
              ],
              "apps/users/system.py": [
                  ("from typing import Literal, Tuple, overload\n", "from typing import Literal, overload\n"),
                  ("Tuple[", "tuple["),
              ],
              "config/whitenoise.py": [
                  ("from typing import Dict\n", ""),
                  ("Dict[", "dict["),
              ],
              "scripts/helpers/pip_install.py": [
                  ("from typing import Set\n", ""),
                  ("Set[", "set["),
              ],
              "apps/emails/models/inbox.py": [
                  ("raise ValidationError(str(exc))", "raise ValidationError(str(exc)) from exc"),
              ],
              "apps/nginx/renderers.py": [
                  ("raise ValueError(f\"Invalid JSON in {config_path}: {exc}\")", "raise ValueError(f\"Invalid JSON in {config_path}: {exc}\") from exc"),
              ],
              "scripts/certbot/godaddy_hook.py": [
                  ("raise SystemExit(1)", "raise SystemExit(1) from exc"),
              ],
              "scripts/staticfiles_md5.py": [
                  ("raise SystemExit(str(exc))", "raise SystemExit(str(exc)) from exc"),
              ],
              "utils/env_refresh.py": [
                  ("raise RuntimeError(f\"Refusing to delete database outside {base_dir}: {path}\")", "raise RuntimeError(f\"Refusing to delete database outside {base_dir}: {path}\") from None"),
              ],
          }
          for filename, replacements in simple.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Expected normalization source not found in {filename}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          path = Path("apps/nginx/management/commands/https_parts/service.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '"Resolve the duplicate site records, then run HTTPS setup again."\n                    )',
              '"Resolve the duplicate site records, then run HTTPS setup again."\n                    ) from None',
              1,
          )
          text = text.replace(
              '"Resolve the duplicate site records, then run HTTPS setup again."\n                        )',
              '"Resolve the duplicate site records, then run HTTPS setup again."\n                        ) from None',
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("apps/ocpp/admin/charger/actions/diagnostics.py")
          text = path.read_text(encoding="utf-8")
          old = 'raise self.DiagnosticsDownloadError(\n                "Diagnostics path escaped work directory."\n            )'
          if old not in text:
              raise SystemExit("Expected diagnostics B904 source not found")
          path.write_text(text.replace(old, old + " from None"), encoding="utf-8")

          path = Path("apps/ocpp/admin/cp_reservation.py")
          text = path.read_text(encoding="utf-8")
          old = 'raise forms.ValidationError(\n                    _("Unable to allocate a connector for the selected time window.")\n                )'
          if old not in text:
              raise SystemExit("Expected reservation field-error source not found")
          text = text.replace(old, old + " from exc", 1)
          text = text.replace(
              "raise forms.ValidationError(exc.messages or [str(exc)])",
              "raise forms.ValidationError(exc.messages or [str(exc)]) from exc",
              1,
          )
          text = text.replace(
              "raise ValidationError(exc.message_dict or exc.messages or str(exc))",
              "raise ValidationError(exc.message_dict or exc.messages or str(exc)) from exc",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m ruff check . --fix --unsafe-fixes
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .
      - name: Commit fixes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No normalization changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: finish Ruff normalization"
          git push origin "HEAD:$HEAD_REF"
