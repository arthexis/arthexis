name: Watchtower Recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Recovery action
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - cleanup-legacy
          - redeploy
      confirm_cleanup:
        description: Confirm moving the stale managed Arthexis checkout aside
        required: false
        default: false
        type: boolean

concurrency:
  group: watchtower-recovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recovery:
    name: Watchtower Recovery
    if: >-
      github.repository == 'arthexis/arthexis' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, arthexis-ci]
    timeout-minutes: 30
    env:
      ARTHEXIS_DATA_DIR: /var/lib/arthexis
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted invocation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "arthexis/arthexis"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          sudo -n true

      - name: Install exact canonical Gway
        shell: bash
        run: |
          set -Eeuo pipefail
          gway_sha="$(git ls-remote https://github.com/arthexis/gway.git refs/heads/main | awk '{print $1}')"
          test -n "${gway_sha}"
          python3 -m venv "${RUNNER_TEMP}/gway-venv"
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/gway-venv/bin/python" -m pip install "gway[toml] @ git+https://github.com/arthexis/gway.git@${gway_sha}"
          "${RUNNER_TEMP}/gway-venv/bin/gway" --help >/dev/null
          echo "GWAY_EXPECTED_SHA=${gway_sha}" >> "${GITHUB_ENV}"

      - name: Capture preflight diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "mode=${{ inputs.mode }}"
            echo "confirm_cleanup=${{ inputs.confirm_cleanup }}"
            echo "arthexis_sha=${GITHUB_SHA}"
            echo "gway_sha=${GWAY_EXPECTED_SHA:-unknown}"
            echo "runner=${RUNNER_NAME}"
            echo "=== system Gway paths ==="
            sudo -n ls -ld /var/lib/gway /var/lib/gway/projects /var/lib/gway/projects/arthexis 2>&1 || true
            sudo -n ls -l /var/lib/gway/state.sqlite 2>&1 || true
            echo "=== durable Arthexis data ==="
            sudo -n ls -ld "${ARTHEXIS_DATA_DIR}" 2>&1 || true
          } | tee "${RUNNER_TEMP}/watchtower-recovery.txt"

      - name: Require cleanup confirmation
        if: inputs.mode == 'cleanup-legacy' && inputs.confirm_cleanup != true
        shell: bash
        run: |
          echo "cleanup-legacy requires confirm_cleanup=true" >&2
          exit 64

      - name: Remove registered system installation
        if: inputs.mode == 'cleanup-legacy' && inputs.confirm_cleanup == true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n "${RUNNER_TEMP}/gway-venv/bin/gway" uninstall arthexis --system || true

      - name: Preserve stale managed checkout
        if: inputs.mode == 'cleanup-legacy' && inputs.confirm_cleanup == true
        shell: bash
        run: |
          set -Eeuo pipefail
          source_path=/var/lib/gway/projects/arthexis
          recovery_root=/var/lib/gway/recovery
          if sudo -n test -e "${source_path}"; then
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            recovery_path="${recovery_root}/arthexis-legacy-${stamp}"
            sudo -n mkdir -p "${recovery_root}"
            sudo -n mv "${source_path}" "${recovery_path}"
            echo "WATCHTOWER_RECOVERY_PATH=${recovery_path}" >> "${GITHUB_ENV}"
            echo "Preserved stale checkout at ${recovery_path}"
          else
            echo "No stale managed checkout remains at ${source_path}"
          fi

      - name: Verify cleanup boundary
        if: inputs.mode == 'cleanup-legacy' && inputs.confirm_cleanup == true
        shell: bash
        run: |
          set -Eeuo pipefail
          if sudo -n test -e /var/lib/gway/projects/arthexis; then
            echo "Managed Arthexis checkout still exists after cleanup" >&2
            exit 1
          fi
          echo "Durable application data was not modified:"
          sudo -n ls -ld "${ARTHEXIS_DATA_DIR}" 2>&1 || true

      - name: Redeploy current main through Gway
        if: inputs.mode == 'redeploy'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n "${RUNNER_TEMP}/gway-venv/bin/gway" install . --system --force
          test -f /var/lib/gway/projects/arthexis/pyproject.toml
          sudo -n mkdir -p "${ARTHEXIS_DATA_DIR}"
          cd /var/lib/gway/projects/arthexis
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" ./install.sh
          sudo -n env ARTHEXIS_DATA_DIR="${ARTHEXIS_DATA_DIR}" .venv/bin/python manage.py check --fail-level ERROR

      - name: Capture post-run diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "=== result ==="
            echo "mode=${{ inputs.mode }}"
            echo "recovery_path=${WATCHTOWER_RECOVERY_PATH:-none}"
            echo "=== managed checkout ==="
            sudo -n ls -ld /var/lib/gway/projects/arthexis 2>&1 || true
            echo "=== recovery snapshots ==="
            sudo -n ls -ld /var/lib/gway/recovery /var/lib/gway/recovery/arthexis-legacy-* 2>&1 || true
            echo "=== durable Arthexis data ==="
            sudo -n ls -ld "${ARTHEXIS_DATA_DIR}" 2>&1 || true
          } 2>&1 | tee -a "${RUNNER_TEMP}/watchtower-recovery.txt"
          echo "WATCHTOWER_RECOVERY_EVIDENCE=${RUNNER_TEMP}/watchtower-recovery.txt" >> "${GITHUB_ENV}"

      - name: Upload recovery evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: watchtower-recovery-${{ github.run_id }}
          path: ${{ env.WATCHTOWER_RECOVERY_EVIDENCE }}
          if-no-files-found: warn
