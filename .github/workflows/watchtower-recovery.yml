name: Watchtower Recovery

on:
  workflow_dispatch:

concurrency:
  group: watchtower-recovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recovery:
    name: Watchtower Recovery
    if: >-
      github.repository == 'arthexis/arthexis' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, arthexis-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted invocation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY}" = "arthexis/arthexis"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          sudo -n true

      - name: Run sanitized diagnostics
        shell: bash
        run: |
          set +e

          report() {
            if "$@" >/dev/null 2>&1; then
              echo "$1=ok"
            else
              echo "$1=failed"
            fi
          }

          if sudo -n systemctl is-active --quiet arthexis-arthexis.com.service; then
            echo "service=active"
          else
            echo "service=inactive"
          fi

          if curl --fail --silent --show-error --max-time 5 --header 'Host: arthexis.com' http://127.0.0.1:8888/health/ >/dev/null 2>&1; then
            echo "local_health=ok"
          else
            echo "local_health=failed"
          fi

          if curl --fail --silent --show-error --max-time 10 https://arthexis.com/health/ >/dev/null 2>&1; then
            echo "public_health=ok"
          else
            echo "public_health=failed"
          fi

          root_html="$(curl --fail --silent --show-error --max-time 10 https://arthexis.com/ 2>/dev/null)"
          if grep -F '<h1 id="constellation">Constellation</h1>' <<<"${root_html}" >/dev/null &&
             grep -F '<h2 id="operational-capabilities">Operational Capabilities</h2>' <<<"${root_html}" >/dev/null; then
            echo "public_root=ok"
          else
            echo "public_root=failed"
          fi

          if sudo -n nginx -t >/dev/null 2>&1; then
            echo "nginx_config=ok"
          else
            echo "nginx_config=failed"
          fi

          if sudo -n systemctl is-active --quiet nginx; then
            echo "nginx_service=active"
          else
            echo "nginx_service=inactive"
          fi

          if sudo -n env ARTHEXIS_DATA_DIR=/var/lib/arthexis /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py check --fail-level ERROR >/dev/null 2>&1; then
            echo "django_check=ok"
          else
            echo "django_check=failed"
          fi

          if sudo -n env ARTHEXIS_DATA_DIR=/var/lib/arthexis /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py makemigrations --check --dry-run >/dev/null 2>&1; then
            echo "migration_drift=none"
          else
            echo "migration_drift=detected"
          fi

          if sudo -n env ARTHEXIS_DATA_DIR=/var/lib/arthexis /var/lib/gway/projects/arthexis/.venv/bin/python /var/lib/gway/projects/arthexis/manage.py ocpp_matrix >/dev/null 2>&1; then
            echo "ocpp_matrix=ok"
          else
            echo "ocpp_matrix=failed"
          fi
