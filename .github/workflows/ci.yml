name: CI

on:
  pull_request:
  push:
    branches:
      - arthexis-3.0
      - main

jobs:
  test:
    name: ${{ matrix.runner }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            python: "3.10"
          - runner: ubuntu-24.04
            python: "3.11"
          - runner: ubuntu-24.04
            python: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Django system check
        run: python manage.py check

      - name: Ansible Arthexis syntax
        run: ansible-playbook ansible/playbooks/arthexis.yml --syntax-check

      - name: Ansible OCPP Collector syntax
        run: ansible-playbook ansible/playbooks/ocpp-collector.yml --syntax-check

      - name: Ansible Watchtower syntax
        run: ansible-playbook ansible/playbooks/watchtower.yml --syntax-check

      - name: Ansible appliance syntax
        run: ansible-playbook ansible/appliance.yml --syntax-check

      - name: Project tests
        run: python -m pytest tests/project

      - name: Integration tests
        run: python -m pytest tests/integrations

      - name: Dashboard tests
        run: python -m pytest tests/dashboard

      - name: Ansible contract tests
        run: python -m pytest tests/ansible
