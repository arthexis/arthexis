name: Linux CI

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  NODE_OPTIONS: '--no-deprecation'
  ARTHEXIS_DB_BACKEND: sqlite
  OCPP_STATE_REDIS_URL: redis://localhost:6379
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: '6379'
  ARTHEXIS_SKIP_SANITY_APT: '1'

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  # Keep the PR trigger effectively unfiltered so the required Linux sanity
  # check is reported for every pull request. The catch-all path keeps the
  # workflow-policy regression contract while avoiding skipped required checks.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '**'
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - '**/*.py'
      - '**/*.json'
      - '**/*.toml'
      - '**/*.txt'
      - '.python-version'
      - '.github/workflows/ci.yml'
      - 'apps/**'
      - 'config/**'
      - 'docs/development/ci.md'
      - 'requirements*.txt'
      - 'scripts/**'
      - 'tests/**'
      - 'manage.py'
      - 'configure.sh'
      - 'env-refresh.sh'
      - 'install.sh'
      - 'start.sh'
      - 'stop.sh'
      - 'upgrade.sh'
  workflow_dispatch:

jobs:
  pr-readiness:
    name: PR readiness
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      up-to-date: ${{ steps.check.outputs.result }}
    steps:
      - id: check
        name: Check whether the PR includes the current base
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            if (context.eventName !== 'pull_request') {
              return 'true';
            }

            const pull = context.payload.pull_request;
            const { data: comparison } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: pull.base.sha,
              head: pull.head.sha,
            });

            const upToDate = comparison.status === 'ahead' || comparison.status === 'identical';
            if (!upToDate) {
              core.notice(
                `Skipping Linux sanity: ${pull.head.ref} does not include ${pull.base.ref} at ${pull.base.sha}. Update the PR branch first.`
              );
            }

            return String(upToDate);

  sanity:
    name: Linux sanity
    needs: pr-readiness
    if: needs.pr-readiness.outputs.up-to-date == 'true'
    runs-on: [self-hosted, Linux, X64, arthexis-ci]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true

      - name: Clean workspace
        run: |
          git clean -ffdx

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run Linux sanity checks
        run: |
          ./scripts/ci/linux-sanity.sh
