[project]
name = "arthexis"
aliases = ["constellation", "ocpp", "energy"]
service_profile_file = ".locks/role.lck"

[adapter]
type = "django"
manage = "manage.py"
settings = "config.settings"

# GWAY applies this environment only when commands run from the managed checkout.
# Source/development checkouts keep their normal local runtime paths.
[adapter.managed_environment]
ARTHEXIS_MODE = "installed"
ARTHEXIS_DATA_DIR = "{root}/var/lib"
ARTHEXIS_LOG_DIR = "{root}/var/log"
ARTHEXIS_CACHE_DIR = "{root}/var/cache"
ARTHEXIS_RUN_DIR = "{root}/var/run"

# GWAY owns the managed checkout and Python environment described here.
# Arthexis lifecycle hooks only perform application-specific preparation.
[install]
root = "/opt/arthexis"
checkout = "app"
environment = ".venv"

[lifecycle]
install = "apps.core.system.managed_install:install"
upgrade = "apps.core.system.managed_update:upgrade"
uninstall = "apps.core.system.managed_uninstall:uninstall"

# Arthexis persists its canonical role in .locks/role.lck. GWAY uses that
# project-owned value only as an internal service-profile selector, so callers
# choose --role and do not need a separate --service-profile argument.
# Terminal/Watchtower use a loopback web listener; Control/Satellite keep the
# charger-facing listener. Worker/beat remain enabled for roles that need them.
[services.web-local]
description = "Arthexis local web service"
command = ["{python}", "manage.py", "runserver", "127.0.0.1:8888", "--noreload"]
working_directory = "{project}"
writable_paths = ["{project}/.locks"]
profiles = ["Terminal", "Watchtower"]
restart = "on-failure"
restart_sec = 5

[services.web-local.environment]
PYTHONUNBUFFERED = "1"
ARTHEXIS_MODE = "installed"
ARTHEXIS_DATA_DIR = "/opt/arthexis/var/lib"
ARTHEXIS_LOG_DIR = "/opt/arthexis/var/log"
ARTHEXIS_CACHE_DIR = "/opt/arthexis/var/cache"
ARTHEXIS_RUN_DIR = "/opt/arthexis/var/run"

[services.web-edge]
description = "Arthexis charger-facing web service"
command = ["{python}", "manage.py", "runserver", "0.0.0.0:8888", "--noreload"]
working_directory = "{project}"
writable_paths = ["{project}/.locks"]
profiles = ["Control", "Satellite"]
restart = "on-failure"
restart_sec = 5

[services.web-edge.environment]
PYTHONUNBUFFERED = "1"
ARTHEXIS_MODE = "installed"
ARTHEXIS_DATA_DIR = "/opt/arthexis/var/lib"
ARTHEXIS_LOG_DIR = "/opt/arthexis/var/log"
ARTHEXIS_CACHE_DIR = "/opt/arthexis/var/cache"
ARTHEXIS_RUN_DIR = "/opt/arthexis/var/run"

[services.worker]
description = "Arthexis Celery worker"
command = ["{python}", "-m", "celery", "-A", "config.celery:app", "worker", "--loglevel=INFO"]
working_directory = "{project}"
writable_paths = ["{project}/.locks"]
profiles = ["Control", "Satellite", "Watchtower"]
restart = "on-failure"
restart_sec = 5

[services.worker.environment]
PYTHONUNBUFFERED = "1"
ARTHEXIS_MODE = "installed"
ARTHEXIS_DATA_DIR = "/opt/arthexis/var/lib"
ARTHEXIS_LOG_DIR = "/opt/arthexis/var/log"
ARTHEXIS_CACHE_DIR = "/opt/arthexis/var/cache"
ARTHEXIS_RUN_DIR = "/opt/arthexis/var/run"

[services.beat]
description = "Arthexis Celery beat scheduler"
command = ["{python}", "-m", "celery", "-A", "config.celery:app", "beat", "--loglevel=INFO"]
working_directory = "{project}"
writable_paths = ["{project}/.locks"]
profiles = ["Control", "Satellite", "Watchtower"]
restart = "on-failure"
restart_sec = 5

[services.beat.environment]
PYTHONUNBUFFERED = "1"
ARTHEXIS_MODE = "installed"
ARTHEXIS_DATA_DIR = "/opt/arthexis/var/lib"
ARTHEXIS_LOG_DIR = "/opt/arthexis/var/log"
ARTHEXIS_CACHE_DIR = "/opt/arthexis/var/cache"
ARTHEXIS_RUN_DIR = "/opt/arthexis/var/run"
