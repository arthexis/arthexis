[project]
name = "arthexis"
aliases = ["constellation"]

[adapter]
type = "django"
manage = "manage.py"
settings = "config.settings"

# Declarative deployment target consumed by GWAY. The application owns its
# preparation hooks while GWAY owns checkout/update and service lifecycle.
[install]
root = "/opt/arthexis"
checkout = "app"
environment = ".venv"

[lifecycle]
install = "apps.core.system.lifecycle:install"
upgrade = "apps.core.system.lifecycle:upgrade"
