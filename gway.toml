[project]
name = "arthexis"
version = "2.0"
aliases = ["ocpp", "energy", "chargers"]

# Descriptive traits for newer GWAY releases.  The current gateway-rebuild
# reader ignores these tables while consuming the canonical [[ingest]] entry.
[django]
manage = "manage.py"
settings = "arthexis.settings"
app_packages = ["apps"]

[surface]
model_api = "direct"
management_commands = "app-wide-only"
legacy_import = "installer-flag"

[[ingest]]
kind = "django"
source = "."
name = "arthexis"
settings = "arthexis.settings"
manage = "manage.py"
model_api = true
