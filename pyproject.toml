[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arthexis"
version = "3.0.0.dev0"
description = "Arthexis dashboard and business suite"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<5.3",
    "ansible>=10,<11; python_version < '3.11'",
    "ansible>=11,<12; python_version >= '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-django>=4.9,<5",
]

[tool.setuptools]
packages = ["arthexis", "dashboard", "integrations", "integrations.ocpp_csms"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "arthexis.settings"
testpaths = ["tests"]
addopts = "--durations=0 --durations-min=0.01"
