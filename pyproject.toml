  "tablib==3.10.0",
  "tinycss2==1.5.1",
  "toml==0.10.2",
  "tomli>=1.1.0; python_version < \"3.11\"",
  "Twisted==25.5.0",
  "txaio==25.9.2",
  "typing_extensions==4.16.0",
  "urllib3>=2.6.3,<2.8.0",
  "weasyprint==69.0",
  "webauthn==2.7.1",
  "websocket-client==1.9.0",
  "websockets>=15,<17",
  "whitenoise==6.12.0",
]

[[project.authors]]
name = "Rafael J. Guillén-Osorio"
email = "tecnologia@gelectriic.com"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Repository = "https://github.com/arthexis/arthexis"
Homepage = "https://arthexis.com"



[project.optional-dependencies]
ci = [
  "black==26.5.1",
  "django-stubs-ext==6.0.9",
  "django-stubs==6.0.9",
  "import-linter==2.14",
  "ruff==0.16.5",
  "twine==7.0.0",
  "types-requests==2.33.0.20260712",
]
dev = [
  "django-debug-toolbar==7.1.1",
]
docs = [
  "mkdocs==1.6.1",
]
hardware = [
  "gpiozero==2.0.1.post3; sys_platform == \"linux\" and (platform_machine == \"armv7l\" or platform_machine == \"aarch64\")",
  "mfrc522==0.0.7; sys_platform == \"linux\" and (platform_machine == \"armv7l\" or platform_machine == \"aarch64\") and python_version < \"3.12\"",
  "smbus2==0.6.1; sys_platform == \"linux\" and (platform_machine == \"armv7l\" or platform_machine == \"aarch64\")",
]
nodes = [
  "graphviz==0.21",
  "qrcode==8.2",
]
qa = [
  "pytest-asyncio==1.4.0",
  "pytest-django==4.14.0",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "pytest==9.1.1",
]

