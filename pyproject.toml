[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arthexis"
version = "2.0.0"
description = "Field-safe EV charging operations and OCPP services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django==5.2.12",
    "Markdown==3.10.3",
    "celery==5.5.3",
    "channels==4.3.2",
    "channels_redis==4.3.0",
    "daphne==4.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
]

[project.scripts]
arthexis = "manage:main"
reconcile = "scripts.reconcile:main"
ready = "arthexis.ready:main"
serve = "arthexis.server:main"

[project.urls]
Repository = "https://github.com/arthexis/arthexis"

[tool.gway.variables]
cache_dir = "/var/lib/gway/cache"

[[tool.gway.bindings]]
topics = []
subject = "role"
sources = [{type = "file", value = "/var/lib/arthexis/role"}]

[[tool.gway.roles.watchtower.guide]]
tasks = ["check this node", "watchtower status"]
command = "node status"
reason = "Inspect the local Watchtower application and remote-service status."

[[tool.gway.roles.watchtower.guide]]
tasks = ["diagnose this node", "diagnose watchtower"]
command = "node diagnose"
reason = "Run the maintained Watchtower diagnostic aggregation."

[[tool.gway.roles.watchtower.guide]]
tasks = ["audit server hardening", "security audit"]
command = "node security audit"
reason = "Inspect the local Watchtower security boundary without mutation."

[tool.setuptools]
include-package-data = true
py-modules = ["manage"]

[tool.setuptools.package-data]
"apps.base" = ["templates/**/*.html"]

[tool.setuptools.packages.find]
include = ["apps*", "arthexis*", "scripts*", "node*"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E9", "F823", "I", "UP", "B904"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "arthexis.settings"
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
