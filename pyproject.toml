[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arthexis"
version = "2.0.2"
description = "Field-safe EV charging operations and OCPP services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django==5.2.12",
    "Markdown==3.10.3",
    "celery==5.5.3",
    "channels==4.3.2",
    "channels_redis==4.3.0",
    "daphne==4.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-xdist>=3.6",
]

[project.scripts]
arthexis = "manage:main"
reconcile = "scripts.reconcile:main"
ready = "arthexis.ready:main"
serve = "arthexis.server:cli_main"

[project.urls]
Repository = "https://github.com/arthexis/arthexis"

[tool.gway.variables]
cache_dir = "/var/lib/gway/cache"

[tool.setuptools]
include-package-data = true
py-modules = ["manage"]

[tool.setuptools.package-data]
"apps.base" = ["templates/**/*.html"]

[tool.setuptools.packages.find]
include = ["apps*", "arthexis*", "scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E9", "F823", "I", "UP", "B904"]
ignore = ["I001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "arthexis.settings"
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "reconciliation_e2e: slow end-to-end legacy reconciliation acceptance",
    "workflow: CI and GitHub Actions workflow contract validation",
    "xdist_group(name): serialize tests sharing external process or service resources",
]
