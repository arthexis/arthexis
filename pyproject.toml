[build-system]
requires = [ "setuptools", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "arthexis"
dynamic = ["version"]
description = "Energy & Power Infrastructure"
requires-python = ">=3.10,<3.14"
classifiers = [ "Programming Language :: Python :: 3", "Framework :: Django",]
dependencies = [
  "anyio==4.14.2",
  "asgiref==3.12.1",
  "autobahn==24.4.2",
  "bleach==6.4.0",
  "boto3==1.43.41",
  "botocore==1.43.83",
  "celery==5.5.3",
  "cffi==2.1.1",
  "channels-redis==4.3.0",
  "channels==4.3.2",
  "click-didyoumean==0.3.1",
  "click-plugins==1.1.1.2",
  "click-repl==0.3.0",
  "click==8.5.0",
  "colorama==0.4.6",
  "cron-descriptor==2.1.0",
  "cryptography>=49.0.0,<51.0.0",
  "daphne==4.2.3",
  "defusedxml==0.7.1",
  "diff-match-patch==20241021",
  "django-celery-beat==2.8.1",
  "django-encrypted-model-fields==0.6.5",
  "django-import-export==4.4.1",
  "django-mermaid==0.1.1",
  "django-object-actions==5.1.2",
  "django-otp==1.7.0",
  "django-parler==2.4",
  "django-timezone-field==7.2.2",
  "Django==5.2.17",
  "dnspython==2.8.0",
  "docutils==0.23",
  "filelock==3.32.4",
  "httpx==0.28.1",
  "kombu==5.5.4",
  "Markdown==3.10.3",
  "mdx_truly_sane_lists==1.3",
  "packaging==26.3",
  "pillow==12.3.0",
  "plyer==2.1.0; sys_platform == \"win32\"",
  "prompt_toolkit==3.0.53",
  "psutil==7.2.2",
  "psycopg-binary==3.3.4",
  "psycopg==3.3.4",
  "pycparser==3.0",
  "pyOpenSSL==26.3.0",
  "PySocks==1.7.1",
  "python-crontab==3.3.0",
  "python-dateutil==2.9.0.post0",
  "python-dotenv==1.2.3",
