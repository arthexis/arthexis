---
- name: Validate OCPP Collector host and variables
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.architecture in ['x86_64', 'amd64', 'aarch64', 'arm64']
      - ocpp_collector_listen_port | int >= 1
      - ocpp_collector_listen_port | int <= 65535
      - ocpp_collector_pg_port | int >= 1
      - ocpp_collector_pg_port | int <= 65535
      - ocpp_collector_database is match('^[a-z_][a-z0-9_]*$')
      - ocpp_collector_db_role is match('^[a-z_][a-z0-9_]*$')
      - ocpp_collector_proxy_mode in ['auto', 'nginx', 'none']
      - ocpp_collector_jwt_secret | length >= 32
      - ocpp_collector_jwt_ttl_seconds | int >= 1
      - (ocpp_collector_satellites | map(attribute='id') | list | unique | list | length) == (ocpp_collector_satellites | length)
      - not (ocpp_collector_pg_host | length == 0) or ocpp_collector_db_role == ocpp_collector_service_user
      - (ocpp_collector_tls_certificate | length == 0) == (ocpp_collector_tls_certificate_key | length == 0)
    fail_msg: >-
      OCPP Collector requires a Debian-family x86_64/ARM64 host and valid,
      conservative database/proxy configuration.

- name: Validate OCPP Collector satellite enrollment identifiers
  ansible.builtin.assert:
    that:
      - item.id is match('^[A-Za-z0-9][A-Za-z0-9._-]*  become: true
  ansible.builtin.apt:
    name:
      - libpq5
      - postgresql-client
      - xz-utils
    state: present
    update_cache: true

- name: Decide whether PostgreSQL should be auto-detected
  ansible.builtin.set_fact:
    ocpp_collector_pg_autodetected: "{{ ocpp_collector_pg_host | length == 0 }}"

- name: Check local PostgreSQL socket
  ansible.builtin.stat:
    path: "{{ ocpp_collector_pg_local_socket_dir }}/.s.PGSQL.{{ ocpp_collector_pg_port }}"
  register: ocpp_collector_local_pg_socket
  when: ocpp_collector_pg_autodetected | bool

- name: Refuse to guess or install PostgreSQL
  ansible.builtin.assert:
    that:
      - ocpp_collector_local_pg_socket.stat.exists
    fail_msg: >-
      No local PostgreSQL socket was found at
      {{ ocpp_collector_pg_local_socket_dir }}/.s.PGSQL.{{ ocpp_collector_pg_port }}.
      OCPP Collector never installs PostgreSQL or guesses a remote instance.
      Set ocpp_collector_pg_host/ocpp_collector_pg_port and administrative
      connection variables explicitly.
  when: ocpp_collector_pg_autodetected | bool

- name: Resolve PostgreSQL endpoint
  ansible.builtin.set_fact:
    ocpp_collector_resolved_pg_host: >-
      {{
        ocpp_collector_pg_local_socket_dir
        if ocpp_collector_pg_autodetected | bool
        else ocpp_collector_pg_host
      }}

- name: Verify selected PostgreSQL endpoint
  ansible.builtin.command:
    argv:
      - pg_isready
      - -q
      - -h
      - "{{ ocpp_collector_resolved_pg_host }}"
      - -p
      - "{{ ocpp_collector_pg_port | string }}"
  changed_when: false

- name: Report resolved PostgreSQL connection
  ansible.builtin.debug:
    msg:
      mode: "{{ 'auto-detected local socket' if ocpp_collector_pg_autodetected | bool else 'explicit' }}"
      host: "{{ ocpp_collector_resolved_pg_host }}"
      port: "{{ ocpp_collector_pg_port }}"
      database: "{{ ocpp_collector_database }}"
      admin_database: "{{ ocpp_collector_pg_admin_database }}"
      admin_user: "{{ ocpp_collector_pg_admin_user }}"

- name: Create OCPP Collector service group
  become: true
  ansible.builtin.group:
    name: "{{ ocpp_collector_service_group }}"
    system: true
    state: present

- name: Create OCPP Collector service user
  become: true
  ansible.builtin.user:
    name: "{{ ocpp_collector_service_user }}"
    group: "{{ ocpp_collector_service_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Create OCPP Collector configuration directory
  become: true
  ansible.builtin.file:
    path: "{{ ocpp_collector_config_dir }}"
    state: directory
    owner: root
    group: "{{ ocpp_collector_service_group }}"
    mode: "0750"

- name: Render PostgreSQL bootstrap SQL
  become: true
  ansible.builtin.template:
    src: bootstrap.sql.j2
    dest: "{{ ocpp_collector_config_dir }}/bootstrap.sql"
    owner: root
    group: root
    mode: "0644"

- name: Bootstrap OCPP Collector database and roles
  become: "{{ ocpp_collector_pg_autodetected | bool }}"
  become_user: "{{ ocpp_collector_pg_admin_user }}"
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -v
      - ON_ERROR_STOP=1
      - -v
      - "collector_password={{ ocpp_collector_db_password }}"
      - -h
      - "{{ ocpp_collector_resolved_pg_host }}"
      - -p
      - "{{ ocpp_collector_pg_port | string }}"
      - -U
      - "{{ ocpp_collector_pg_admin_user }}"
      - -d
      - "{{ ocpp_collector_pg_admin_database }}"
      - -f
      - "{{ ocpp_collector_config_dir }}/bootstrap.sql"
  environment:
    PGPASSWORD: "{{ ocpp_collector_pg_admin_password }}"
  changed_when: false
  no_log: "{{ ocpp_collector_db_password | length > 0 or ocpp_collector_pg_admin_password | length > 0 }}"

- name: Render OCPP Collector schema SQL
  become: true
  ansible.builtin.template:
    src: schema.sql.j2
    dest: "{{ ocpp_collector_config_dir }}/schema.sql"
    owner: root
    group: root
    mode: "0644"

- name: Converge OCPP Collector schema
  become: "{{ ocpp_collector_pg_autodetected | bool }}"
  become_user: "{{ ocpp_collector_pg_admin_user }}"
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -v
      - ON_ERROR_STOP=1
      - -h
      - "{{ ocpp_collector_resolved_pg_host }}"
      - -p
      - "{{ ocpp_collector_pg_port | string }}"
      - -U
      - "{{ ocpp_collector_pg_admin_user }}"
      - -d
      - "{{ ocpp_collector_database }}"
      - -f
      - "{{ ocpp_collector_config_dir }}/schema.sql"
  environment:
    PGPASSWORD: "{{ ocpp_collector_pg_admin_password }}"
  changed_when: false
  no_log: "{{ ocpp_collector_pg_admin_password | length > 0 }}"

- name: Render OCPP Collector enrollment SQL
  become: true
  ansible.builtin.template:
    src: enrollment.sql.j2
    dest: "{{ ocpp_collector_config_dir }}/enrollment.sql"
    owner: root
    group: root
    mode: "0644"

- name: Converge OCPP Collector satellite enrollment
  become: "{{ ocpp_collector_pg_autodetected | bool }}"
  become_user: "{{ ocpp_collector_pg_admin_user }}"
  ansible.builtin.command:
    argv:
      - psql
      - -X
      - -v
      - ON_ERROR_STOP=1
      - -h
      - "{{ ocpp_collector_resolved_pg_host }}"
      - -p
      - "{{ ocpp_collector_pg_port | string }}"
      - -U
      - "{{ ocpp_collector_pg_admin_user }}"
      - -d
      - "{{ ocpp_collector_database }}"
      - -f
      - "{{ ocpp_collector_config_dir }}/enrollment.sql"
  environment:
    PGPASSWORD: "{{ ocpp_collector_pg_admin_password }}"
  changed_when: false
  no_log: "{{ ocpp_collector_pg_admin_password | length > 0 }}"

- name: Install OCPP Collector token utility
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../tools/ocpp_collector_token.py"
    dest: /usr/local/bin/ocpp-collector-token
    owner: root
    group: root
    mode: "0755"

- name: Resolve PostgREST release architecture
  ansible.builtin.set_fact:
    ocpp_collector_postgrest_arch: >-
      {{ 'aarch64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'x86-64' }}
    ocpp_collector_postgrest_sha256: >-
      {{
        ocpp_collector_postgrest_aarch64_sha256
        if ansible_facts.architecture in ['aarch64', 'arm64']
        else ocpp_collector_postgrest_x86_64_sha256
      }}

- name: Create versioned PostgREST directory
  become: true
  ansible.builtin.file:
    path: "{{ ocpp_collector_postgrest_prefix }}/postgrest-v{{ ocpp_collector_postgrest_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download pinned PostgREST release
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/PostgREST/postgrest/releases/download/v{{ ocpp_collector_postgrest_version }}/postgrest-v{{ ocpp_collector_postgrest_version }}-linux-static-{{ ocpp_collector_postgrest_arch }}.tar.xz
    dest: "{{ ocpp_collector_postgrest_prefix }}/postgrest-v{{ ocpp_collector_postgrest_version }}.tar.xz"
    checksum: "sha256:{{ ocpp_collector_postgrest_sha256 }}"
    mode: "0644"

- name: Extract pinned PostgREST release
  become: true
  ansible.builtin.unarchive:
    src: "{{ ocpp_collector_postgrest_prefix }}/postgrest-v{{ ocpp_collector_postgrest_version }}.tar.xz"
    dest: "{{ ocpp_collector_postgrest_prefix }}/postgrest-v{{ ocpp_collector_postgrest_version }}"
    remote_src: true
    creates: "{{ ocpp_collector_postgrest_prefix }}/postgrest-v{{ ocpp_collector_postgrest_version }}/postgrest"

- name: Link stable PostgREST command
  become: true
  ansible.builtin.file:
    src: "{{ ocpp_collector_postgrest_prefix }}/postgrest-v{{ ocpp_collector_postgrest_version }}/postgrest"
    dest: "{{ ocpp_collector_postgrest_binary }}"
    state: link
    force: true

- name: Resolve PostgREST database URI
  ansible.builtin.set_fact:
    ocpp_collector_resolved_db_uri: >-
      {{
        'postgresql://' ~ ocpp_collector_db_role ~ '@/' ~ ocpp_collector_database
        ~ '?host=' ~ (ocpp_collector_resolved_pg_host | urlencode)
        ~ '&port=' ~ (ocpp_collector_pg_port | string)
        if ocpp_collector_pg_autodetected | bool
        else
        'postgresql://' ~ ocpp_collector_db_role
        ~ (':' ~ (ocpp_collector_db_password | urlencode) if ocpp_collector_db_password | length > 0 else '')
        ~ '@' ~ ocpp_collector_resolved_pg_host ~ ':' ~ (ocpp_collector_pg_port | string)
        ~ '/' ~ ocpp_collector_database
      }}
  no_log: "{{ ocpp_collector_db_password | length > 0 }}"

- name: Render PostgREST configuration
  become: true
  ansible.builtin.template:
    src: postgrest.conf.j2
    dest: "{{ ocpp_collector_config_path }}"
    owner: root
    group: "{{ ocpp_collector_service_group }}"
    mode: "0640"
  notify: Restart OCPP Collector
  no_log: true

- name: Render OCPP Collector systemd unit
  become: true
  ansible.builtin.template:
    src: ocpp-collector.service.j2
    dest: "/etc/systemd/system/{{ ocpp_collector_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart OCPP Collector

- name: Enable and start OCPP Collector
  become: true
  ansible.builtin.systemd:
    name: "{{ ocpp_collector_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Inspect existing nginx installation
  ansible.builtin.stat:
    path: /etc/nginx/nginx.conf
  register: ocpp_collector_nginx_config
  when: ocpp_collector_proxy_mode in ['auto', 'nginx']

- name: Resolve OCPP Collector proxy mode
  ansible.builtin.set_fact:
    ocpp_collector_resolved_proxy_mode: >-
      {{
        ('nginx' if ocpp_collector_nginx_config.stat.exists else 'missing')
        if ocpp_collector_proxy_mode == 'auto'
        else ocpp_collector_proxy_mode
      }}

- name: Refuse to guess reverse-proxy infrastructure
  ansible.builtin.assert:
    that:
      - ocpp_collector_resolved_proxy_mode != 'missing'
      - ocpp_collector_resolved_proxy_mode != 'nginx' or ocpp_collector_nginx_config.stat.exists
    fail_msg: >-
      No existing nginx installation was detected. Set
      ocpp_collector_proxy_mode=nginx when nginx is installed in a nonstandard
      layout, or ocpp_collector_proxy_mode=none when another reverse proxy/TLS
      layer owns exposure of the Collector.
  when: ocpp_collector_proxy_mode == 'auto'

- name: Validate nginx TLS paths when TLS is role-managed
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ ocpp_collector_tls_certificate }}"
    - "{{ ocpp_collector_tls_certificate_key }}"
  register: ocpp_collector_tls_files
  when:
    - ocpp_collector_resolved_proxy_mode == 'nginx'
    - ocpp_collector_tls_certificate | length > 0

- name: Assert nginx TLS files exist
  ansible.builtin.assert:
    that:
      - ocpp_collector_tls_files.results | map(attribute='stat.exists') | min
    fail_msg: "Configured OCPP Collector TLS certificate/key files do not exist."
  when:
    - ocpp_collector_resolved_proxy_mode == 'nginx'
    - ocpp_collector_tls_certificate | length > 0

- name: Render nginx OCPP Collector site
  become: true
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ ocpp_collector_nginx_site_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  when: ocpp_collector_resolved_proxy_mode == 'nginx'

- name: Enable nginx OCPP Collector site
  become: true
  ansible.builtin.file:
    src: "{{ ocpp_collector_nginx_site_path }}"
    dest: "{{ ocpp_collector_nginx_site_link }}"
    state: link
  notify: Reload nginx
  when: ocpp_collector_resolved_proxy_mode == 'nginx'

- name: Validate nginx configuration before reload
  become: true
  ansible.builtin.command:
    argv:
      - nginx
      - -t
  changed_when: false
  when: ocpp_collector_resolved_proxy_mode == 'nginx'

- name: Flush OCPP Collector handlers
  ansible.builtin.meta: flush_handlers

- name: Verify local OCPP Collector API
  ansible.builtin.uri:
    url: "http://{{ ocpp_collector_listen_host }}:{{ ocpp_collector_listen_port }}/"
    method: GET
    status_code:
      - 200
    return_content: false
  register: ocpp_collector_health
  retries: 5
  delay: 2
  until: ocpp_collector_health.status == 200
)
    fail_msg: "Invalid OCPP Collector satellite id: {{ item.id | default('') }}"
  loop: "{{ ocpp_collector_satellites }}"
  loop_control:
    label: "{{ item.id | default('invalid') }}"

