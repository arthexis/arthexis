  ansible.builtin.template:
    src: ocpp-collector.service.j2
    dest: "/etc/systemd/system/{{ ocpp_collector_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart OCPP Collector

- name: Enable and start OCPP Collector
  become: true
  ansible.builtin.systemd:
    name: "{{ ocpp_collector_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Inspect existing nginx installation
  ansible.builtin.stat:
    path: /etc/nginx/nginx.conf
  register: ocpp_collector_nginx_config
  when: ocpp_collector_proxy_mode in ['auto', 'nginx']

- name: Resolve OCPP Collector proxy mode
  ansible.builtin.set_fact:
    ocpp_collector_resolved_proxy_mode: >-
      {{
        ('nginx' if ocpp_collector_nginx_config.stat.exists else 'missing')
        if ocpp_collector_proxy_mode == 'auto'
        else ocpp_collector_proxy_mode
      }}

- name: Refuse to guess reverse-proxy infrastructure
  ansible.builtin.assert:
    that:
      - ocpp_collector_resolved_proxy_mode != 'missing'
      - ocpp_collector_resolved_proxy_mode != 'nginx' or ocpp_collector_nginx_config.stat.exists
    fail_msg: >-
      No existing nginx installation was detected. Set
      ocpp_collector_proxy_mode=nginx when nginx is installed in a nonstandard
      layout, or ocpp_collector_proxy_mode=none when another reverse proxy/TLS
      layer owns exposure of the Collector.
  when: ocpp_collector_proxy_mode == 'auto'

- name: Validate nginx TLS paths when TLS is role-managed
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ ocpp_collector_tls_certificate }}"
    - "{{ ocpp_collector_tls_certificate_key }}"
  register: ocpp_collector_tls_files
  when:
    - ocpp_collector_resolved_proxy_mode == 'nginx'
    - ocpp_collector_tls_certificate | length > 0

- name: Assert nginx TLS files exist
  ansible.builtin.assert:
    that:
      - ocpp_collector_tls_files.results | map(attribute='stat.exists') | min
    fail_msg: "Configured OCPP Collector TLS certificate/key files do not exist."
  when:
    - ocpp_collector_resolved_proxy_mode == 'nginx'
    - ocpp_collector_tls_certificate | length > 0

- name: Render nginx OCPP Collector site
  become: true
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ ocpp_collector_nginx_site_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
  when: ocpp_collector_resolved_proxy_mode == 'nginx'

- name: Enable nginx OCPP Collector site
  become: true
  ansible.builtin.file:
    src: "{{ ocpp_collector_nginx_site_path }}"
    dest: "{{ ocpp_collector_nginx_site_link }}"
    state: link
  notify: Reload nginx
  when: ocpp_collector_resolved_proxy_mode == 'nginx'

- name: Validate nginx configuration before reload
  become: true
  ansible.builtin.command:
    argv:
      - nginx
      - -t
  changed_when: false
  when: ocpp_collector_resolved_proxy_mode == 'nginx'

- name: Flush OCPP Collector handlers
  ansible.builtin.meta: flush_handlers

- name: Verify local OCPP Collector API
  ansible.builtin.uri:
    url: "http://{{ ocpp_collector_listen_host }}:{{ ocpp_collector_listen_port }}/"
    method: GET
    status_code:
      - 200
    return_content: false
  register: ocpp_collector_health
  retries: 5
  delay: 2
  until: ocpp_collector_health.status == 200
