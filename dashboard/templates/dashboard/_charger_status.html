<div class="grid gap-3">
  {% for charger in chargers %}
  <div class="flex items-center justify-between rounded-2xl border border-white/10 bg-white/[0.03] px-4 py-3">
    <div class="flex items-center gap-3">
      <span class="h-2.5 w-2.5 rounded-full {% if charger.tone == 'emerald' %}bg-emerald-400{% elif charger.tone == 'sky' %}bg-sky-400{% else %}bg-rose-400{% endif %}"></span>
      <div>
        <div class="font-semibold text-white">{{ charger.name }}</div>
        <div class="text-xs text-slate-400">{{ charger.detail }}</div>
      </div>
    </div>
    <div class="text-right">
      <div class="text-sm font-medium text-slate-200">{{ charger.status }}</div>
      <div class="text-xs text-slate-400">{{ charger.power }}</div>
    </div>
  </div>
  {% endfor %}
</div>
