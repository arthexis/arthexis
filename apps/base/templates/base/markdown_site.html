<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Arthexis</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; line-height: 1.55; }
    header { border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
    nav, main { max-width: 960px; margin: 0 auto; padding: 1rem 1.25rem; }
    nav a { color: inherit; font-weight: 650; text-decoration: none; }
    main { padding-bottom: 4rem; }
    img { max-width: 100%; }
    pre { overflow-x: auto; padding: 1rem; border-radius: .4rem; }
    code { overflow-wrap: anywhere; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid color-mix(in srgb, currentColor 24%, transparent); padding: .45rem .6rem; text-align: left; }
    blockquote { margin-left: 0; padding-left: 1rem; border-left: .25rem solid color-mix(in srgb, currentColor 30%, transparent); }
  </style>
</head>
<body>
  <header><nav><a href="/">Arthexis</a></nav></header>
  <main>{{ content|safe }}</main>
</body>
</html>
