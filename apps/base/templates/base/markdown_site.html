<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Arthexis</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d1117;
      color: #e6edf3;
      line-height: 1.6;
    }

    a { color: #58a6ff; }
    a:hover { color: #79c0ff; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #30363d;
      background: rgba(13, 17, 23, .96);
      backdrop-filter: blur(8px);
    }

    .site-nav {
      max-width: 1180px;
      margin: 0 auto;
      padding: .8rem 1.5rem;
    }

    .site-nav a {
      color: #f0f6fc;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: .01em;
      text-decoration: none;
    }

    .page-shell {
      display: grid;
      grid-template-columns: minmax(190px, 250px) minmax(0, 1fr);
      gap: 2rem;
      max-width: 1180px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .reader-sidebar {
      align-self: start;
      position: sticky;
      top: 5rem;
      max-height: calc(100vh - 6rem);
      overflow: auto;
      padding-right: .75rem;
    }

    .reader-sidebar h2 {
      margin: 0 0 .75rem;
      color: #f0f6fc;
      font-size: .82rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .reader-sidebar ul {
      margin: 0;
      padding-left: 1rem;
      list-style: none;
    }

    .reader-sidebar li { margin: .3rem 0; }

    .reader-sidebar a {
      color: #8b949e;
      font-size: .9rem;
      text-decoration: none;
    }

    .reader-sidebar a:hover { color: #c9d1d9; }

    .markdown-body {
      min-width: 0;
      max-width: 880px;
    }

    .markdown-body > :first-child { margin-top: 0; }

    h1, h2, h3, h4, h5, h6 {
      color: #f0f6fc;
      line-height: 1.25;
    }

    h1 {
      margin: 0 0 1.25rem;
      padding-bottom: .35rem;
      border-bottom: 1px solid #21262d;
      font-size: clamp(2rem, 5vw, 2.6rem);
    }

    h2 {
      margin-top: 2.2rem;
      padding-bottom: .3rem;
      border-bottom: 1px solid #21262d;
      font-size: 1.5rem;
    }

    h3 { margin-top: 1.8rem; }

    p, li { color: #c9d1d9; }

    code {
      padding: .12rem .32rem;
      border-radius: .35rem;
      background: #161b22;
      color: #f0f6fc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    pre {
      overflow-x: auto;
      margin: 1rem 0;
      padding: 1rem;
      border: 1px solid #30363d;
      border-radius: .45rem;
      background: #161b22;
    }

    pre code {
      padding: 0;
      background: transparent;
    }

    table {
      display: block;
      width: 100%;
      overflow-x: auto;
      border-spacing: 0;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
    }

    th, td {
      padding: .5rem .7rem;
      border: 1px solid #30363d;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #161b22;
      color: #f0f6fc;
      font-weight: 650;
    }

    tr:nth-child(even) td { background: rgba(22, 27, 34, .45); }

    blockquote {
      margin: 1rem 0;
      padding: .2rem 1rem;
      border-left: .25rem solid #3b82f6;
      color: #8b949e;
    }

    hr {
      border: 0;
      border-top: 1px solid #30363d;
    }

    img { max-width: 100%; }

    @media (max-width: 800px) {
      .site-header { position: static; }

      .page-shell {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding-top: 1.25rem;
      }

      .reader-sidebar {
        position: static;
        max-height: none;
        padding: 0 0 1rem;
        border-bottom: 1px solid #30363d;
      }

      .reader-sidebar > div > ul {
        columns: 2;
        column-gap: 1.5rem;
        padding-left: 0;
      }
    }

    @media (max-width: 520px) {
      .site-nav,
      .page-shell { padding-left: 1rem; padding-right: 1rem; }

      .reader-sidebar > div > ul { columns: 1; }
      th, td { min-width: 7rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav"><a href="/">Arthexis</a></nav>
  </header>
  <main class="page-shell">
    {% if toc %}
      <aside class="reader-sidebar" aria-label="Contents">
        <h2>Contents</h2>
        {{ toc|safe }}
      </aside>
    {% endif %}
    <article class="markdown-body">
      {{ content|safe }}
    </article>
  </main>
</body>
</html>
